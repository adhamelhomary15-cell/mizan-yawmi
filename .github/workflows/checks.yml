# Runs the repo's own dev checks on every pull request and on main. Read-only: it builds and compares, never
# pushes or deploys. No secrets are used.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Generated files match the source
        run: |
          python3 tools/build.py
          node tools/check-settings.js --write-example
          git diff --exit-code -- index.html sw.js manifest.webmanifest settings.example.json \
            || { echo "::error::Run 'python3 tools/build.py' and 'node tools/check-settings.js --write-example', then commit the result."; exit 1; }

      - name: Script parts join the same way in Python and Node
        # Both stop on a missing, unlisted or repeated part in src/app/ORDER.
        run: |
          py_sha=$(python3 tools/build.py --print-source-sha)
          node_sha=$(node tools/lib/source.js --print-sha)
          [ "$py_sha" = "$node_sha" ] || { echo "::error::tools/build.py and tools/lib/source.js join src/app differently"; exit 1; }

      - name: Security
        run: |
          node tools/check-security.js
          node tools/check-security.js --self-test

      - name: Code standards
        run: |
          node tools/check-code.js
          node tools/check-code.js --self-test

      - name: Settings
        run: |
          node tools/check-settings.js
          node tools/check-settings.js --self-test

      - name: Edit rules
        run: |
          node tools/check-edit.js
          node tools/check-edit.js --self-test

      - name: Task paste
        run: |
          node tools/check-paste.js
          node tools/check-paste.js --self-test

      - name: Prayer-anchored blocks
        run: |
          node tools/check-anchors.js --require-fit
          node tools/check-anchors.js --self-test

      - name: Workout rules
        run: |
          node tools/check-workout.js
          node tools/check-workout.js --self-test

      - name: Schedule rules
        run: |
          node tools/check-schedule.js
          node tools/check-schedule.js --self-test

      - name: Data rules
        run: |
          node tools/check-data.js
          node tools/check-data.js --self-test

      - name: Backup rules
        run: |
          node tools/check-backup.js
          node tools/check-backup.js --self-test

      - name: Postpone rules
        run: |
          node tools/check-postpone.js
          node tools/check-postpone.js --self-test

      - name: Exercise art
        run: |
          node tools/check-guides.js
          node tools/check-guides.js --self-test

      - name: Privacy check works
        # The owner's private settings are not in the repo, so CI can only prove the checker itself works.
        # The real scan runs locally before each commit (AGENTS.md).
        run: node tools/check-private.js --self-test

  # The built app in real browsers (Chromium and WebKit) at phone size (feature 013). Dev-only: Playwright is pinned in
  # tests/e2e/package-lock.json and never shipped. Data is generated; on failure only screenshots and error notes are kept.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Build
        run: python3 tools/build.py

      - name: Install Playwright and its browsers
        working-directory: tests/e2e
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        working-directory: tests/e2e
        env:
          CI: 'true'
        run: npx playwright test

      - name: Keep the failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failures
          path: tests/e2e/test-results/
          retention-days: 7

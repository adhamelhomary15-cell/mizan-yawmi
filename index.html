<style>
/* Layout: phone-first RTL app. Oxblood shell (bottom bar on phones, side rail from 960px). World: Egyptian banknote inks on security paper; signature: the day's guilloche rosette. */
:root{
  --bg:#E7ECE3; --surface:#FAFBF6; --fg:#1D1B17; --muted:#585C52; --line:#CDD3C6; --quiet:#D6DBCF; --danger:#B4300C;
  --shell:#6E1A28; --shell-fg:#FAFBF6; --shell-dim:#E9C9CF;
  /* denominations: oxblood and madder (university), plum (course), sepia (work), ochre (gym, Quran, your time) */
  --uni:#7B1E2E; --study:#94304B; --course:#5B2A6B; --work:#5A402B; --gym:#735600; --quran:#6A4E00; --personal:#7A5A0A;
  --tint:9%;
  --font-display:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-mono:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-num:"Spectral",Georgia,"Times New Roman",serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16141A; --surface:#201D24; --fg:#EDE9E1; --muted:#A7A39A; --line:#36313B; --quiet:#3A3540; --danger:#FF9A76;
    --shell:#3A1119; --shell-fg:#EDE9E1; --shell-dim:#C9A3AA;
    --uni:#EE8E9C; --study:#F2A7B8; --course:#CFA0DD; --work:#D8B898; --gym:#E4C55C; --quran:#E8C96A; --personal:#EFD98F;
    --tint:15%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16141A; --surface:#201D24; --fg:#EDE9E1; --muted:#A7A39A; --line:#36313B; --quiet:#3A3540; --danger:#FF9A76;
  --shell:#3A1119; --shell-fg:#EDE9E1; --shell-dim:#C9A3AA;
  --uni:#EE8E9C; --study:#F2A7B8; --course:#CFA0DD; --work:#D8B898; --gym:#E4C55C; --quran:#E8C96A; --personal:#EFD98F;
  --tint:15%; color-scheme:dark;
}
html{scrollbar-color:var(--quiet) var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;caret-color:var(--course);accent-color:var(--course)}
::selection{background:color-mix(in srgb,var(--course) 28%,var(--surface));color:var(--fg)}
#app{min-height:60vh}
.wrap{max-width:720px;margin:0 auto;padding-inline:var(--s4);padding-block:18px 128px;display:flex;flex-direction:column;gap:var(--s5)}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.2}
h2{font-family:var(--font-display);font-weight:500;font-size:18px;line-height:1.35}
h3{font-family:var(--font-display);font-weight:500;font-size:16px;line-height:1.35}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--course);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec{display:flex;flex-direction:column;gap:var(--s3)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:var(--s1) var(--s3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.c-uni{--c:var(--uni)} .c-study{--c:var(--study)} .c-course{--c:var(--course)} .c-work{--c:var(--work)} .c-gym{--c:var(--gym)} .c-quran{--c:var(--quran)} .c-personal{--c:var(--personal)} .c-move{--c:var(--quiet)} .c-rest{--c:var(--quiet)} .c-life{--c:var(--gym)}

/* headers: the heading leads, the date sits under it */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.top-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.sub{font-size:14px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding-top:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.sync.cloud i{background:var(--gym)}
.btn{min-height:40px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn svg{width:16px;height:16px;flex:none}
.top > .btn{white-space:nowrap;flex:none}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.icon-btn svg{width:18px;height:18px}

/* day picker */
.daypick{display:block}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-width:0}
.dp{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;padding:4px 0;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;line-height:1.3}
.dp .dn{font-size:12px;color:var(--muted)}
.dp .dd{font-family:var(--font-mono);font-weight:600;font-size:15px}
.dp.is-today .dn{color:var(--fg);font-weight:600}
.dp.is-today{border-color:var(--line)}
.dp[aria-pressed="true"]{background:var(--shell);color:var(--shell-fg);border-color:var(--shell)}
.dp[aria-pressed="true"] .dn{color:var(--shell-dim)}

/* now card: the block in progress, one tap to finish it */
.now{display:flex;flex-direction:column;gap:var(--s3);background:color-mix(in srgb,var(--c) var(--tint),var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-radius:18px;padding:var(--s4)}
.now-title{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.3}
.now-meta{font-size:14px;color:var(--muted)}
.now-meta b{color:var(--c);font-weight:600}
.now-actions{display:flex;flex-wrap:wrap;gap:var(--s2)}
.now-actions .btn{min-height:48px;font-size:15px;padding-inline:18px}
.now-actions .btn.primary{background:var(--c);border-color:var(--c);color:var(--surface);flex:1 1 12rem}
.now-actions .btn.primary[aria-pressed="true"]{background:var(--surface);color:var(--c)}
.now-next{display:flex;flex-direction:column;gap:2px;border-top:1px solid color-mix(in srgb,var(--c) 22%,var(--line));padding-top:var(--s3);font-size:14px}
.now-next .row-line{display:flex;justify-content:space-between;gap:var(--s3)}
.now-next .lbl{color:var(--muted)}
.now-done{font-family:var(--font-display);font-weight:500;font-size:18px}

/* prayers */
.prayers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;text-align:center}
.pr{display:flex;flex-direction:column;padding:6px 2px;border-radius:10px}
.pr .pn{font-size:12px;color:var(--muted)}
.pr .pt{font-family:var(--font-mono);font-weight:600;font-size:14px}
.pr.next{background:color-mix(in srgb,var(--quran) var(--tint),var(--surface));outline:1px solid var(--quran)}
.pr.next .pn{color:var(--quran);font-weight:600}
.pr.past .pt{color:var(--muted)}

/* progress */
.prog{display:flex;flex-direction:column;gap:6px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);font-size:14px}
.track{height:8px;border-radius:4px;background:color-mix(in srgb,var(--line) 75%,transparent);overflow:hidden}
.fill{height:100%;background:var(--c,var(--fg));border-radius:4px;transition:width .2s cubic-bezier(.16,1,.3,1)}

/* balance: university and course on one pan, work and life on the other */
.balance{display:flex;flex-direction:column;gap:var(--s2)}
.balance svg{width:100%;max-width:280px;height:auto;align-self:center}
.balance .ring{fill:none;stroke:var(--line);stroke-width:1}
.balance .petal{fill:none;stroke:var(--c);stroke-width:1.1;transition:stroke .45s cubic-bezier(.16,1,.3,1),stroke-width .45s cubic-bezier(.16,1,.3,1)}
.balance .petal.off{stroke:var(--quiet);stroke-width:.8}
.balance .axis-line{stroke:var(--line);stroke-width:1}
.balance .core{fill:var(--surface);stroke:var(--line);stroke-width:1}
.balance .core-num{font-family:var(--font-num);font-weight:700;font-size:24px;fill:var(--fg)}
.balance .core-lbl{font-family:var(--font-body);font-size:10px;fill:var(--muted)}
.balance-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);font-size:14px}
.balance-legend div{display:flex;flex-direction:column;gap:2px}
.balance-legend b{font-family:var(--font-num);font-size:26px;font-weight:700;line-height:1.1}
.balance-legend .a b{color:var(--uni)} .balance-legend .b b{color:var(--gym)}
.balance-legend .b{text-align:end}
.balance-note{font-size:14px;color:var(--muted);text-align:center}

/* timeline */
.note{color:var(--muted);font-size:14px;max-width:62ch}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:44px 82px minmax(0,1fr) auto;gap:var(--s2);align-items:start;border-radius:14px}
.row.main{background:color-mix(in srgb,var(--c) var(--tint),var(--surface));padding:6px 10px 6px 6px}
.row.quiet{padding:2px 10px 2px 6px;color:var(--muted);font-size:14px}
.row.is-now{outline:2px solid var(--fg);outline-offset:-2px}
.row.quiet.is-now{background:var(--surface)}
.row.skipped{background:transparent;border:1px dashed var(--line)}
.chk{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
.chk i{width:28px;height:28px;border-radius:50%;border:2px solid var(--c);background:var(--surface);display:grid;place-items:center;transition:background .15s ease}
.chk svg{width:15px;height:15px;opacity:0;color:var(--surface)}
.chk[aria-checked="true"] i{background:var(--c)}
.chk[aria-checked="true"] svg{opacity:1}
.chk:disabled{cursor:default}
.chk:disabled i{border-style:dashed;border-color:var(--muted);background:transparent}
.row-body{display:block;width:100%;text-align:start;background:none;border:0;padding:8px 0;cursor:pointer;border-radius:10px;min-width:0}
.row.quiet .row-body{cursor:default;padding:6px 0}
.row-body > span{display:block}
.row.done .title,.row.skipped .title{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
.time{display:flex;flex-direction:column;line-height:1.35;padding-top:10px;white-space:nowrap;min-width:0}
.row.quiet .time{padding-top:7px}
.time .t{font-family:var(--font-mono);font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums}
.row.quiet .time .t{font-weight:500;font-size:13px}
.time .suf{font-size:11.5px;color:var(--muted);margin-inline-start:2px}
.time .end{font-size:12px;color:var(--muted)}
.time .end .t{font-size:12px;font-weight:500}
.title{font-weight:600;font-size:15.5px;line-height:1.45}
.row.quiet .title{font-weight:400;font-size:14px}
.subj{font-weight:600}
.meta{margin-top:2px;font-size:13px;color:var(--muted);text-wrap:pretty}
.meta b{color:var(--c);font-weight:600}
.now-pill{display:inline-block;font-size:11px;font-weight:600;background:var(--fg);color:var(--bg);padding:0 8px;border-radius:999px;margin-inline-start:6px;vertical-align:2px}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mk{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.mk svg{width:12px;height:12px;color:var(--quran)}
.mk.appt{border-color:var(--quran);color:var(--quran);font-weight:600}
.denom{direction:ltr;unicode-bidi:isolate;font-family:var(--font-num);font-weight:700;font-size:26px;line-height:1;color:var(--c);padding-top:10px;white-space:nowrap;font-variant-numeric:lining-nums}
.denom small{font-family:var(--font-body);font-weight:500;font-size:11px;margin-inline-start:2px}
.row.done .denom,.row.skipped .denom{opacity:.45}
.row-actions{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:var(--s2);padding:0 0 var(--s2)}
.add-block{align-self:flex-start}
.head-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.o-head .top{flex-wrap:wrap}
.arrows{display:inline-flex;gap:6px}
.review-all{align-self:flex-start}
.review{display:flex;flex-direction:column;gap:var(--s3);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:var(--s4)}
.review-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.review-list li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s2) var(--s3);padding:10px 0;border-top:1px solid var(--line)}
.review-list li:first-child{border-top:0}
.review-text{display:flex;flex-direction:column;min-width:0;flex:1 1 12rem}
.review-actions{display:flex;gap:var(--s2)}
.review-actions .btn.primary{background:var(--c);border-color:var(--c);color:var(--surface)}
.review-empty{font-family:var(--font-display);font-weight:500;font-size:17px}
.add-task{align-self:flex-start}
.panel > .add-task{display:inline-flex}

/* main target */
.target{display:flex;flex-direction:column;gap:6px;width:100%;text-align:start;cursor:pointer;background:color-mix(in srgb,var(--course) var(--tint),var(--surface));border:1px solid color-mix(in srgb,var(--course) 30%,var(--line));border-radius:14px;padding:12px 14px}
.target:hover{border-color:var(--course)}
.target-name{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.3}
.target .track{display:block;height:6px}

/* tasks */
.tlist{display:flex;flex-direction:column}
.titem{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:var(--s2);align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.titem:first-child{border-top:0}
.titem .ttext{overflow-wrap:anywhere}
.titem.done .ttext{text-decoration:line-through;color:var(--muted)}
.ttag{font-size:12px;color:var(--c);font-weight:600}
.tdue{font-size:12px;color:var(--muted)}
.tdue.late{color:var(--danger);font-weight:600}
.del{min-height:44px;min-width:44px;background:none;border:0;color:var(--muted);cursor:pointer;padding:0 8px;border-radius:10px;font-size:13px}
.del:hover{color:var(--danger)}

/* week */
.strips{display:flex;flex-direction:column;gap:2px}
.strip{display:grid;grid-template-columns:46px minmax(0,1fr);align-items:center;gap:var(--s2);width:100%;min-height:36px;background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;text-align:start}
.strip:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.strip-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.today-dot{width:6px;height:6px;border-radius:50%;background:var(--fg);display:inline-block}
.bar{position:relative;height:16px;border-radius:4px;background:color-mix(in srgb,var(--line) 55%,transparent);overflow:hidden}
.seg{position:absolute;top:0;bottom:0;background:var(--c);box-shadow:inset 1px 0 0 var(--surface)}
.seg.c-move,.seg.c-rest{background:var(--quiet)}
.seg.skipped{opacity:.35}
.tick{position:absolute;top:0;bottom:0;width:1.5px;background:var(--fg);opacity:.45}
.nowmark{position:absolute;top:0;bottom:0;width:2.5px;background:var(--fg)}
.axis{display:grid;grid-template-columns:46px minmax(0,1fr);gap:var(--s2);padding-inline:6px;margin-top:2px}
.axis-track{position:relative;height:18px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.axis-track span{position:absolute;top:0;white-space:nowrap;transform:translateX(50%)}
.axis-track span.first{transform:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 6px 2px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.legend .tk{width:2px;height:10px;border-radius:0;background:var(--fg);opacity:.5}
.stats{display:flex;flex-direction:column;gap:14px}
.stat{display:grid;grid-template-columns:minmax(0,8rem) minmax(0,1fr) auto;gap:var(--s3);align-items:center;font-size:14px}
.stat .track{height:10px;border-radius:5px}
.stat .val{font-size:12.5px;color:var(--muted);text-align:end;white-space:nowrap}
.stat .val b{font-family:var(--font-mono);color:var(--fg);font-weight:600}
.stat .extra{grid-column:1 / -1;font-size:12.5px;color:var(--muted);margin-top:-8px}
details.rules-box summary{cursor:pointer;font-family:var(--font-display);font-weight:500;font-size:16px;padding:var(--s2) 0;list-style-position:inside}
.rules{margin:var(--s2) 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:7px;max-width:64ch;font-size:14px}

/* course */
.weeks{display:flex;flex-direction:column;gap:10px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 4px}
.week.is-current{border-color:var(--course);box-shadow:0 0 0 1px var(--course)}
.week-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap;padding-bottom:6px}
.week-dates{font-size:13px;color:var(--muted)}
.cur-pill{font-size:12px;font-weight:600;color:var(--course)}
.week-note{font-size:13px;color:var(--muted);padding-bottom:8px}
.mod{display:grid;grid-template-columns:44px auto minmax(0,1fr);gap:var(--s2);align-items:center;padding:2px 0;border-top:1px solid var(--line)}
.mod .mnum{font-family:var(--font-mono);font-weight:600;color:var(--course);min-width:2.2ch}
.mod .mtitle{overflow-wrap:anywhere}
.mod .mextra{color:var(--muted);font-size:13px}
.mod.done .mtitle bdi{text-decoration:line-through;color:var(--muted)}
.mod .chk{--c:var(--course)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips .star{width:14px;height:14px;color:var(--work)}
.chips button[aria-pressed="true"] .star{color:inherit}

/* forms */
.form{display:flex;flex-direction:column;gap:10px}
.form-row{display:flex;flex-wrap:wrap;gap:var(--s2)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 9rem;min-width:0}
.field.wide{flex-basis:100%}
.field input,.field select,.field textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%;min-height:44px}
.field textarea{min-height:9rem;resize:vertical;line-height:1.7}
::placeholder{color:var(--muted);opacity:1}
.form-err{font-size:13px;color:var(--danger)}
.appt{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--s2);align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.appt:first-child{border-top:0}
.appt .when{font-size:13px;color:var(--muted)}
.empty{font-size:14px;color:var(--muted);padding:6px 0}
.filters{display:flex;gap:6px}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.add-form{display:flex;flex-direction:column;gap:10px}
.course-form{gap:12px}
.install{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.install p{display:flex;flex-direction:column;min-width:0}

/* layout blocks */
.today-view,.weekv,.coursev,.tasksv{display:flex;flex-direction:column;gap:var(--s5)}
.today-main,.today-side{display:contents}
.o-head{order:0} .o-now{order:1} .o-target{order:2} .o-tasks{order:3} .o-timeline{order:4} .o-prayers{order:5} .o-balance{order:6}
.brand{display:none}

/* toast with undo */
.toast{position:fixed;inset-inline:var(--s4);bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:6;max-width:520px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);background:var(--fg);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;box-shadow:0 8px 24px rgba(10,16,22,.22)}
.toast p{padding-inline-start:10px;font-size:14px}
.toast .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}

/* bottom nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:5;background:var(--shell);color:var(--shell-fg);padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px))}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;min-height:52px;padding:6px 0;border-radius:12px;cursor:pointer;color:var(--shell-dim);font-size:12px}
.nav button:focus-visible{outline-color:var(--shell-fg)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--shell-fg);font-weight:600;background:color-mix(in srgb,var(--shell-fg) 16%,transparent)}

.fail{max-width:560px;margin:40px auto;padding-inline:16px;color:var(--muted);text-align:center}
@media (max-width:400px){
  .row{grid-template-columns:44px 76px minmax(0,1fr) auto;gap:6px}
  .time .end{font-size:11.5px}
  .stat{grid-template-columns:minmax(0,6rem) minmax(0,1fr) auto}
}
@media (min-width:960px){
  .shell{padding-inline-start:232px}
  .nav{top:0;bottom:0;inset-inline-start:0;inset-inline-end:auto;width:232px;padding:28px 14px;display:flex;flex-direction:column;gap:22px}
  .nav-in{display:flex;flex-direction:column;gap:4px;max-width:none;margin:0}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;padding:10px 12px;font-size:15px}
  .brand{display:block;font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.3;padding-inline:12px}
  .brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--shell-dim);margin-top:4px}
  .wrap{max-width:1120px;padding-inline:40px;padding-block:36px 48px;gap:var(--s6)}
  .toast{bottom:var(--s5)}
  .today-view{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"head head" "main side";gap:var(--s6) 36px;align-items:start}
  .o-head{grid-area:head}
  .today-main{display:flex;flex-direction:column;gap:var(--s5);grid-area:main;min-width:0}
  .today-side{display:flex;flex-direction:column;gap:var(--s5);grid-area:side;position:sticky;top:24px;min-width:0}
  .daypick{max-width:640px}
  .weekv{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-areas:"head head" "strips balance" "strips stats" "subjects rules";gap:var(--s5) 36px;align-items:start}
  .a-head{grid-area:head} .a-balance{grid-area:balance} .a-strips{grid-area:strips} .a-stats{grid-area:stats} .a-subjects{grid-area:subjects} .a-rules{grid-area:rules}
  .weeks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .coursev .prog,.course-form{max-width:760px}
  .tasksv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"head head" "tasks appts";gap:var(--s5) 36px;align-items:start}
  .a-tasks{grid-area:tasks} .a-appts{grid-area:appts}
}
@media (prefers-reduced-motion: reduce){ .fill,.balance .petal,.chk i{transition:none} }

  const cairoFmt = new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});

      const st = statusOf(store, d, bl.key); if (st === 'skip') return;
      const m = bl.e - bl.s, side = f === 'a' ? a : b;
      side.plan += m; if (st === 'done'){ side.done += m; side.by[bl.cat] = (side.by[bl.cat] || 0) + m; }
    }));
    return {a, b};
  }

  /* ---------------- Today ---------------- */
  function WeekArrows({iso, setIso}){
    return html`<span class="arrows">
      <button type="button" class="icon-btn" aria-label="الأسبوع اللي فات" onClick=${() => setIso(addDays(iso, -7))}><${Chevron} dir="prev" /></button>
      <button type="button" class="icon-btn" aria-label="الأسبوع الجاي" onClick=${() => setIso(addDays(iso, 7))}><${Chevron} dir="next" /></button>
    </span>`;
  }
  function DayPicker({iso, setIso, now}){
    const ws = weekStart(iso);
    const days = WEEK_ORDER.map((_, i) => addDays(ws, i));
    return html`<div class="daypick">
      <div class="days">
        ${days.map(d => html`<button type="button" class=${'dp' + (d === now.iso ? ' is-today' : '')} aria-pressed=${d === iso ? 'true' : 'false'} aria-label=${DAY_NAMES[weekday(d)] + ' ' + dateLabel(d)} onClick=${() => setIso(d)}>
          <span class="dn">${DAY_SHORT[weekday(d)]}</span><span class="dd">${Number(d.slice(8))}</span></button>`)}
      </div>
    </div>`;
  }

  function PrayerCard({iso, now}){
    const p = prayers(iso);
    if (!p) return null;
    const isToday = iso === now.iso;
    const fri = weekday(iso) === 5;
    let nextKey = null;
    if (isToday){ const nx = PRAYERS.find(([k]) => p[k] > now.min); nextKey = nx ? nx[0] : null; }
    return html`<div class="panel" style="padding:10px" aria-label="مواعيد الصلاة">
      <div class="prayers">
        ${PRAYERS.map(([k, name]) => html`<div class=${'pr' + (k === nextKey ? ' next' : '') + (isToday && p[k] <= now.min ? ' past' : '')}>
          <span class="pn">${fri && k === 'dhuhr' ? 'الجمعة' : name}</span>
          <span class="pt">${fmt(p[k]).t}</span></div>`)}
      </div>
    </div>`;
  }

  function TargetCard({iso, store, goTab}){
    const c = mainCourse(store);
    const plan = planOf(c), dm = doneMap(store, c);
    const all = plan.reduce((a, w) => a.concat(w.items), []);
    const n = all.filter(it => dm[it[3]]).length;
    const wk = plan.find(w => iso >= w.from && iso <= w.to) || (iso < plan[0].from ? plan[0] : null);
    const next = all.find(it => !dm[it[3]]);
    const behind = wk ? wk.items.filter(it => !dm[it[3]]).length : 0;
    return html`<button type="button" class="target c-course" onClick=${() => goTab('course')}>
      <span class="target-name"><bdi>${c.name}</bdi></span>
      <span class="small muted">التارجت الأساسي · خلّصت <bdi class="num">${n}</bdi> من <bdi class="num">${all.length}</bdi> موديول</span>
      <span class="track"><span class="fill" style=${{display:'block', width: (all.length ? n/all.length*100 : 0).toFixed(1) + '%'}}></span></span>
      ${next ? html`<span class="small">الجاي: <bdi dir="ltr">${next[0]} · ${next[1]}</bdi></span>
        ${wk && behind ? html`<span class="small muted">فاضل <bdi class="num">${behind}</bdi> في خطة الأسبوع ده</span>` : null}`
        : html`<span class="small">خلّصت الكورس كله.</span>`}
    </button>`;
  }

  function DayProgress({iso, store}){
    const k = dayCounts(iso, store);
    const pct = k.total ? Math.round(k.done / k.total * 100) : 0;
    return html`<div class="prog" style="--c:var(--fg)">
      <div class="prog-row"><span>خلّصت <bdi class="num">${k.done}</bdi> من <bdi class="num">${k.total}</bdi>${k.skip ? html`<span class="muted"> · اتلغى <bdi class="num">${k.skip}</bdi></span>` : null}</span><span class="muted small"><bdi class="num">${hoursText(k.doneMin)}</bdi> س متعلّمة</span></div>
      <div class="track"><div class="fill" style=${{width: pct + '%'}}></div></div>
    </div>`;
  }

  function NowCard({iso, now, store, update, skip, onReview}){
    const blocks = dayBlocks(iso, store).filter(b => CATS[b.cat].track);
    const live = blocks.filter(b => now.min >= b.s && now.min < b.e && statusOf(store, iso, b.key) !== 'skip');
    const cur = live.length ? live[live.length - 1] : null;
    const upcoming = blocks.filter(b => b.s > now.min && statusOf(store, iso, b.key) === null);
    const main = cur || upcoming[0] || null;
    const after = main ? blocks.find(b => b.s >= main.e && b !== main && statusOf(store, iso, b.key) !== 'skip') || upcoming.find(b => b !== main) : null;
    const p = prayers(iso);
    const nx = p ? PRAYERS.find(([k]) => p[k] > now.min) : null;
    const fri = weekday(iso) === 5;
    if (!main) return html`<section class="now c-quran" aria-label="دلوقتي">
      <p class="now-done">مفيش حاجة تانية في جدول النهارده.</p>
      ${(() => { const left = blocks.filter(b => statusOf(store, iso, b.key) === null).length; return left ? html`<p class="now-meta">فيه <bdi class="num">${left}</bdi> بلوك لسه معلّمتش عليهم.</p>
        <div class="now-actions"><button type="button" class="btn primary" onClick=${onReview}>راجع يومك</button></div>` : null; })()}
      <${DayProgress} iso=${iso} store=${store} />
    </section>`;
    const st = statusOf(store, iso, main.key);
    return html`<section class=${'now c-' + main.cat} aria-label="دلوقتي">
      <div>
        <p class="now-title"><${Title} text=${main.title} /></p>
        <p class="now-meta"><b>${CATS[main.cat].label}</b> · ${cur
          ? html`فاضل ${countdown(main.e - now.min)} · لحد ${fmtStr(main.e)}`
          : html`بيبدأ ${fmtStr(main.s)}، بعد ${countdown(main.s - now.min)}`}</p>
      </div>
      <div class="now-actions">
        <button type="button" class="btn primary" aria-pressed=${st === 'done' ? 'true' : 'false'} onClick=${() => setStatus(update, iso, main.key, st === 'done' ? null : 'done')}><${CheckSvg} />${st === 'done' ? 'اتعلّم، رجّعه' : 'خلّصته'}</button>
        <button type="button" class="btn" onClick=${() => skip(main)}>اتلغى النهارده</button>
      </div>
      <div class="now-next">
        ${after ? html`<p class="row-line"><span class="lbl">بعده</span><span><${Title} text=${after.title} /> · ${fmtStr(after.s)}</span></p>` : null}
        ${nx ? html`<p class="row-line"><span class="lbl">${fri && nx[0] === 'dhuhr' ? 'الجمعة' : nx[1]}</span><span>${fmtStr(p[nx[0]])} · بعد ${countdown(p[nx[0]] - now.min)}</span></p>` : null}
      </div>
      <${DayProgress} iso=${iso} store=${store} />
    </section>`;
  }

  // Night review: everything not yet marked, one tap each. Opened from the header button.
  function Review({iso, now, store, update, skip, act, onClose}){
    const isToday = iso === now.iso;
    const tracked = dayBlocks(iso, store).filter(b => CATS[b.cat].track);
    const open = tracked.filter(b => statusOf(store, iso, b.key) === null && (!isToday || b.s <= now.min));
    const later = isToday ? tracked.filter(b => statusOf(store, iso, b.key) === null && b.s > now.min).length : 0;
    const ab = balanceOf([iso], store);
    return html`<section class="review" aria-label="مراجعة اليوم">
      <div class="sec-head"><h2>${isToday ? 'راجع يومك' : 'مراجعة ' + DAY_NAMES[weekday(iso)]}</h2><button type="button" class="btn ghost small" onClick=${onClose}>اقفل</button></div>
      ${open.length ? html`<ul class="review-list">
        ${open.map(b => html`<li class=${'c-' + b.cat}>
          <div class="review-text"><span class="title"><${Title} text=${b.title} /></span><span class="meta"><b>${CATS[b.cat].label}</b> · ${fmtStr(b.s)} لحد ${fmtStr(b.e)}</span></div>
          <div class="review-actions">
            <button type="button" class="btn primary" onClick=${() => setStatus(update, iso, b.key, 'done')}><${CheckSvg} />خلّصته</button>
            <button type="button" class="btn" onClick=${() => skip(b)}>اتلغى</button>
          </div>
        </li>`)}
      </ul>` : html`<p class="review-empty">${later ? 'كل اللي فات متعلّم.' : 'كل بلوكات اليوم متعلّمة.'}</p>`}
      ${open.length > 1 ? html`<button type="button" class="btn review-all" onClick=${() => act('اتعلّم ' + open.length + ' بلوك إنهم خلصوا', s => { const c = s.checks[iso] || {}; open.forEach(b => { c[b.key] = true; }); s.checks[iso] = c; return s; })}><${CheckSvg} />علّمهم كلهم خلصوا</button>` : null}
      ${later ? html`<p class="small muted">فاضل <bdi class="num">${later}</bdi> بلوك لسه ميعادهم مجاش.</p>` : null}
      <${DayProgress} iso=${iso} store=${store} />
      <${Balance} a=${ab.a} b=${ab.b} label=${isToday ? 'النهارده' : 'اليوم ده'} />
    </section>`;
  }

  function AddBlock({iso, update, onDone}){
    const [title, setTitle] = useState('');
    const [s, setS] = useState('');
    const [e, setE] = useState('');
    const [cat, setCat] = useState('study');
    const [err, setErr] = useState('');
    const submit = ev => {
      ev.preventDefault();
      if (!title.trim()) return setErr('اكتب اسم الحاجة.');
      if (!s || !e) return setErr('اختار هتبدأ إمتى وهتخلص إمتى.');
      if (hmToMin(e) <= hmToMin(s)) return setErr('ميعاد الخلصان لازم يكون بعد البداية.');
      setErr('');
      update(st => { const list = (st.extras[iso] || []).slice(); list.push({id: uid36(), s, e, cat, title: title.trim().slice(0, 80)}); st.extras[iso] = list; return st; });
      onDone();
    };
    return html`<form class="panel add-form" onSubmit=${submit}>
      <div class="sec-head"><h2>حاجة زيادة لليوم ده</h2><button type="button" class="btn ghost small" onClick=${onDone}>إلغاء</button></div>
      <div class="form-row">
        <label class="field wide" for="ab-title">إيه هي<input id="ab-title" value=${title} onInput=${x => setTitle(x.target.value)} placeholder="مثلاً: محاضرة تعويضية Networks" maxlength="80" /></label>
        <label class="field" for="ab-s">من<input id="ab-s" type="time" value=${s} onInput=${x => setS(x.target.value)} /></label>
        <label class="field" for="ab-e">لحد<input id="ab-e" type="time" value=${e} onInput=${x => setE(x.target.value)} /></label>
        <label class="field" for="ab-cat">النوع<select id="ab-cat" value=${cat} onChange=${x => setCat(x.target.value)}>
          ${['uni','study','course','work','gym','quran','personal'].map(k => html`<option value=${k}>${CATS[k].label}</option>`)}</select></label>
      </div>
      ${err ? html`<p class="form-err" role="alert">${err}</p>` : null}
      <div><button type="submit" class="btn primary">ضيفها</button></div>
    </form>`;
  }

  function TodayView({iso, setIso, now, store, update, goTab, remove, act}){
    const skip = b => act('اتلغى "' + plainTitle(b.title) + '" النهارده', s => { const c = s.checks[iso] || {}; c[b.key] = 'skip'; s.checks[iso] = c; return s; });
    const blocks = dayBlocks(iso, store);
    const p = prayers(iso);
    const appts = apptsFor(iso, store);
    const isToday = iso === now.iso;
    const [open, setOpen] = useState(null);
    const [adding, setAdding] = useState(false);
    const [reviewing, setReviewing] = useState(false);
    useEffect(() => { setOpen(null); setAdding(false); }, [iso]);
    const dayTasks = store.tasks.filter(t => !t.done && t.due && (t.due === iso || (isToday && t.due < iso)));
    const wd = weekday(iso);
    const ab = balanceOf([iso], store);

    return html`<div class="today-view">
      <div class="sec o-head">
        <div class="top">
          <div class="top-meta">
            <h1>${DAY_NAMES[wd]}</h1>
            <p class="sub">${dateLabel(iso)}${isToday ? ' · النهارده' : ''}</p>
          </div>
          <div class="head-actions">
            ${!isToday ? html`<button type="button" class="btn" onClick=${() => setIso(now.iso)}>النهارده</button>` : null}
            <button type="button" class="btn" aria-expanded=${reviewing ? 'true' : 'false'} onClick=${() => setReviewing(!reviewing)}>${reviewing ? 'اقفل المراجعة' : 'راجع يومك'}</button>
            <${WeekArrows} iso=${iso} setIso=${setIso} />
          </div>
        </div>
        <${DayPicker} iso=${iso} setIso=${setIso} now=${now} />
      </div>

      <div class="today-main">
        <div class="o-now">${reviewing ? html`<${Review} iso=${iso} now=${now} store=${store} update=${update} skip=${skip} act=${act} onClose=${() => setReviewing(false)} />`
          : isToday ? html`<${NowCard} iso=${iso} now=${now} store=${store} update=${update} skip=${skip} onReview=${() => setReviewing(true)} />` : html`<${DayProgress} iso=${iso} store=${store} />`}</div>

        <div class="sec o-timeline">
          <ol class="timeline">
            ${blocks.map(b => {
              const quiet = b.cat === 'rest' || b.cat === 'move';
              const tracked = CATS[b.cat].track;
              const cur = isToday && now.min >= b.s && now.min < b.e;
              const st = statusOf(store, iso, b.key);
              const isOpen = open === b.key;
              const marks = [];
              if (p) PRAYERS.forEach(([k, name]) => { if (k !== 'fajr' && p[k] >= b.s && p[k] < b.e) marks.push({kind:'pr', text:(wd === 5 && k === 'dhuhr' ? 'الجمعة' : name) + ' ' + fmtStr(p[k]), at:p[k]}); });
              appts.forEach(a => { if (a.min >= b.s && a.min < b.e) marks.push({kind:'appt', text:a.label + ' ' + fmtStr(a.min), at:a.min}); });
              marks.sort((x, y) => x.at - y.at);
              const markEls = marks.length ? html`<span class="marks">${marks.map(m => html`<span class=${'mk' + (m.kind === 'appt' ? ' appt' : '')}>${m.kind === 'pr' ? html`<${Moon} />` : null}${m.text}</span>`)}</span>` : null;
              const body = html`
                <span class="title"><${Title} text=${b.title} />${quiet ? html`<span class="muted small"> · ${durText(b.e - b.s)}</span>` : null}${cur ? html`<span class="now-pill">دلوقتي</span>` : null}</span>
                ${quiet ? (b.detail ? html`<span class="meta">${b.detail}</span>` : null)
                  : html`<span class="meta"><b>${CATS[b.cat].label}</b>${st === 'skip' ? ' · اتلغى' : ''}${b.detail ? ' · ' + b.detail : ''}</span>`}
                ${markEls}`;
              return html`<li class=${'row ' + (quiet ? 'quiet' : 'main') + ' c-' + b.cat + (cur ? ' is-now' : '') + (st === 'done' ? ' done' : '') + (st === 'skip' ? ' skipped' : '')}>
                <div>${tracked ? html`<${Check} on=${st === 'done'} cat=${b.cat} label=${'خلّصت: ' + plainTitle(b.title)} onToggle=${() => setStatus(update, iso, b.key, st === 'done' ? null : 'done')} />` : null}</div>
                <div class="time"><span><${Time} min=${b.s} /></span>${quiet ? null : html`<span class="end">لحد <${Time} min=${b.e} /></span>`}</div>
                ${quiet && !b.extra
                  ? html`<div class="row-body">${body}</div>`
                  : html`<button type="button" class="row-body" aria-expanded=${isOpen ? 'true' : 'false'} onClick=${() => setOpen(isOpen ? null : b.key)}>${body}</button>`}
                ${quiet ? null : html`<span class="denom" aria-hidden="true">${(b.e - b.s) < 60 ? (b.e - b.s) : hoursText(b.e - b.s)}<small>${(b.e - b.s) < 60 ? 'د' : 'س'}</small></span>`}
                ${isOpen ? html`<div class="row-actions">
                  ${tracked ? (st === 'skip'
                    ? html`<button type="button" class="btn" onClick=${() => { setStatus(update, iso, b.key, null); setOpen(null); }}>رجّعه للجدول</button>`
                    : html`<button type="button" class="btn" onClick=${() => { setOpen(null); skip(b); }}>اتلغى النهارده</button>`) : null}
                  ${b.extra ? html`<button type="button" class="btn ghost" onClick=${() => { setOpen(null); remove('اتمسحت "' + b.title + '"', s => { s.extras[iso] = (s.extras[iso] || []).filter(x => x.id !== b.extra); return s; }); }}>امسحها</button>` : null}
                </div>` : null}
              </li>`;
            })}
          </ol>
          ${adding ? html`<${AddBlock} iso=${iso} update=${update} onDone=${() => setAdding(false)} />`
            : html`<button type="button" class="btn add-block" onClick=${() => setAdding(true)}><${Plus} />ضيف حاجة لليوم ده</button>`}
          <p class="note">${SCHED[wd].note}</p>
          <p class="small muted">دوس على أي بلوك عشان تلغيه النهارده. ${p ? 'الفجر ' + fmtStr(p.fajr) + '، والمواعيد محسوبة للجيزة بطريقة الهيئة المصرية العامة للمساحة.' : ''}</p>
        </div>
      </div>

      <aside class="today-side">
        <div class="o-target"><${TargetCard} iso=${iso} store=${store} goTab=${goTab} /></div>
        ${dayTasks.length ? html`<div class="sec o-tasks">
          <div class="sec-head"><h2>مهام ${isToday ? 'النهارده' : 'اليوم ده'}</h2><button type="button" class="btn ghost small" onClick=${() => goTab('tasks')}>كل المهام</button></div>
          <div class="panel tlist" style="padding-block:4px">
            ${dayTasks.map(t => html`<div class=${'titem c-' + t.tag}>
              <${Check} on=${false} cat=${t.tag} label=${'خلّص: ' + t.text} onToggle=${() => update(s => { const x = s.tasks.find(y => y.id === t.id); if (x) x.done = true; return s; })} />
              <span class="ttext">${t.text}</span>
              <span class=${'tdue' + (t.due < iso ? ' late' : '')}>${t.due < iso ? 'متأخرة' : TASK_TAGS[t.tag]}</span>
            </div>`)}
          </div>
        </div>` : null}
        <div class="sec o-prayers"><h2>مواعيد الصلاة</h2><${PrayerCard} iso=${iso} now=${now} /></div>
        <div class="sec o-balance"><h2>ميزان اليوم</h2><div class="panel"><${Balance} a=${ab.a} b=${ab.b} label="النهارده" /></div></div>
      </aside>
    </div>`;
  }

  /* ---------------- Week ---------------- */
  function WeekView({iso, setIso, now, store, goDay}){
    const ws = weekStart(iso);
    const days = WEEK_ORDER.map((_, i) => addDays(ws, i));
    const plan = {}, got = {}, skipped = {}, subjPlan = {}, subjGot = {};
    let gym = 0, gymPlan = 0, quranDays = 0;
    days.forEach(d => {
      let q = false;
      dayBlocks(d, store).forEach(b => {
        const m = b.e - b.s;
        if (!CATS[b.cat].track) return;
        const st = statusOf(store, d, b.key);
        if (st === 'skip'){ skipped[b.cat] = (skipped[b.cat] || 0) + m; return; }
        plan[b.cat] = (plan[b.cat] || 0) + m;
        if (b.cat === 'gym') gymPlan++;
        if (b.subj) subjPlan[b.subj] = (subjPlan[b.subj] || 0) + m;
        if (st === 'done'){
          got[b.cat] = (got[b.cat] || 0) + m;
          if (b.subj) subjGot[b.subj] = (subjGot[b.subj] || 0) + m;
          if (b.cat === 'gym') gym++;
          if (b.cat === 'quran') q = true;
        }
      });
      if (q) quranDays++;
    });
    const statRow = (cat, label, pl, gt, extra) => html`<div class=${'stat c-' + cat}>
      <span>${label}</span>
      <div class="track"><div class="fill" style=${{width: (pl ? Math.min(100, gt/pl*100) : 0) + '%'}}></div></div>
      <span class="val"><b>${hoursText(gt)}</b> من ${hoursText(pl)} س</span>
      ${extra ? html`<span class="extra">${extra}</span>` : null}</div>`;
    const skipNote = k => skipped[k] ? 'اتلغى ' + durText(skipped[k]) : '';
    const join = (...xs) => xs.filter(Boolean).join(' · ');
    const bal = balanceOf(days, store);

    return html`<div class="weekv">
      <div class="top a-head">
        <div class="top-meta"><h1>الأسبوع</h1><p class="sub">${dateLabel(days[0])} – ${dateLabel(days[6])}</p></div>
        <${WeekArrows} iso=${iso} setIso=${setIso} />
      </div>

      <div class="sec a-balance"><h2>ميزان الأسبوع</h2><div class="panel"><${Balance} a=${bal.a} b=${bal.b} label="الأسبوع ده" /></div></div>

      <div class="sec a-strips">
        <div class="sec-head"><h2>شكل الأسبوع</h2><p class="small muted">دوس على يوم تفتحه</p></div>
        <div class="panel" style="padding:10px">
          <div class="strips">
            ${days.map(d => {
              const p = prayers(d);
              const isToday = d === now.iso;
              return html`<button type="button" class="strip" onClick=${() => goDay(d)} aria-label=${DAY_NAMES[weekday(d)] + ' ' + dateLabel(d)}>
                <span class="strip-name">${DAY_SHORT[weekday(d)]}${isToday ? html`<i class="today-dot"></i>` : null}</span>
                <span class="bar">
                  ${dayBlocks(d, store).map(b => html`<span class=${'seg c-' + b.cat + (statusOf(store, d, b.key) === 'skip' ? ' skipped' : '')} style=${{insetInlineStart: ((b.s - START)/SPAN*100).toFixed(3) + '%', width: ((b.e - b.s)/SPAN*100).toFixed(3) + '%'}}></span>`)}
                  ${p ? ['dhuhr','asr','maghrib','isha'].map(k => html`<span class="tick" style=${{insetInlineStart: ((p[k] - START)/SPAN*100).toFixed(3) + '%'}}></span>`) : null}
                  ${isToday ? html`<span class="nowmark" style=${{insetInlineStart: ((Math.min(Math.max(now.min, START), END) - START)/SPAN*100).toFixed(3) + '%'}}></span>` : null}
                </span>
              </button>`;
            })}
          </div>
          <div class="axis" aria-hidden="true"><span></span>
            <div class="axis-track">
              <span class="first" style="inset-inline-start:0%">7ص</span>
              <span style="inset-inline-start:27.78%">12م</span>
              <span style="inset-inline-start:55.56%">5م</span>
              <span style="inset-inline-start:83.33%">10م</span>
            </div>
          </div>
          <div class="legend">
            <span class="c-uni"><i></i>الكلية</span>
            <span class="c-course"><i></i>الكورس</span>
            <span class="c-work"><i></i>الشغل</span>
            <span class="c-life"><i></i>جيم وقرآن ووقتك</span>
            <span class="c-rest"><i></i>راحة ومواصلات</span>
            <span><i class="tk"></i>صلاة</span>
          </div>
        </div>
      </div>

      <div class="sec a-stats">
        <h2>اللي اتعمل من الجدول</h2>
        <div class="panel stats">
          ${statRow('uni', 'حضور الكلية', plan.uni || 0, got.uni || 0, skipNote('uni'))}
          ${statRow('study', 'مذاكرة الكلية', plan.study || 0, got.study || 0, skipNote('study'))}
          ${statRow('course', 'الكورس', plan.course || 0, got.course || 0, skipNote('course'))}
          ${statRow('work', 'الشغل', plan.work || 0, got.work || 0, skipNote('work'))}
          ${statRow('gym', 'الجيم', plan.gym || 0, got.gym || 0, join('رحت ' + gym + ' من ' + gymPlan + ' مرات', skipNote('gym')))}
          ${statRow('quran', 'القرآن', plan.quran || 0, got.quran || 0, join('حفظت في ' + quranDays + ' من 7 أيام', skipNote('quran')))}
        </div>
      </div>

      <div class="sec a-subjects">
        <h2>مذاكرة الكلية بالمادة</h2>
        <div class="panel stats">
          ${Object.keys(SUBJ).sort((a, b) => (subjPlan[b] || 0) - (subjPlan[a] || 0)).map(k => statRow('study', html`<bdi class="subj" title=${SUBJ[k]}>${k}</bdi>`, subjPlan[k] || 0, subjGot[k] || 0))}
        </div>
      </div>

      <details class="a-rules rules-box">
        <summary>إزاي الجدول متظبط</summary>
        <ul class="rules">${RULES.map(r => html`<li>${r}</li>`)}</ul>
      </details>
    </div>`;
  }

  /* ---------------- Course ---------------- */
  function CourseForm({now, onSave, onCancel}){
    const [name, setName] = useState('');
    const [sub, setSub] = useState('');
    const [from, setFrom] = useState(now.iso);
    const [to, setTo] = useState(addDays(now.iso, 27));
    const [count, setCount] = useState('8');
    const [mods, setMods] = useState('');
    const [err, setErr] = useState('');
    const fillNumbers = () => {
      const n = Math.max(1, Math.min(60, parseInt(count, 10) || 0));
      setMods(Array.from({length: n}, (_, i) => 'موديول ' + (i + 1)).join('\n'));
    };
    const submit = e => {
      e.preventDefault();
      const lines = mods.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 60);
      if (!name.trim()) return setErr('اكتب اسم الكورس.');
      if (!isISO(from) || !isISO(to)) return setErr('اختار تاريخ البداية وتاريخ الهدف.');
      if (to < from) return setErr('تاريخ الهدف لازم يكون بعد البداية.');
      if (!lines.length) return setErr('اكتب الموديولات، كل موديول في سطر، أو دوس "اعمل قايمة بالأرقام".');
      setErr('');
      onSave({id: 'c' + uid36(), name: name.trim().slice(0, 60), sub: sub.trim().slice(0, 120), from, to, modules: lines.map((t, i) => ({id: 'm' + (i + 1) + '-' + uid36(), title: t.slice(0, 120)})), done: {}});
    };
    return html`<form class="panel form course-form" onSubmit=${submit}>
      <div class="sec-head"><h2>كورس جديد</h2><button type="button" class="btn ghost small" onClick=${onCancel}>إلغاء</button></div>
      <div class="form-row">
        <label class="field wide" for="cf-name">اسم الكورس<input id="cf-name" value=${name} onInput=${e => setName(e.target.value)} placeholder="مثلاً: Python for Cybersecurity" maxlength="60" /></label>
        <label class="field wide" for="cf-sub">وصف قصير (اختياري)<input id="cf-sub" value=${sub} onInput=${e => setSub(e.target.value)} placeholder="المنصة أو المدرّس أو الهدف منه" maxlength="120" /></label>
        <label class="field" for="cf-from">هبدأ يوم<input id="cf-from" type="date" value=${from} onInput=${e => setFrom(e.target.value)} /></label>
        <label class="field" for="cf-to">عايز أخلّصه يوم<input id="cf-to" type="date" value=${to} onInput=${e => setTo(e.target.value)} /></label>
      </div>
      <label class="field wide" for="cf-mods">الموديولات أو الدروس، كل واحد في سطر
        <textarea id="cf-mods" value=${mods} onInput=${e => setMods(e.target.value)} placeholder=${'Intro & Setup\nCore Concepts\nFirst Project'}></textarea>
      </label>
      <div class="form-row" style="align-items:flex-end">
        <label class="field" for="cf-count" style="flex:0 1 8rem">عدد الموديولات<input id="cf-count" type="number" min="1" max="60" value=${count} onInput=${e => setCount(e.target.value)} /></label>
        <button type="button" class="btn" onClick=${fillNumbers}>اعمل قايمة بالأرقام</button>
      </div>
      <p class="small muted">التطبيق بيوزّع الموديولات على الأسابيع من البداية لحد الهدف لوحده.</p>
      ${err ? html`<p class="form-err" role="alert">${err}</p>` : null}
      <div><button type="submit" class="btn primary">ضيف الكورس</button></div>
    </form>`;
  }

  function CourseView({now, store, update, remove}){
    const [sel, setSel] = useState(store.mainCourse);
    const [adding, setAdding] = useState(false);
    const courses = allCourses(store);
    const c = courses.find(x => x.id === sel) || mainCourse(store);
    const isMain = c.id === store.mainCourse;
    const plan = planOf(c), dm = doneMap(store, c);
    const all = plan.reduce((a, w) => a.concat(w.items), []);
    const n = all.filter(it => dm[it[3]]).length;
    const today = now.iso;
    const perWeek = Math.max(1, Math.round(all.length / Math.max(1, plan.length)));

    const save = course => { update(s => { s.courses.push(course); return s; }); setAdding(false); setSel(course.id); };
    const makeMain = () => update(s => { s.mainCourse = c.id; return s; });
    const del = () => { setSel(BUILTIN_ID); remove('اتمسح كورس "' + c.name + '"', s => { s.courses = s.courses.filter(x => x.id !== c.id); if (s.mainCourse === c.id) s.mainCourse = BUILTIN_ID; return s; }); };

    return html`<div class="coursev">
      <div class="top">
        <div class="top-meta">
          <h1><bdi>${c.name}</bdi></h1>
          <p class="sub">${isMain ? 'الكورس الأساسي، التارجت الأول للفترة دي' : 'كورس إضافي'}</p>
          <p class="small muted">${c.sub ? html`<bdi dir="rtl">${c.sub}</bdi> · ` : null}من ${dateLabel(c.from)} لحد ${dateLabel(c.to)}</p>
        </div>
        <button type="button" class="btn primary" aria-expanded=${adding ? 'true' : 'false'} onClick=${() => setAdding(!adding)}><${Plus} /><span>كورس جديد</span></button>
      </div>

      ${adding ? html`<${CourseForm} now=${now} onSave=${save} onCancel=${() => setAdding(false)} />` : null}

      ${courses.length > 1 ? html`<div class="chips" aria-label="الكورسات">
        ${courses.map(x => html`<button type="button" class="btn small" aria-pressed=${x.id === c.id ? 'true' : 'false'} onClick=${() => setSel(x.id)}>
          ${x.id === store.mainCourse ? html`<${Star} />` : null}<bdi>${x.name}</bdi></button>`)}
      </div>` : null}

      <div class="prog" style="--c:var(--course)">
        <div class="prog-row"><span>خلّصت <bdi class="num">${n}</bdi> من <bdi class="num">${all.length}</bdi> موديول</span><span class="muted small">${c.builtin ? 'موديولين كل أسبوع تقريباً' : 'حوالي ' + perWeek + ' في الأسبوع'}</span></div>
        <div class="track"><div class="fill" style=${{width: (all.length ? n/all.length*100 : 0).toFixed(1) + '%'}}></div></div>
      </div>

      ${!c.builtin || !isMain ? html`<div class="form-row">
        ${!isMain ? html`<button type="button" class="btn" onClick=${makeMain}>خليه الكورس الأساسي</button>` : null}
        ${!c.builtin ? html`<button type="button" class="btn ghost" onClick=${del}>امسح الكورس</button>` : null}
      </div>` : null}
      ${isMain && !c.builtin ? html`<p class="small muted">وقت الكورس في الجدول اليومي بقى لـ <bdi>${c.name}</bdi>.</p>` : null}

      <h2>الخطة أسبوع بأسبوع</h2>
      <div class="weeks">
        ${plan.map((w, wi) => {
          const cur = today >= w.from && today <= w.to;
          return html`<div class=${'week' + (cur ? ' is-current' : '')}>
            <div class="week-head"><h3>الأسبوع ${wi + 1}</h3><span class="week-dates">${w.label}${cur ? html` · <span class="cur-pill">الأسبوع ده</span>` : null}</span></div>
            ${w.note ? html`<p class="week-note">${w.note}</p>` : null}
            ${w.items.map(it => {
              const on = !!dm[it[3]];
              return html`<div class=${'mod' + (on ? ' done' : '')}>
                <${Check} on=${on} cat="course" label=${'خلّصت: ' + it[1]} onToggle=${() => toggleModule(update, c, it[3])} />
                <span class="mnum" dir="ltr">${it[0]}</span>
                <span class="mtitle"><bdi>${it[1]}</bdi>${it[2] ? html` <span class="mextra">· ${it[2]}</span>` : null}</span>
              </div>`;
            })}
          </div>`;
        })}
      </div>
    </div>`;
  }

  /* ---------------- Tasks & appointments ---------------- */
  function TasksView({now, store, update, goDay, remove}){
    const [label, setLabel] = useState('');
    const [day, setDay] = useState('5');
    const [time, setTime] = useState('');
    const [apptErr, setApptErr] = useState('');
    const [text, setText] = useState('');
    const [tag, setTag] = useState('uni');
    const [due, setDue] = useState('');
    const [filter, setFilter] = useState('open');
    const [taskForm, setTaskForm] = useState(false);
    const [apptForm, setApptForm] = useState(false);

    const addAppt = e => {
      e.preventDefault();
      if (!label.trim()){ setApptErr('اكتب اسم الميعاد.'); return; }
      if (!time){ setApptErr('اختار الساعة.'); return; }
      setApptErr('');
      update(s => { s.appts.push({id: uid36(), label: label.trim().slice(0, 60), day: Number(day), time}); return s; });
      setLabel(''); setTime(''); setApptForm(false);
    };
    const addTask = e => {
      e.preventDefault();
      if (!text.trim()) return;
      update(s => { s.tasks.push({id: uid36(), text: text.trim().slice(0, 140), tag, due: due || '', done: false, created: now.iso}); return s; });
      setText(''); setDue(''); setTaskForm(false);
    };
    const appts = store.appts.slice().sort((a, b) => WEEK_ORDER.indexOf(Number(a.day)) - WEEK_ORDER.indexOf(Number(b.day)) || a.time.localeCompare(b.time));
    const open = store.tasks.filter(t => !t.done).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
    const doneTasks = store.tasks.filter(t => t.done).slice(-20).reverse();
    const shown = filter === 'open' ? open : doneTasks;

    return html`<div class="tasksv">
      <div class="top a-head"><div class="top-meta"><h1>المهام</h1><p class="sub">مهام ليها ميعاد، ومواعيد ثابتة كل أسبوع</p></div></div>

      <div class="sec a-tasks">
        <div class="sec-head"><h2>المهام</h2>
          <div class="filters">
            <button type="button" class="btn small" aria-pressed=${filter === 'open' ? 'true' : 'false'} onClick=${() => setFilter('open')}>مفتوحة (${open.length})</button>
            <button type="button" class="btn small" aria-pressed=${filter === 'done' ? 'true' : 'false'} onClick=${() => setFilter('done')}>خلصت</button>
          </div>
        </div>
        <div class="panel">
          ${taskForm ? html`<form class="form" onSubmit=${addTask} style="margin-bottom:10px">
            <div class="form-row">
              <label class="field wide" for="task-text">مهمة جديدة<input id="task-text" value=${text} onInput=${e => setText(e.target.value)} placeholder="مثلاً: حل شيت 3 في Math-3" maxlength="140" /></label>
              <label class="field" for="task-tag">النوع<select id="task-tag" value=${tag} onChange=${e => setTag(e.target.value)}>
                ${Object.keys(TASK_TAGS).map(k => html`<option value=${k}>${TASK_TAGS[k]}</option>`)}</select></label>
              <label class="field" for="task-due">آخر ميعاد (اختياري)<input id="task-due" type="date" value=${due} onInput=${e => setDue(e.target.value)} /></label>
            </div>
            <div class="form-row"><button type="submit" class="btn primary">ضيف المهمة</button><button type="button" class="btn ghost" onClick=${() => setTaskForm(false)}>إلغاء</button></div>
          </form>` : html`<button type="button" class="btn add-task" onClick=${() => setTaskForm(true)}><${Plus} />مهمة جديدة</button>`}
          <div class="tlist" style="margin-top:6px">
            ${shown.length ? shown.map(t => html`<div class=${'titem c-' + t.tag + (t.done ? ' done' : '')}>
              <${Check} on=${!!t.done} cat=${t.tag} label=${(t.done ? 'رجّع: ' : 'خلّص: ') + t.text} onToggle=${() => update(s => { const x = s.tasks.find(y => y.id === t.id); if (x) x.done = !x.done; return s; })} />
              <div style="min-width:0"><p class="ttext">${t.text}</p>
                <p class="small"><span class="ttag">${TASK_TAGS[t.tag]}</span>${t.due ? html` · <span class=${'tdue' + (!t.done && t.due < now.iso ? ' late' : '')}>${dateLabel(t.due)}</span>` : null}</p></div>
              <button type="button" class="del" aria-label=${'امسح ' + t.text} onClick=${() => remove('اتمسحت المهمة', s => { s.tasks = s.tasks.filter(x => x.id !== t.id); return s; })}>امسح</button>
            </div>`) : html`<p class="empty">${filter === 'open' ? 'مفيش مهام مفتوحة. ضيف مثلاً شيت مطلوب أو ميعاد تسليم.' : 'لسه مخلّصتش مهام.'}</p>`}
          </div>
        </div>
      </div>
      <div class="sec a-appts">
        <div class="sec-head"><h2>مواعيد كل أسبوع</h2>${!apptForm ? html`<button type="button" class="btn small" onClick=${() => setApptForm(true)}><${Plus} />ميعاد</button>` : null}</div>
        <div class="panel">
          ${appts.length ? html`<div>${appts.map(a => html`<div class="appt">
              <div><p>${a.label}</p><p class="when">${DAY_NAMES[a.day]} · ${fmtStr(toMin(a.time))}</p></div>
              <button type="button" class="btn ghost small" onClick=${() => goDay(addDays(weekStart(now.iso), WEEK_ORDER.indexOf(Number(a.day))))}>افتح اليوم</button>
              <button type="button" class="del" aria-label=${'امسح ' + a.label} onClick=${() => remove('اتمسح ميعاد "' + a.label + '"', s => { s.appts = s.appts.filter(x => x.id !== a.id); return s; })}>امسح</button>
            </div>`)}</div>`
            : html`<p class="empty">التسميع والجيم والكلية متحطين في الجدول خلاص. أي ميعاد ثابت تاني، زي ميتنج شغل أسبوعي، ضيفه من "+ ميعاد" وهيظهر جوه يومه.</p>`}
          ${apptForm ? html`<form class="form" style="margin-top:12px" onSubmit=${addAppt}>
            <div class="form-row">
              <label class="field wide" for="appt-label">الميعاد<input id="appt-label" value=${label} onInput=${e => setLabel(e.target.value)} placeholder="مثلاً: ميتنج الفريق" maxlength="60" /></label>
              <label class="field" for="appt-day">اليوم<select id="appt-day" value=${day} onChange=${e => setDay(e.target.value)}>
                ${WEEK_ORDER.map(d => html`<option value=${String(d)}>${DAY_NAMES[d]}</option>`)}</select></label>
              <label class="field" for="appt-time">الساعة<input id="appt-time" type="time" value=${time} onInput=${e => setTime(e.target.value)} /></label>
            </div>
            ${apptErr ? html`<p class="form-err" role="alert">${apptErr}</p>` : null}
            <div class="form-row"><button type="submit" class="btn primary">ضيف الميعاد</button><button type="button" class="btn ghost" onClick=${() => setApptForm(false)}>إلغاء</button></div>
          </form>` : null}
        </div>
      </div>

    </div>`;
  }

  /* ---------------- shell ---------------- */
  const TABS = [
    ['today','اليوم','<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.8"/>'],
    ['week','الأسبوع','<path d="M4 6.5h16M4 12h10M4 17.5h13"/>'],
    ['course','الكورس','<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/>'],
    ['tasks','المهام','<path d="M10 6.5h10M10 12h10M10 17.5h10"/><path d="M3.8 6.5l1.4 1.4L7.8 5.3M3.8 12l1.4 1.4 2.6-2.6M3.8 17.5l1.4 1.4 2.6-2.6"/>']
  ];
  function Icon({paths}){
    return h('svg', {viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', 'stroke-width':'1.8', 'stroke-linecap':'round', 'stroke-linejoin':'round', 'aria-hidden':'true', dangerouslySetInnerHTML:{__html: paths}});
  }

  function App(){
    const [store, update, sync] = useStore();
    const [now, setNow] = useState(effectiveNow);
    const [iso, setIso] = useState(() => effectiveNow().iso);
    const [tab, setTab] = useState(() => { const hsh = (location.hash || '').slice(1); return ['today','week','course','tasks'].includes(hsh) ? hsh : 'today'; });
    const [toast, setToast] = useState(null);
    const toastTimer = useRef(null);
    useEffect(() => { const t = setInterval(() => setNow(effectiveNow()), 30000); return () => clearInterval(t); }, []);
    // Installable copy (hosted with its manifest): offer "add to home screen" when the browser allows it.
    const [installEvt, setInstallEvt] = useState(null);
    useEffect(() => {
      const onPrompt = e => { e.preventDefault(); setInstallEvt(e); };
      const onDone = () => setInstallEvt(null);
      window.addEventListener('beforeinstallprompt', onPrompt);
      window.addEventListener('appinstalled', onDone);
      return () => { window.removeEventListener('beforeinstallprompt', onPrompt); window.removeEventListener('appinstalled', onDone); };
    }, []);
    const install = async () => { if (!installEvt) return; try { await installEvt.prompt(); } catch(e){} setInstallEvt(null); };
    const goTab = t => { setTab(t); try { window.scrollTo(0, 0); } catch(e){} };
    const goDay = d => { setIso(d); goTab('today'); };
    // Deletions apply at once and offer an undo for a few seconds.
    const act = (text, fn) => {
      const snap = JSON.stringify(store);
      update(fn);
      if (toastTimer.current) clearTimeout(toastTimer.current);
      setToast({text, undo: () => update(() => JSON.parse(snap))});
      toastTimer.current = setTimeout(() => setToast(null), 7000);
    };
    const remove = act;
    MAIN_NAME = mainCourse(store).name;

    let view;
    if (tab === 'today') view = html`<${TodayView} iso=${iso} setIso=${setIso} now=${now} store=${store} update=${update} goTab=${goTab} remove=${remove} act=${act} />`;
    else if (tab === 'week') view = html`<${WeekView} iso=${iso} setIso=${setIso} now=${now} store=${store} goDay=${goDay} />`;
    else if (tab === 'course') view = html`<${CourseView} now=${now} store=${store} update=${update} remove=${remove} />`;
    else view = html`<${TasksView} now=${now} store=${store} update=${update} goDay=${goDay} remove=${remove} />`;

    return html`<div class="shell">
      <nav class="nav" aria-label="أقسام">
        <p class="brand">ميزان يومي<small>كلية · كورس · شغل · جيم · قرآن</small></p>
        <div class="nav-in">
          ${TABS.map(([k, label, paths]) => html`<button type="button" aria-current=${tab === k ? 'page' : null} onClick=${() => goTab(k)}><${Icon} paths=${paths} /><span>${label}</span></button>`)}
        </div>
      </nav>
      <main class="wrap">
        ${installEvt ? html`<div class="install"><p><b>ثبّت ميزان يومي</b><span class="small muted">أيقونة على الشاشة الرئيسية، ويشتغل من غير نت</span></p><button type="button" class="btn primary" onClick=${install}>ثبّت</button></div>` : null}
        ${view}
        <p class=${'sync' + (sync === 'cloud' ? ' cloud' : '')}><i></i>${sync === 'cloud' ? 'التقدم محفوظ على حسابك وبيظهر على أي جهاز' : LOCAL_OK ? 'التقدم محفوظ على الجهاز ده بس' : 'المتصفح ده مش بيسمح بالحفظ، فالعلامات هتتمسح لما تقفل الصفحة'}</p>
      </main>
      <div aria-live="polite">${toast ? html`<div class="toast" role="status"><p>${toast.text}</p><button type="button" class="btn" onClick=${() => { toast.undo(); setToast(null); }}>رجّعها</button></div>` : null}</div>
    </div>`;
  }


  root.innerHTML = '';
  render(html`<${App} />`, root);
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){});});}</script></body></html>

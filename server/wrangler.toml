# The sync server's Cloudflare settings (feature 025). Public values only: the Resend key and the pepper are set by the
# owner in their own Cloudflare account with `wrangler secret put`, never here (constitution 3.0.1, Principle III).
# The deploy steps are in DEPLOY.md. database_id is an identifier, not a secret.
name = "mizan-sync"
main = "worker.js"
compatibility_date = "2026-10-01"
# no usage data to Cloudflare from the deploy tool (constitution 3.0.1, Principle III)
send_metrics = false

[vars]
APP_URL = "https://adhamelhomary15-cell.github.io/mizan-yawmi/"
EMAIL_FROM = "ميزان يومي <onboarding@resend.dev>"

[[d1_databases]]
binding = "DB"
database_name = "mizan-sync"
database_id = "set-locally-by-the-owner"

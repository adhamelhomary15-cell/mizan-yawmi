<title>ميزان يومي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Spectral:wght@700&display=swap">
<style>
/* Layout: phone-first RTL app. Oxblood shell (bottom bar on phones, side rail from 960px). World: Egyptian banknote inks on security paper; signature: the day's guilloche rosette. */
:root{
  --bg:#E7ECE3; --surface:#FAFBF6; --fg:#1D1B17; --muted:#585C52; --line:#CDD3C6; --quiet:#D6DBCF; --danger:#B4300C;
  --shell:#6E1A28; --shell-fg:#FAFBF6; --shell-dim:#E9C9CF;
  /* denominations: oxblood and madder (university), plum (course), sepia (work), ochre (gym, Quran, your time) */
  --uni:#7B1E2E; --study:#94304B; --course:#5B2A6B; --work:#5A402B; --gym:#735600; --quran:#6A4E00; --personal:#7A5A0A;
  --tint:9%;
  --font-display:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-mono:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-num:"Spectral",Georgia,"Times New Roman",serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16141A; --surface:#201D24; --fg:#EDE9E1; --muted:#A7A39A; --line:#36313B; --quiet:#3A3540; --danger:#FF9A76;
    --shell:#3A1119; --shell-fg:#EDE9E1; --shell-dim:#C9A3AA;
    --uni:#EE8E9C; --study:#F2A7B8; --course:#CFA0DD; --work:#D8B898; --gym:#E4C55C; --quran:#E8C96A; --personal:#EFD98F;
    --tint:15%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16141A; --surface:#201D24; --fg:#EDE9E1; --muted:#A7A39A; --line:#36313B; --quiet:#3A3540; --danger:#FF9A76;
  --shell:#3A1119; --shell-fg:#EDE9E1; --shell-dim:#C9A3AA;
  --uni:#EE8E9C; --study:#F2A7B8; --course:#CFA0DD; --work:#D8B898; --gym:#E4C55C; --quran:#E8C96A; --personal:#EFD98F;
  --tint:15%; color-scheme:dark;
}
html{scrollbar-color:var(--quiet) var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;caret-color:var(--course);accent-color:var(--course)}
::selection{background:color-mix(in srgb,var(--course) 28%,var(--surface));color:var(--fg)}
#app{min-height:60vh}
.wrap{max-width:720px;margin:0 auto;padding-inline:var(--s4);padding-block:18px 128px;display:flex;flex-direction:column;gap:var(--s5)}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.2}
h2{font-family:var(--font-display);font-weight:500;font-size:18px;line-height:1.35}
h3{font-family:var(--font-display);font-weight:500;font-size:16px;line-height:1.35}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--course);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec{display:flex;flex-direction:column;gap:var(--s3)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:var(--s1) var(--s3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.c-uni{--c:var(--uni)} .c-study{--c:var(--study)} .c-course{--c:var(--course)} .c-work{--c:var(--work)} .c-gym{--c:var(--gym)} .c-quran{--c:var(--quran)} .c-personal{--c:var(--personal)} .c-move{--c:var(--quiet)} .c-rest{--c:var(--quiet)} .c-life{--c:var(--gym)}

/* headers: the heading leads, the date sits under it */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.top-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.sub{font-size:14px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding-top:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.sync.cloud i{background:var(--gym)}
.btn{min-height:40px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn svg{width:16px;height:16px;flex:none}
.top > .btn{white-space:nowrap;flex:none}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.icon-btn svg{width:18px;height:18px}

/* day picker */
.daypick{display:block}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-width:0}
.dp{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;padding:4px 0;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;line-height:1.3}
.dp .dn{font-size:12px;color:var(--muted)}
.dp .dd{font-family:var(--font-mono);font-weight:600;font-size:15px}
.dp.is-today .dn{color:var(--fg);font-weight:600}
.dp.is-today{border-color:var(--line)}
.dp[aria-pressed="true"]{background:var(--shell);color:var(--shell-fg);border-color:var(--shell)}
.dp[aria-pressed="true"] .dn{color:var(--shell-dim)}

/* now card: the block in progress, one tap to finish it */
.now{display:flex;flex-direction:column;gap:var(--s3);background:color-mix(in srgb,var(--c) var(--tint),var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-radius:18px;padding:var(--s4)}
.now-title{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.3}
.now-meta{font-size:14px;color:var(--muted)}
.now-meta b{color:var(--c);font-weight:600}
.now-actions{display:flex;flex-wrap:wrap;gap:var(--s2)}
.now-actions .btn{min-height:48px;font-size:15px;padding-inline:18px}
.now-actions .btn.primary{background:var(--c);border-color:var(--c);color:var(--surface);flex:1 1 12rem}
.now-actions .btn.primary[aria-pressed="true"]{background:var(--surface);color:var(--c)}
.now-next{display:flex;flex-direction:column;gap:2px;border-top:1px solid color-mix(in srgb,var(--c) 22%,var(--line));padding-top:var(--s3);font-size:14px}
.now-next .row-line{display:flex;justify-content:space-between;gap:var(--s3)}
.now-next .lbl{color:var(--muted)}
.now-done{font-family:var(--font-display);font-weight:500;font-size:18px}

/* prayers */
.prayers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;text-align:center}
.pr{display:flex;flex-direction:column;padding:6px 2px;border-radius:10px}
.pr .pn{font-size:12px;color:var(--muted)}
.pr .pt{font-family:var(--font-mono);font-weight:600;font-size:14px}
.pr.next{background:color-mix(in srgb,var(--quran) var(--tint),var(--surface));outline:1px solid var(--quran)}
.pr.next .pn{color:var(--quran);font-weight:600}
.pr.past .pt{color:var(--muted)}

/* progress */
.prog{display:flex;flex-direction:column;gap:6px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);font-size:14px}
.track{height:8px;border-radius:4px;background:color-mix(in srgb,var(--line) 75%,transparent);overflow:hidden}
.fill{height:100%;background:var(--c,var(--fg));border-radius:4px;transition:width .2s cubic-bezier(.16,1,.3,1)}

/* balance: university and course on one pan, work and life on the other */
.balance{display:flex;flex-direction:column;gap:var(--s2)}
.balance svg{width:100%;max-width:280px;height:auto;align-self:center}
.balance .ring{fill:none;stroke:var(--line);stroke-width:1}
.balance .petal{fill:none;stroke:var(--c);stroke-width:1.1;transition:stroke .45s cubic-bezier(.16,1,.3,1),stroke-width .45s cubic-bezier(.16,1,.3,1)}
.balance .petal.off{stroke:var(--quiet);stroke-width:.8}
.balance .axis-line{stroke:var(--line);stroke-width:1}
.balance .core{fill:var(--surface);stroke:var(--line);stroke-width:1}
.balance .core-num{font-family:var(--font-num);font-weight:700;font-size:24px;fill:var(--fg)}
.balance .core-lbl{font-family:var(--font-body);font-size:10px;fill:var(--muted)}
.balance-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);font-size:14px}
.balance-legend div{display:flex;flex-direction:column;gap:2px}
.balance-legend b{font-family:var(--font-num);font-size:26px;font-weight:700;line-height:1.1}
.balance-legend .a b{color:var(--uni)} .balance-legend .b b{color:var(--gym)}
.balance-legend .b{text-align:end}
.balance-note{font-size:14px;color:var(--muted);text-align:center}

/* timeline */
.note{color:var(--muted);font-size:14px;max-width:62ch}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:44px 82px minmax(0,1fr) auto;gap:var(--s2);align-items:start;border-radius:14px}
.row.main{background:color-mix(in srgb,var(--c) var(--tint),var(--surface));padding:6px 10px 6px 6px}
.row.quiet{padding:2px 10px 2px 6px;color:var(--muted);font-size:14px}
.row.is-now{outline:2px solid var(--fg);outline-offset:-2px}
.row.quiet.is-now{background:var(--surface)}
.row.skipped{background:transparent;border:1px dashed var(--line)}
.chk{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
.chk i{width:28px;height:28px;border-radius:50%;border:2px solid var(--c);background:var(--surface);display:grid;place-items:center;transition:background .15s ease}
.chk svg{width:15px;height:15px;opacity:0;color:var(--surface)}
.chk[aria-checked="true"] i{background:var(--c)}
.chk[aria-checked="true"] svg{opacity:1}
.chk:disabled{cursor:default}
.chk:disabled i{border-style:dashed;border-color:var(--muted);background:transparent}
.row-body{display:block;width:100%;text-align:start;background:none;border:0;padding:8px 0;cursor:pointer;border-radius:10px;min-width:0}
.row.quiet .row-body{cursor:default;padding:6px 0}
.row-body > span{display:block}
.row.done .title,.row.skipped .title{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
.time{display:flex;flex-direction:column;line-height:1.35;padding-top:10px;white-space:nowrap;min-width:0}
.row.quiet .time{padding-top:7px}
.time .t{font-family:var(--font-mono);font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums}
.row.quiet .time .t{font-weight:500;font-size:13px}
.time .suf{font-size:11.5px;color:var(--muted);margin-inline-start:2px}
.time .end{font-size:12px;color:var(--muted)}
.time .end .t{font-size:12px;font-weight:500}
.title{font-weight:600;font-size:15.5px;line-height:1.45}
.row.quiet .title{font-weight:400;font-size:14px}
.subj{font-weight:600}
.meta{margin-top:2px;font-size:13px;color:var(--muted);text-wrap:pretty}
.meta b{color:var(--c);font-weight:600}
.now-pill{display:inline-block;font-size:11px;font-weight:600;background:var(--fg);color:var(--bg);padding:0 8px;border-radius:999px;margin-inline-start:6px;vertical-align:2px}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mk{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.mk svg{width:12px;height:12px;color:var(--quran)}
.mk.appt{border-color:var(--quran);color:var(--quran);font-weight:600}
.denom{direction:ltr;unicode-bidi:isolate;font-family:var(--font-num);font-weight:700;font-size:26px;line-height:1;color:var(--c);padding-top:10px;white-space:nowrap;font-variant-numeric:lining-nums}
.denom small{font-family:var(--font-body);font-weight:500;font-size:11px;margin-inline-start:2px}
.row.done .denom,.row.skipped .denom{opacity:.45}
.row-actions{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:var(--s2);padding:0 0 var(--s2)}
.add-block{align-self:flex-start}
.head-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.o-head .top{flex-wrap:wrap}
.arrows{display:inline-flex;gap:6px}
.review-all{align-self:flex-start}
.review{display:flex;flex-direction:column;gap:var(--s3);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:var(--s4)}
.review-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.review-list li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s2) var(--s3);padding:10px 0;border-top:1px solid var(--line)}
.review-list li:first-child{border-top:0}
.review-text{display:flex;flex-direction:column;min-width:0;flex:1 1 12rem}
.review-actions{display:flex;gap:var(--s2)}
.review-actions .btn.primary{background:var(--c);border-color:var(--c);color:var(--surface)}
.review-empty{font-family:var(--font-display);font-weight:500;font-size:17px}
.add-task{align-self:flex-start}
.panel > .add-task{display:inline-flex}

/* main target */
.target{display:flex;flex-direction:column;gap:6px;width:100%;text-align:start;cursor:pointer;background:color-mix(in srgb,var(--course) var(--tint),var(--surface));border:1px solid color-mix(in srgb,var(--course) 30%,var(--line));border-radius:14px;padding:12px 14px}
.target:hover{border-color:var(--course)}
.target-name{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.3}
.target .track{display:block;height:6px}

/* tasks */
.tlist{display:flex;flex-direction:column}
.titem{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:var(--s2);align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.titem:first-child{border-top:0}
.titem .ttext{overflow-wrap:anywhere}
.titem.done .ttext{text-decoration:line-through;color:var(--muted)}
.ttag{font-size:12px;color:var(--c);font-weight:600}
.tdue{font-size:12px;color:var(--muted)}
.tdue.late{color:var(--danger);font-weight:600}
.del{min-height:44px;min-width:44px;background:none;border:0;color:var(--muted);cursor:pointer;padding:0 8px;border-radius:10px;font-size:13px}
.del:hover{color:var(--danger)}
.edit{min-height:44px;min-width:44px;background:none;border:0;color:var(--muted);cursor:pointer;padding:0 8px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.edit svg{width:18px;height:18px;flex:none}
.edit:hover{color:var(--fg)}
.tact{display:flex;align-items:center}
.paste-open{margin-inline-start:var(--s2)}
.paste{display:flex;flex-direction:column;gap:10px}
.paste textarea{font-size:14px}
.paste-row{display:grid;grid-template-columns:24px minmax(0,1fr);gap:var(--s2);align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.paste-row input{width:20px;height:20px;margin-top:2px}
.paste-text{cursor:pointer}
.paste-type{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;max-width:100%;box-sizing:border-box;align-self:flex-start}
.paste-rejected{border-top:1px solid var(--line);padding-top:8px}
.paste-rejected ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.paste-rejected li{display:flex;flex-direction:column;gap:2px;min-width:0}
.paste-raw{overflow-wrap:anywhere;font-size:14px}
.paste-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.paste-text{overflow-wrap:anywhere}
.titem-edit{padding:8px 0;border-top:1px solid var(--line)}
.titem-edit:first-child{border-top:0}

/* week */
.strips{display:flex;flex-direction:column;gap:2px}
.strip{display:grid;grid-template-columns:46px minmax(0,1fr);align-items:center;gap:var(--s2);width:100%;min-height:36px;background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;text-align:start}
.strip:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.strip-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.today-dot{width:6px;height:6px;border-radius:50%;background:var(--fg);display:inline-block}
.bar{position:relative;height:16px;border-radius:4px;background:color-mix(in srgb,var(--line) 55%,transparent);overflow:hidden}
.seg{position:absolute;top:0;bottom:0;background:var(--c);box-shadow:inset 1px 0 0 var(--surface)}
.seg.c-move,.seg.c-rest{background:var(--quiet)}
.seg.skipped{opacity:.35}
.tick{position:absolute;top:0;bottom:0;width:1.5px;background:var(--fg);opacity:.45}
.nowmark{position:absolute;top:0;bottom:0;width:2.5px;background:var(--fg)}
.axis{display:grid;grid-template-columns:46px minmax(0,1fr);gap:var(--s2);padding-inline:6px;margin-top:2px}
.axis-track{position:relative;height:18px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.axis-track span{position:absolute;top:0;white-space:nowrap;transform:translateX(50%)}
.axis-track span.first{transform:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 6px 2px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.legend .tk{width:2px;height:10px;border-radius:0;background:var(--fg);opacity:.5}
.stats{display:flex;flex-direction:column;gap:14px}
.stat{display:grid;grid-template-columns:minmax(0,8rem) minmax(0,1fr) auto;gap:var(--s3);align-items:center;font-size:14px}
.stat .track{height:10px;border-radius:5px}
.stat .val{font-size:12.5px;color:var(--muted);text-align:end;white-space:nowrap}
.stat .val b{font-family:var(--font-mono);color:var(--fg);font-weight:600}
.stat .extra{grid-column:1 / -1;font-size:12.5px;color:var(--muted);margin-top:-8px}
details.rules-box summary{cursor:pointer;font-family:var(--font-display);font-weight:500;font-size:16px;padding:var(--s2) 0;list-style-position:inside}
.rules{margin:var(--s2) 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:7px;max-width:64ch;font-size:14px}

/* course */
.weeks{display:flex;flex-direction:column;gap:10px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 4px}
.week.is-current{border-color:var(--course);box-shadow:0 0 0 1px var(--course)}
.week-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap;padding-bottom:6px}
.week-dates{font-size:13px;color:var(--muted)}
.cur-pill{font-size:12px;font-weight:600;color:var(--course)}
.week-note{font-size:13px;color:var(--muted);padding-bottom:8px}
.mod{display:grid;grid-template-columns:44px auto minmax(0,1fr);gap:var(--s2);align-items:center;padding:2px 0;border-top:1px solid var(--line)}
.mod .mnum{font-family:var(--font-mono);font-weight:600;color:var(--course);min-width:2.2ch}
.mod .mtitle{overflow-wrap:anywhere}
.mod .mextra{color:var(--muted);font-size:13px}
.mod.done .mtitle bdi{text-decoration:line-through;color:var(--muted)}
.mod .chk{--c:var(--course)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips .star{width:14px;height:14px;color:var(--work)}
.chips button[aria-pressed="true"] .star{color:inherit}

/* forms */
.form{display:flex;flex-direction:column;gap:10px}
.form-row{display:flex;flex-wrap:wrap;gap:var(--s2)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 9rem;min-width:0}
.field.wide{flex-basis:100%}
.field input,.field select,.field textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%;min-height:44px;box-sizing:border-box}
.field textarea{min-height:9rem;resize:vertical;line-height:1.7}

<script>
(function(){
  const root = document.getElementById('app');
  if (!window.preact || !window.preactHooks || !window.htm){
    root.innerHTML = '<p class="fail">الصفحة مقدرتش تحمّل مكتبة التشغيل. جرّب تفتحها تاني بعد شوية.</p>';
    return;
  }
  const { h, render } = preact;
  const { useState, useEffect, useRef, useMemo } = preactHooks;
  const html = htm.bind(h);

  /* ---------------- settings: format check (pure; used by the importer and tools/check-settings.js) ---------------- */
  // Returns {ok, errors, warnings, settings}. Each error is {code, path, detail}; codes:
  // not-settings, too-new, invalid, unknown-id. Rules follow specs/002-separate-personal-settings/data-model.md.
  function validateSettings(obj){
    const CATEGORY_IDS = ['uni','study','course','work','gym','quran','personal','move','rest'];
    const METHODS = ['MuslimWorldLeague','Egyptian','Karachi','UmmAlQura','Dubai','MoonsightingCommittee','NorthAmerica','Kuwait','Qatar','Singapore','Tehran','Turkey','Other'];
    const LANGS = ['ar'];
    const PRAYER_IDS = ['fajr','dhuhr','asr','maghrib','isha'];
    const KNOWN = ['format','version','name','language','timezone','location','prayerMethod','versions','categories','subjects','week','rules','taskTags','course'];
    const errors = [], warnings = [];
    const bad = (code, path, detail) => { if (errors.length < 50) errors.push({code, path, detail}); };
    const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
    const isStr = (v, min, max) => typeof v === 'string' && v.length >= min && v.length <= max;
    const isNum = v => typeof v === 'number' && isFinite(v);
    const isInt = v => isNum(v) && Math.floor(v) === v;
    const digits = (t, n) => t.length === n && t.split('').every(c => c >= '0' && c <= '9');
    const isDate = v => {
      if (typeof v !== 'string' || v.length !== 10 || v[4] !== '-' || v[7] !== '-') return false;
      if (!digits(v.slice(0,4), 4) || !digits(v.slice(5,7), 2) || !digits(v.slice(8,10), 2)) return false;
      const y = Number(v.slice(0,4)), m = Number(v.slice(5,7)), d = Number(v.slice(8,10));
      const t = new Date(Date.UTC(y, m - 1, d));
      return t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d;
    };
    const isMonthDay = v => typeof v === 'string' && v.length === 5 && v[2] === '-' && digits(v.slice(0,2), 2) && digits(v.slice(3,5), 2) && isDate('2024-' + v);
    const timeOk = v => {
      if (typeof v !== 'string' || v.length !== 5 || v[2] !== ':' || !digits(v.slice(0,2), 2) || !digits(v.slice(3,5), 2)) return null;
      const h = Number(v.slice(0,2)), m = Number(v.slice(3,5));
      return h <= 24 && m <= 59 ? h * 60 + m : null;
    };

    if (!isObj(obj)) { bad('not-settings', 'file', 'the file is not a settings object'); return {ok:false, errors, warnings, settings:null}; }
    if (obj.format !== 'mizan-settings') { bad('not-settings', 'format', 'format must be exactly "mizan-settings"'); return {ok:false, errors, warnings, settings:null}; }
    if (isInt(obj.version) && obj.version > 1) { bad('too-new', 'version', 'made for a newer version of the app'); return {ok:false, errors, warnings, settings:null}; }
    if (!isInt(obj.version) || obj.version < 1) bad('invalid', 'version', 'version must be the integer 1');

    if (obj.name !== undefined && !isStr(obj.name, 1, 60)) bad('invalid', 'name', 'name must be 1 to 60 characters');
    if (obj.language !== undefined && LANGS.indexOf(obj.language) < 0) bad('invalid', 'language', 'language must be one of: ' + LANGS.join(', '));
    if (obj.prayerMethod !== undefined && METHODS.indexOf(obj.prayerMethod) < 0) bad('invalid', 'prayerMethod', 'prayerMethod must be one of: ' + METHODS.join(', '));

    if (typeof obj.timezone !== 'string' || !obj.timezone) bad('invalid', 'timezone', 'timezone is required (an IANA name such as Africa/Cairo)');
    else { try { new Intl.DateTimeFormat('en', {timeZone: obj.timezone}); } catch (e) { bad('invalid', 'timezone', 'not a valid IANA time zone name'); } }

    const loc = obj.location;
    if (!isObj(loc)) bad('invalid', 'location', 'location is required: lat, lng, and an optional label');
    else {
      if (!isNum(loc.lat) || loc.lat < -90 || loc.lat > 90) bad('invalid', 'location.lat', 'lat must be a number from -90 to 90');
      if (!isNum(loc.lng) || loc.lng < -180 || loc.lng > 180) bad('invalid', 'location.lng', 'lng must be a number from -180 to 180');
      if (loc.label !== undefined && !isStr(loc.label, 1, 60)) bad('invalid', 'location.label', 'label must be 1 to 60 characters');
    }

    if (obj.versions !== undefined) {
      const v = obj.versions;
      if (!isObj(v)) bad('invalid', 'versions', 'versions must be an object');
      else {
        if (PRAYER_IDS.indexOf(v.prayer) < 0) bad('invalid', 'versions.prayer', 'prayer must be one of: ' + PRAYER_IDS.join(', '));
        if (!isInt(v.thresholdMinutes) || v.thresholdMinutes < 0 || v.thresholdMinutes > 1440) bad('invalid', 'versions.thresholdMinutes', 'thresholdMinutes must be a whole number from 0 to 1440');
        if (v.fallback !== undefined) {
          const f = v.fallback;
          if (!isObj(f) || !isMonthDay(f.lateFrom) || !(isMonthDay(f.lateUntil) || f.lateUntil === 'last-thursday-october')) bad('invalid', 'versions.fallback', 'fallback needs lateFrom as MM-DD and lateUntil as MM-DD or last-thursday-october');
        }
      }
    }

    const cats = isObj(obj.categories) ? obj.categories : null;
    if (!cats || !Object.keys(cats).length) bad('invalid', 'categories', 'categories is required with at least one category');
    else Object.keys(cats).forEach(k => {
      const c = cats[k];
      if (CATEGORY_IDS.indexOf(k) < 0) bad('unknown-id', 'categories.' + k, 'unknown category id; allowed: ' + CATEGORY_IDS.join(', '));
      else if (!isObj(c) || !isStr(c.label, 1, 30)) bad('invalid', 'categories.' + k + '.label', 'label must be 1 to 30 characters');
      else {
        if (c.long !== undefined && !isStr(c.long, 1, 60)) bad('invalid', 'categories.' + k + '.long', 'long must be 1 to 60 characters');
        if (c.track !== undefined && typeof c.track !== 'boolean') bad('invalid', 'categories.' + k + '.track', 'track must be true or false');
      }
    });

    let subs = null;
    if (obj.subjects !== undefined) {
      if (!isObj(obj.subjects)) bad('invalid', 'subjects', 'subjects must be an object');
      else {
        subs = obj.subjects;
        Object.keys(subs).forEach(k => {
          if (!isStr(k, 1, 8)) bad('invalid', 'subjects.' + k, 'subject id must be 1 to 8 characters');
          if (!isStr(subs[k], 1, 60)) bad('invalid', 'subjects.' + k, 'subject name must be 1 to 60 characters');
        });
      }
    }

    const checkBlocks = (list, path) => {
      if (!Array.isArray(list) || !list.length) { bad('invalid', path, 'blocks must be a non-empty list'); return; }
      let prev = -1;
      list.forEach((b, i) => {
        const at = path + '[' + i + ']';
        if (!Array.isArray(b) || b.length < 2 || b.length > 6) { bad('invalid', at, 'a block is [start, category, title, detail, subject, anchor] with 2 to 6 items'); return; }
        const t = timeOk(b[0]);
        if (t === null) bad('invalid', at + '.start', 'start must be HH:MM from 00:00 to 24:59');
        else { if (t <= prev) bad('invalid', at + '.start', 'blocks must be in ascending time order'); prev = t; }
        if (!cats || !Object.prototype.hasOwnProperty.call(cats, b[1])) bad('unknown-id', at + '.category', 'category is not defined in categories');
        if (!isStr(b[2], 1, 120)) bad('invalid', at + '.title', 'title must be 1 to 120 characters');
        if (b[3] !== undefined && !isStr(b[3], 0, 300)) bad('invalid', at + '.detail', 'detail must be at most 300 characters');
        if (b[4] !== undefined && b[4] !== '' && !(subs && Object.prototype.hasOwnProperty.call(subs, b[4]))) bad('unknown-id', at + '.subject', 'subject is not defined in subjects');
        if (b.length === 6) {
          // The sixth element ties the block to a prayer time: {prayer, dir, min}. The block's start stays as the fixed fallback time.
          const a = b[5], an = at + '.anchor';
          if (!isObj(a)) bad('invalid', an, 'anchor must be an object with prayer, dir and min');
          else {
            Object.keys(a).forEach(k => { if (k !== 'prayer' && k !== 'dir' && k !== 'min') bad('invalid', an + '.' + k, 'anchor has only prayer, dir and min'); });
            if (['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'].indexOf(a.prayer) < 0) bad('invalid', an + '.prayer', 'prayer must be fajr, dhuhr, asr, maghrib or isha');
            if (a.dir !== 'before' && a.dir !== 'after') bad('invalid', an + '.dir', 'dir must be before or after');
            if (!Number.isInteger(a.min) || a.min < 0 || a.min > 180) bad('invalid', an + '.min', 'min must be a whole number from 0 to 180');
            if (i === 0 || i === list.length - 1) bad('invalid', an, 'the first and the last block of a day cannot be tied to a prayer');
          }
        }
      });
    };
    const week = isObj(obj.week) ? obj.week : null;
    if (!week || !Object.keys(week).length) bad('invalid', 'week', 'week is required with at least one day (keys 0 to 6)');
    else Object.keys(week).forEach(k => {
      const d = week[k], at = 'week.' + k;
      if (['0','1','2','3','4','5','6'].indexOf(k) < 0) { bad('invalid', at, 'day keys are 0 to 6'); return; }
      if (!isObj(d)) { bad('invalid', at, 'a day is an object with blocks'); return; }
      if (d.note !== undefined && !isStr(d.note, 0, 500)) bad('invalid', at + '.note', 'note must be at most 500 characters');
      if (Array.isArray(d.blocks)) checkBlocks(d.blocks, at + '.blocks');
      else if (isObj(d.blocks)) {
        Object.keys(d.blocks).forEach(v => { if (v !== 'A' && v !== 'B') bad('invalid', at + '.blocks.' + v, 'versions are named A and B'); else checkBlocks(d.blocks[v], at + '.blocks.' + v); });
        if (!d.blocks.A) bad('invalid', at + '.blocks.A', 'version A is required when using two versions');
      } else bad('invalid', at + '.blocks', 'blocks must be a list, or an object with A and B');
    });

    if (obj.rules !== undefined) {
      if (!Array.isArray(obj.rules) || obj.rules.length > 20) bad('invalid', 'rules', 'rules must be a list of at most 20 texts');
      else obj.rules.forEach((r, i) => { if (!isStr(r, 1, 300)) bad('invalid', 'rules[' + i + ']', 'each rule must be 1 to 300 characters'); });
    }
    if (obj.taskTags !== undefined) {
      if (!isObj(obj.taskTags)) bad('invalid', 'taskTags', 'taskTags must be an object');
      else Object.keys(obj.taskTags).forEach(k => {
        if (CATEGORY_IDS.indexOf(k) < 0) bad('unknown-id', 'taskTags.' + k, 'unknown category id');
        else if (!isStr(obj.taskTags[k], 1, 20)) bad('invalid', 'taskTags.' + k, 'tag must be 1 to 20 characters');
      });
    }
    if (obj.course !== undefined) {
      const c = obj.course;
      if (!isObj(c)) bad('invalid', 'course', 'course must be an object');
      else {
        if (!isStr(c.name, 1, 80)) bad('invalid', 'course.name', 'name must be 1 to 80 characters');
        if (c.sub !== undefined && !isStr(c.sub, 0, 160)) bad('invalid', 'course.sub', 'sub must be at most 160 characters');
        if (!Array.isArray(c.plan)) bad('invalid', 'course.plan', 'plan must be a list of weeks');
        else c.plan.forEach((w, i) => {
          const at = 'course.plan[' + i + ']';
          if (!isObj(w) || !isDate(w.from) || !isDate(w.to) || w.from > w.to) { bad('invalid', at, 'a week needs from and to as YYYY-MM-DD, with from not after to'); return; }
          if (!isStr(w.label, 1, 60)) bad('invalid', at + '.label', 'label must be 1 to 60 characters');
          if (w.note !== undefined && !isStr(w.note, 0, 300)) bad('invalid', at + '.note', 'note must be at most 300 characters');
          if (!Array.isArray(w.items) || !w.items.length) bad('invalid', at + '.items', 'items must be a non-empty list');
          else w.items.forEach((it, j) => {
            if (!Array.isArray(it) || it.length < 2 || it.length > 3 || !isStr(it[0], 1, 8) || !isStr(it[1], 1, 120) || (it[2] !== undefined && !isStr(it[2], 0, 60))) bad('invalid', at + '.items[' + j + ']', 'an item is [id, title, detail] with an id up to 8 characters');
          });
        });
      }
    }
    Object.keys(obj).forEach(k => { if (KNOWN.indexOf(k) < 0) warnings.push({code:'unknown-field', path:k, detail:'ignored'}); });

    if (errors.length) return {ok:false, errors, warnings, settings:null};
    const settings = JSON.parse(JSON.stringify(obj));
    if (settings.language === undefined) settings.language = 'ar';
    if (settings.prayerMethod === undefined) settings.prayerMethod = 'Egyptian';
    return {ok:true, errors, warnings, settings};
  }

  /* ---------------- settings: load (stored file, else the embedded example) ---------------- */
  const SETTINGS_KEY = 'mizan-settings-v1';
  const LOADED = (() => {
    let example = null;
    try { example = validateSettings(JSON.parse(document.getElementById('example-settings').textContent)).settings; } catch(e){}
    if (!example) example = {format:'mizan-settings', version:1, language:'ar', prayerMethod:'Egyptian', timezone:'Africa/Cairo', location:{lat:30.0444, lng:31.2357, label:'Sample city'}, categories:{rest:{label:'راحة', track:false}}, week:{0:{blocks:[['08:00','rest','مثال']]}}};
    let raw = null;
    try { raw = localStorage.getItem(SETTINGS_KEY); } catch(e){}
    if (!raw) return {settings: example, isExample: true, problem: false};
    try {
      const res = validateSettings(JSON.parse(raw));
      if (res.ok) return {settings: res.settings, isExample: false, problem: false};
    } catch(e){}
    return {settings: example, isExample: true, problem: true};
  })();
  const CFG = LOADED.settings;

  /* ---------------- fixed names (weekdays) ---------------- */
  const DAY_NAMES = {6:'السبت',0:'الحد',1:'الاتنين',2:'التلات',3:'الأربع',4:'الخميس',5:'الجمعة'};
  const DAY_SHORT = {6:'سبت',0:'حد',1:'اتنين',2:'تلات',3:'أربع',4:'خميس',5:'جمعة'};
  const WEEK_ORDER = [6,0,1,2,3,4,5];

  // A day's blocks (from the settings) are [start, category, title ("Subject|action" splits), detail, subject].
  // Each block ends where the next starts; the last ends at the end of the day.

  /* ---------------- data derived from settings ---------------- */
  // Missing categories fall back to these generic labels so every category id always has a label.
  const DEFAULT_CATS = {
    uni:{label:'محاضرات', long:'حضور المحاضرات', track:true},
    study:{label:'مذاكرة', long:'مذاكرة', track:true},
    course:{label:'كورس', long:'الكورس', track:true},
    work:{label:'شغل', long:'الشغل', track:true},
    gym:{label:'رياضة', long:'الرياضة', track:true},
    quran:{label:'ورد', long:'الورد اليومي', track:true},
    personal:{label:'وقتك', long:'وقتك الخاص', track:false},
    move:{label:'مواصلات', long:'مواصلات', track:false},
    rest:{label:'راحة', long:'راحة', track:false}
  };
  const CATS = {};
  Object.keys(DEFAULT_CATS).forEach(k => { CATS[k] = Object.assign({}, DEFAULT_CATS[k], (CFG.categories || {})[k]); });
  const SUBJ = CFG.subjects || {};
  const SCHED = CFG.week || {};
  const COURSE = CFG.course ? {name: CFG.course.name, sub: CFG.course.sub || ''} : {name:'Course', sub:''};
  const PLAN = CFG.course ? CFG.course.plan : [];
  const TASK_TAGS = Object.assign({uni:CATS.uni.label, course:CATS.course.label, work:CATS.work.label, personal:CATS.personal.label}, CFG.taskTags || {});
  const RULES = CFG.rules || [];
  // Names of the two sides of the balance card, built from the category labels.
  const BAL_A = CATS.uni.label + ' و' + CATS.course.label, BAL_B = CATS.work.label + ' و' + CATS.personal.label;

  /* ---------------- time helpers ---------------- */
  const START = 420, END = 1500, SPAN = END - START;
  const toMin = t => { const [a,b] = t.split(':').map(Number); return a*60 + b; };
  const pad = n => String(n).padStart(2,'0');
  function fmt(min){
    const hh = Math.floor(min/60) % 24, mm = min % 60;
    return {t:((hh % 12) || 12) + ':' + pad(mm), s: hh < 12 ? 'ص' : 'م'};
  }
  const fmtStr = min => { const f = fmt(min); return f.t + f.s; };
  // Wrapped in LTR isolates so "1½" never reorders to "½1" inside Arabic text.
  function hoursText(min){
    const hh = Math.floor(min/60), r = Math.round(min % 60);
    const fr = {0:'',15:'¼',30:'½',45:'¾'}[r];
    let n;
    if (fr === undefined) n = (min/60).toFixed(1);
    else if (hh === 0) n = fr || '0';
    else n = hh + fr;
    return '\u2066' + n + '\u2069';
  }
  const durText = min => min < 60 ? min + ' د' : hoursText(min) + ' س';
  function countdown(min){
    if (min < 60) return min + ' د';
    const hh = Math.floor(min/60), mm = min % 60;
    return mm ? hh + ' س و ' + mm + ' د' : hh + ' س';
  }

  const cairoFmt = new Intl.DateTimeFormat('en-CA',{timeZone:CFG.timezone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  function cairoParts(d){
    const o = {}; cairoFmt.formatToParts(d).forEach(p => { o[p.type] = p.value; });
    return {iso: o.year + '-' + o.month + '-' + o.day, min: (Number(o.hour) % 24)*60 + Number(o.minute)};
  }
  function addDays(iso, n){
    const [y,m,d] = iso.split('-').map(Number);
    const t = new Date(Date.UTC(y, m-1, d + n));
    return t.getUTCFullYear() + '-' + pad(t.getUTCMonth()+1) + '-' + pad(t.getUTCDate());
  }
  function weekday(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
  function weekStart(iso){ return addDays(iso, -((weekday(iso) + 1) % 7)); }
  const dateFmt = new Intl.DateTimeFormat('ar-EG-u-nu-latn',{day:'numeric',month:'long',timeZone:'UTC'});
  function dateLabel(iso){ const [y,m,d] = iso.split('-').map(Number); return dateFmt.format(new Date(Date.UTC(y,m-1,d))); }
  function effectiveNow(){
    const p = cairoParts(new Date());
    // The schedule's day runs until 1:00am, so between midnight and 1:00 it still shows the previous day.
    if (p.min < 60) return {iso: addDays(p.iso, -1), min: p.min + 1440};
    return p;
  }

  /* ---------------- prayer times (location and method come from the settings) ---------------- */
  const PRAYERS = [['fajr','الفجر'],['dhuhr','الضهر'],['asr','العصر'],['maghrib','المغرب'],['isha','العشا']];
  const ptCache = {};
  let adhanCoords = null, adhanParams = null;
  try {
    if (window.adhan){
      adhanCoords = new adhan.Coordinates(CFG.location.lat, CFG.location.lng);
      adhanParams = adhan.CalculationMethod[CFG.prayerMethod]();
    }
  } catch(e){ adhanCoords = null; }
  function prayers(iso){
    if (ptCache[iso] !== undefined) return ptCache[iso];
    let r = null;
    if (adhanCoords){
      try {
        const [y,m,d] = iso.split('-').map(Number);
        const t = new adhan.PrayerTimes(adhanCoords, new Date(y, m-1, d), adhanParams);
        r = {};
        PRAYERS.forEach(([k]) => { r[k] = cairoParts(t[k]).min; });
      } catch(e){ r = null; }
    }
    ptCache[iso] = r;
    return r;
  }
  // Last Thursday of October (the last day before the clocks go back), as an ISO date. UTC arithmetic, no local zone.
  function lastThursdayOfOctober(year){
    const d = new Date(Date.UTC(year, 9, 31));
    while (d.getUTCDay() !== 4) d.setUTCDate(d.getUTCDate() - 1);
    return year + '-10-' + pad(d.getUTCDate());
  }
  // Which of a day's two versions applies: "late" (A) when the chosen prayer time is at or after the threshold
  // from the settings (versions.prayer, versions.thresholdMinutes), otherwise "early" (B). Without a versions
  // setting every day uses A. If prayer times can't be computed, versions.fallback gives the dates for A:
  // from lateFrom (MM-DD) through lateUntil (MM-DD, or the last Thursday of October).
  function phaseFor(iso){
    const v = CFG.versions;
    if (!v) return 'A';
    const p = prayers(iso);
    if (p) return p[v.prayer] >= v.thresholdMinutes ? 'A' : 'B';
    const f = v.fallback;
    if (!f) return 'A';
    const y = Number(iso.slice(0, 4));
    const until = f.lateUntil === 'last-thursday-october' ? lastThursdayOfOctober(y) : y + '-' + f.lateUntil;
    return iso >= y + '-' + f.lateFrom && iso <= until ? 'A' : 'B';
  }
  // start of anchor layout
  // Lays out one day's block list. A block may carry a sixth element {prayer, dir, min}: it then starts at that
  // day's prayer time (pm: minutes since midnight per prayer, or null) minus or plus min, rounded to 5 minutes.
  // The schedule has no gaps (a block ends where the next starts, the last ends at END), so everything after an
  // anchored block shifts with it, the block just before it ends where it starts, and the last block takes the
  // rest. If prayer times are missing, or an absorbing block would get shorter than 15 minutes (or than it
  // already was at its fixed time, when that was less), every block keeps its fixed time and a notice says why.
  // Keys always use the fixed start, so ticks never move.
  function layoutDay(list, pm, START, END){
    const tm = t => { const [a, b] = t.split(':').map(Number); return a * 60 + b; };
    const make = starts => list.map((b, i) => ({s: starts[i], e: i + 1 < list.length ? starts[i + 1] : END, cat: b[1], title: b[2], detail: b[3] || '', subj: b[4] || '', key: b[0] + '-' + b[1]}));
    const fixed = list.map(b => tm(b[0]));
    if (!list.some(b => b[5])) return {blocks: make(fixed), notice: null};
    if (!pm || list.some(b => b[5] && !Number.isFinite(pm[b[5].prayer]))) return {blocks: make(fixed), notice: 'unavailable'};
    let delta = 0;
    const starts = list.map((b, i) => {
      if (!b[5]) return fixed[i] + delta;
      let m = Math.round((pm[b[5].prayer] + (b[5].dir === 'before' ? -1 : 1) * b[5].min) / 5) * 5;
      if (m < START) m += 1440;
      delta = m - fixed[i];
      return m;
    });
    const fits = list.every((b, i) => {
      const last = i === list.length - 1;
      if (!last && !list[i + 1][5]) return true;
      const len = (last ? END : starts[i + 1]) - starts[i];
      const was = (last ? END : fixed[i + 1]) - fixed[i];
      return len >= Math.min(15, was);
    });
    return fits ? {blocks: make(starts), notice: null} : {blocks: make(fixed), notice: 'nofit'};
  }
  // end of anchor layout
  // The day's block list from the settings (version A or B by phaseFor), laid out for that date's prayer times.
  function listFor(iso){
    const day = SCHED[weekday(iso)] || {blocks: []};
    return Array.isArray(day.blocks) ? day.blocks : (day.blocks[phaseFor(iso)] || day.blocks.A);
  }
  function dayLayout(iso){ return layoutDay(listFor(iso), prayers(iso), START, END); }
  function blocksFor(iso){ return dayLayout(iso).blocks; }
  // null, 'unavailable' (no prayer times for this date) or 'nofit' (the day cannot hold the anchors): blocks are at their fixed times.
  function dayNotice(iso){ return dayLayout(iso).notice; }
  const ANCHOR_NOTICES = {
    unavailable: 'أوقات الصلاة مش متاحة، فالبلوكات المربوطة بالصلاة على مواعيدها الثابتة.',
    nofit: 'اليوم ده مش بيسع ربط البلوكات بالصلاة، فهي على مواعيدها الثابتة.'
  };
  function apptsFor(iso, store){
    const wd = weekday(iso);
    return (store.appts || []).filter(a => Number(a.day) === wd && a.time).map(a => {
      let m = toMin(a.time); if (m < START) m += 1440;
      return {min:m, label:a.label};
    });
  }

  /* ---------------- courses ---------------- */
  const BUILTIN_ID = 'aa';
  const builtinCourse = () => ({id: BUILTIN_ID, name: COURSE.name, sub: COURSE.sub, builtin: true, from: PLAN.length ? PLAN[0].from : '2000-01-01', to: PLAN.length ? PLAN[PLAN.length - 1].to : '2000-01-01'});
  const allCourses = store => [builtinCourse()].concat(store.courses);
  const courseById = (store, id) => allCourses(store).find(c => c.id === id) || builtinCourse();
  const mainCourse = store => courseById(store, store.mainCourse);
  function daysBetween(a, b){
    const [y1,m1,d1] = a.split('-').map(Number), [y2,m2,d2] = b.split('-').map(Number);
    return Math.round((Date.UTC(y2,m2-1,d2) - Date.UTC(y1,m1-1,d1)) / 86400000);
  }
  // Weeks of a course, each with its items as [number, title, extra, key].
  function planOf(c){
    if (c.builtin) return PLAN.map(w => ({from:w.from, to:w.to, label:w.label, note:w.note, items:w.items.map(it => [it[0], it[1], it[2] || null, it[0]])}));
    const mods = c.modules, M = mods.length;
    const n = Math.max(1, Math.ceil((daysBetween(c.from, c.to) + 1) / 7));
    const weeks = [];
    for (let k = 0; k < n; k++){
      const from = addDays(c.from, 7*k);
      let to = addDays(from, 6); if (to > c.to) to = c.to;
      const items = [];
      mods.forEach((m, i) => { if (Math.floor(i * n / M) === k) items.push([String(i + 1).padStart(2, '0'), m.title, null, m.id]); });
      if (items.length) weeks.push({from, to, label: dateLabel(from) + ' – ' + dateLabel(to), items});
    }
    return weeks;
  }
  const doneMap = (store, c) => c.builtin ? store.modules : (c.done || {});
  function toggleModule(update, c, key){
    update(s => {
      if (c.builtin){ if (s.modules[key]) delete s.modules[key]; else s.modules[key] = true; return s; }
      const x = s.courses.find(y => y.id === c.id); if (!x) return s;
      x.done = x.done || {};
      if (x.done[key]) delete x.done[key]; else x.done[key] = true;
      return s;
    });
  }
  let MAIN_NAME = COURSE.name;

  /* ---------------- storage: db (per-person) with local fallback ---------------- */
  const LOCAL_KEY = 'fall26-planner-v1';
  const LOCAL_OK = (() => { try { localStorage.setItem('__probe', '1'); localStorage.removeItem('__probe'); return true; } catch(e){ return false; } })();
  const EMPTY = () => ({v:1, checks:{}, modules:{}, tasks:[], appts:[], courses:[], mainCourse:BUILTIN_ID, extras:{}, phaseSeen:null});
  const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const isHM = s => typeof s === 'string' && /^\d{2}:\d{2}$/.test(s);
  function normalize(d){
    const e = EMPTY();
    if (!d || typeof d !== 'object') return e;
    const courses = Array.isArray(d.courses) ? d.courses.filter(c => c && typeof c.id === 'string' && typeof c.name === 'string' && isISO(c.from) && isISO(c.to) && Array.isArray(c.modules) && c.modules.length) : [];
    courses.forEach(c => { if (!c.done || typeof c.done !== 'object') c.done = {}; });
    const main = typeof d.mainCourse === 'string' && (d.mainCourse === BUILTIN_ID || courses.some(c => c.id === d.mainCourse)) ? d.mainCourse : BUILTIN_ID;
    const extras = {};
    if (d.extras && typeof d.extras === 'object') Object.keys(d.extras).forEach(k => {
      if (!isISO(k) || !Array.isArray(d.extras[k])) return;
      const list = d.extras[k].filter(x => x && typeof x.id === 'string' && isHM(x.s) && isHM(x.e) && CATS[x.cat] && typeof x.title === 'string');
      if (list.length) extras[k] = list;
    });
    return {v:1, checks: d.checks && typeof d.checks === 'object' ? d.checks : {}, modules: d.modules && typeof d.modules === 'object' ? d.modules : {}, tasks: Array.isArray(d.tasks) ? d.tasks : [], appts: Array.isArray(d.appts) ? d.appts : [], courses, mainCourse: main, extras, phaseSeen: d.phaseSeen === 'A' || d.phaseSeen === 'B' ? d.phaseSeen : null};
  }
  function loadLocal(){ try { const r = localStorage.getItem(LOCAL_KEY); return r ? normalize(JSON.parse(r)) : null; } catch(e){ return null; } }
  function saveLocal(s){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(s)); } catch(e){} }
  const hasData = s => Object.keys(s.checks).length || Object.keys(s.modules).length || s.tasks.length || s.appts.length || s.courses.length || Object.keys(s.extras).length;
  const uid36 = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  function useStore(){
    const [store, setStore] = useState(() => loadLocal() || EMPTY());
    const [sync, setSync] = useState('local');
    const latest = useRef(store), ref = useRef(null), timer = useRef(null), chain = useRef(Promise.resolve());

    function flush(){
      timer.current = null;
      const r = ref.current; if (!r) return;
      const body = JSON.parse(JSON.stringify(latest.current));
      chain.current = chain.current.then(() => r.set(body)).catch(err => {
        if (err && err.code === 'unavailable'){
          setTimeout(() => { if (!timer.current) timer.current = setTimeout(flush, 0); }, 1200 + Math.random()*800);
        } else { ref.current = null; setSync('local'); }
      });
    }
    function queue(delay){
      if (timer.current) clearTimeout(timer.current);
      timer.current = setTimeout(flush, delay == null ? 600 : delay);
    }
    function update(fn){
      const next = normalize(fn(JSON.parse(JSON.stringify(latest.current))));
      latest.current = next; setStore(next); saveLocal(next);
      if (ref.current) queue();
    }
    // A restore: the whole progress at once, and, when a synced copy is active, written there now rather than
    // after the usual delay. Resolves true when that write finished (or there is no synced copy), false if it failed.
    function replaceAll(nextRaw){
      const next = normalize(nextRaw);
      latest.current = next; setStore(next); saveLocal(next);
      if (timer.current) { clearTimeout(timer.current); timer.current = null; }
      const r = ref.current;
      if (!r) return Promise.resolve(true);
      const body = JSON.parse(JSON.stringify(next));
      const p = chain.current.then(() => r.set(body));
      chain.current = p.catch(() => {});
      return p.then(() => true, () => false);
    }

    useEffect(() => {
      let unsub = null, dead = false;
      (async () => {
        try {
          if (!window.claude || typeof claude.use !== 'function') return;
          const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
          const id = user ? await user.id() : null;
          if (!db || !id || dead) return;
          const docRef = db.doc('data/users/' + id + '/tracker');
          let first = true;
          unsub = docRef.onSnapshot(snap => {
            if (snap.metadata && snap.metadata.hasPendingWrites) return;
            ref.current = docRef;
            setSync('cloud');
            if (timer.current) return;
            if (first){
              first = false;
              if (!snap.exists){ if (hasData(latest.current)) queue(0); return; }
            }
            if (!snap.exists) return;
            const next = normalize(snap.data());
            if (JSON.stringify(next) !== JSON.stringify(latest.current)){
              latest.current = next; setStore(next); saveLocal(next);
            }
          }, () => { ref.current = null; setSync('local'); });
        } catch(e){ setSync('local'); }
      })();
      return () => { dead = true; if (unsub) unsub(); };
    }, []);

    return [store, update, sync, replaceAll];
  }

  /* ---------------- day model: schedule + one-off blocks + status ---------------- */
  const FAMILY = {uni:'a', study:'a', course:'a', work:'b', gym:'b', quran:'b'};
  function hmToMin(t){ let m = toMin(t); if (m < START) m += 1440; return m; }
  function dayBlocks(iso, store){
    const base = blocksFor(iso);
    const extra = ((store.extras || {})[iso] || []).map(x => ({s: hmToMin(x.s), e: hmToMin(x.e), cat: x.cat, title: x.title, detail: 'حاجة زيادة لليوم ده', subj: '', key: 'x-' + x.id, extra: x.id}));
    return base.concat(extra).sort((p, q) => p.s - q.s || (p.extra ? 1 : 0) - (q.extra ? 1 : 0));
  }
  const statusOf = (store, iso, key) => { const v = (store.checks[iso] || {})[key]; return v === true ? 'done' : v === 'skip' ? 'skip' : null; };
  function setStatus(update, iso, key, val){
    update(s => {
      const c = s.checks[iso] || {};
      if (val) c[key] = val === 'done' ? true : 'skip'; else delete c[key];
      if (Object.keys(c).length) s.checks[iso] = c; else delete s.checks[iso];
      return s;
    });
  }
  function dayCounts(iso, store){
    const tracked = dayBlocks(iso, store).filter(b => CATS[b.cat].track);
    let done = 0, skip = 0, doneMin = 0;
    tracked.forEach(b => { const st = statusOf(store, iso, b.key); if (st === 'done'){ done++; doneMin += b.e - b.s; } else if (st === 'skip') skip++; });
    return {total: tracked.length - skip, done, skip, doneMin};
  }

  /* ---------------- small UI pieces ---------------- */
  const CheckSvg = () => html`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>`;
  const Check = ({on, cat, label, onToggle}) => html`
    <button type="button" class=${'chk c-' + cat} role="checkbox" aria-checked=${on ? 'true' : 'false'} aria-label=${label} onClick=${onToggle}><i><${CheckSvg} /></i></button>`;
  const Moon = () => html`<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M10.6 2.2a6 6 0 1 0 3.2 9.9A5 5 0 0 1 10.6 2.2z"/></svg>`;
  const Plus = () => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`;
  const Pencil = () => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 7.5l3 3"/></svg>`;
  const Star = () => html`<svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.1 1.1 5.9L12 16.6l-5.3 2.9 1.1-5.9-4.4-4.1 6-.8z"/></svg>`;
  const Chevron = ({dir}) => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d=${dir === 'next' ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6'}/></svg>`;
  const Time = ({min}) => { const f = fmt(min); return html`<bdi class="t">${f.t}</bdi><span class="suf">${f.s}</span>`; };
  // Course study slots follow whichever course is main; the live lectures keep the built-in course's name.
  // The built-in course's name in a block title ("Name|action" or just "Name") is swapped for whichever course is main.
  const showTitle = text => {
    if (text.indexOf('محاضرة لايف') > -1 || !COURSE.name) return text;
    if (text === COURSE.name) return MAIN_NAME;
    return text.indexOf(COURSE.name + '|') === 0 ? MAIN_NAME + '|' + text.slice(COURSE.name.length + 1) : text;
  };
  function Title({text}){
    const t = showTitle(text);
    if (t.indexOf('|') > -1){ const [s, a] = t.split('|'); return html`<bdi class="subj">${s}</bdi> · ${a}`; }
    return t;
  }
  const plainTitle = text => showTitle(text).replace('|', ' · ');

  // The balance as a guilloche rosette: university and course on one half, work and life on the other.
  // Each half has 36 fine petals; a petal is inked in a category's colour for its share of the half's planned time that got done.
  function Balance({a, b, label}){
    const pa = a.plan ? a.done / a.plan : 0, pb = b.plan ? b.done / b.plan : 0;
    const N = 36, cx = 120, cy = 120;
    const inks = side => {
      const out = []; let used = 0;
      side.order.forEach(k => { const n = side.plan ? Math.round((side.by[k] || 0) / side.plan * N) : 0; for (let i = 0; i < n && used < N; i++, used++) out.push(k); });
      while (out.length < N) out.push(null);
      return out;
    };
    const petals = (side, from, cls) => inks(side).map((k, i) => {
      const ang = from + (i + 0.5) * 180 / N;
      return html`<ellipse cx=${cx + 52} cy=${cy} rx="52" ry="15" transform=${`rotate(${ang.toFixed(2)} ${cx} ${cy})`} class=${k ? 'petal c-' + k : 'petal off'} />`;
    });
    let note;
    if (!a.done && !b.done) note = 'لسه مفيش حاجة متعلّمة ' + label + '.';

    const pct = v => Math.round(v * 100) + '%';
    const total = a.done + b.done;
    return html`<div class="balance">
      <svg viewBox="0 0 240 240" role="img" aria-label=${note}>
        <circle class="ring" cx=${cx} cy=${cy} r="110" />
        <circle class="ring" cx=${cx} cy=${cy} r="106" />
        <g>${petals(a, -90, 'a')}</g>
        <g>${petals(b, 90, 'b')}</g>
        <line class="axis-line" x1=${cx} y1="6" x2=${cx} y2="234" />
        <circle class="core" cx=${cx} cy=${cy} r="34" />
        <text class="core-num" x=${cx} y=${cy + 6} text-anchor="middle">${hoursText(total)}</text>
        <text class="core-lbl" x=${cx} y=${cy + 22} text-anchor="middle">ساعة</text>
      </svg>
      <div class="balance-legend">
        <div class="a"><span>${BAL_A}</span><b>${pct(pa)}</b><span class="small muted"><bdi class="num">${hoursText(a.done)}</bdi> من <bdi class="num">${hoursText(a.plan)}</bdi> س</span></div>
        <div class="b"><span>${BAL_B}</span><b>${pct(pb)}</b><span class="small muted"><bdi class="num">${hoursText(b.done)}</bdi> من <bdi class="num">${hoursText(b.plan)}</bdi> س</span></div>
      </div>
      <p class="balance-note">${note}</p>
    </div>`;
  }
  function balanceOf(days, store){
    const a = {done:0, plan:0, by:{}, order:['uni','study','course']}, b = {done:0, plan:0, by:{}, order:['work','gym','quran']};

      const f = FAMILY[bl.cat]; if (!f) return;
      const st = statusOf(store, d, bl.key); if (st === 'skip') return;
      const m = bl.e - bl.s, side = f === 'a' ? a : b;

    }));
    return {a, b};
  }

  /* ---------------- Today ---------------- */
  function WeekArrows({iso, setIso}){
    return html`<span class="arrows">
      <button type="button" class="icon-btn" aria-label="الأسبوع اللي فات" onClick=${() => setIso(addDays(iso, -7))}><${Chevron} dir="prev" /></button>
      <button type="button" class="icon-btn" aria-label="الأسبوع الجاي" onClick=${() => setIso(addDays(iso, 7))}><${Chevron} dir="next" /></button>
    </span>`;
  }
  function DayPicker({iso, setIso, now}){
    const ws = weekStart(iso);

    return html`<div class="daypick">
      <div class="days">
        ${days.map(d => html`<button type="button" class=${'dp' + (d === now.iso ? ' is-today' : '')} aria-pressed=${d === iso ? 'true' : 'false'} aria-label=${DAY_NAMES[weekday(d)] + ' ' + dateLabel(d)} onClick=${() => setIso(d)}>
          <span class="dn">${DAY_SHORT[weekday(d)]}</span><span class="dd">${Number(d.slice(8))}</span></button>`)}
      </div>
    </div>`;
  }

  function PrayerCard({iso, now}){
    const p = prayers(iso);
    if (!p) return null;
    const isToday = iso === now.iso;
    const fri = weekday(iso) === 5;
    let nextKey = null;
    if (isToday){ const nx = PRAYERS.find(([k]) => p[k] > now.min); nextKey = nx ? nx[0] : null; }
    return html`<div class="panel" style="padding:10px" aria-label="مواعيد الصلاة">
      <div class="prayers">
        ${PRAYERS.map(([k, name]) => html`<div class=${'pr' + (k === nextKey ? ' next' : '') + (isToday && p[k] <= now.min ? ' past' : '')}>
          <span class="pn">${fri && k === 'dhuhr' ? 'الجمعة' : name}</span>
          <span class="pt">${fmt(p[k]).t}</span></div>`)}
      </div>
    </div>`;
  }

  function TargetCard({iso, store, goTab}){
    const c = mainCourse(store);
    const plan = planOf(c), dm = doneMap(store, c);
    const all = plan.reduce((a, w) => a.concat(w.items), []);
    const n = all.filter(it => dm[it[3]]).length;
    const wk = plan.find(w => iso >= w.from && iso <= w.to) || (plan.length && iso < plan[0].from ? plan[0] : null);
    const next = all.find(it => !dm[it[3]]);
    const behind = wk ? wk.items.filter(it => !dm[it[3]]).length : 0;
    return html`<button type="button" class="target c-course" onClick=${() => goTab('course')}>
      <span class="target-name"><bdi>${c.name}</bdi></span>
      <span class="small muted">التارجت الأساسي · خلّصت <bdi class="num">${n}</bdi> من <bdi class="num">${all.length}</bdi> موديول</span>
      <span class="track"><span class="fill" style=${{display:'block', width: (all.length ? n/all.length*100 : 0).toFixed(1) + '%'}}></span></span>
      ${next ? html`<span class="small">الجاي: <bdi dir="ltr">${next[0]} · ${next[1]}</bdi></span>
        ${wk && behind ? html`<span class="small muted">فاضل <bdi class="num">${behind}</bdi> في خطة الأسبوع ده</span>` : null}`
        : html`<span class="small">خلّصت الكورس كله.</span>`}
    </button>`;
  }

  function DayProgress({iso, store}){
    const k = dayCounts(iso, store);
    const pct = k.total ? Math.round(k.done / k.total * 100) : 0;
    return html`<div class="prog" style="--c:var(--fg)">
      <div class="prog-row"><span>خلّصت <bdi class="num">${k.done}</bdi> من <bdi class="num">${k.total}</bdi>${k.skip ? html`<span class="muted"> · اتلغى <bdi class="num">${k.skip}</bdi></span>` : null}</span><span class="muted small"><bdi class="num">${hoursText(k.doneMin)}</bdi> س متعلّمة</span></div>
      <div class="track"><div class="fill" style=${{width: pct + '%'}}></div></div>
    </div>`;
  }

  function NowCard({iso, now, store, update, skip, onReview}){
    const blocks = dayBlocks(iso, store).filter(b => CATS[b.cat].track);
    const live = blocks.filter(b => now.min >= b.s && now.min < b.e && statusOf(store, iso, b.key) !== 'skip');
    const cur = live.length ? live[live.length - 1] : null;
    const upcoming = blocks.filter(b => b.s > now.min && statusOf(store, iso, b.key) === null);
    const main = cur || upcoming[0] || null;
    const after = main ? blocks.find(b => b.s >= main.e && b !== main && statusOf(store, iso, b.key) !== 'skip') || upcoming.find(b => b !== main) : null;
    const p = prayers(iso);
    const nx = p ? PRAYERS.find(([k]) => p[k] > now.min) : null;
    const fri = weekday(iso) === 5;
    if (!main) return html`<section class="now c-quran" aria-label="دلوقتي">
      <p class="now-done">مفيش حاجة تانية في جدول النهارده.</p>
      ${(() => { const left = blocks.filter(b => statusOf(store, iso, b.key) === null).length; return left ? html`<p class="now-meta">فيه <bdi class="num">${left}</bdi> بلوك لسه معلّمتش عليهم.</p>
        <div class="now-actions"><button type="button" class="btn primary" onClick=${onReview}>راجع يومك</button></div>` : null; })()}
      <${DayProgress} iso=${iso} store=${store} />
    </section>`;
    const st = statusOf(store, iso, main.key);
    return html`<section class=${'now c-' + main.cat} aria-label="دلوقتي">
      <div>
        <p class="now-title"><${Title} text=${main.title} /></p>
        <p class="now-meta"><b>${CATS[main.cat].label}</b> · ${cur
          ? html`فاضل ${countdown(main.e - now.min)} · لحد ${fmtStr(main.e)}`
          : html`بيبدأ ${fmtStr(main.s)}، بعد ${countdown(main.s - now.min)}`}</p>
      </div>

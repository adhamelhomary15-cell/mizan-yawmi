<title>ميزان يومي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Spectral:wght@700&display=swap">
<style>
/* Layout: phone-first RTL app. Oxblood shell (bottom bar on phones, side rail from 960px). World: Egyptian banknote inks on security paper; signature: the day's guilloche rosette. */
:root{
  --bg:#E7ECE3; --surface:#FAFBF6; --fg:#1D1B17; --muted:#585C52; --line:#CDD3C6; --quiet:#D6DBCF; --danger:#B4300C;
  --shell:#6E1A28; --shell-fg:#FAFBF6; --shell-dim:#E9C9CF;
  /* denominations: oxblood and madder (university), plum (course), sepia (work), ochre (gym, Quran, your time) */
  --uni:#7B1E2E; --study:#94304B; --course:#5B2A6B; --work:#5A402B; --gym:#735600; --quran:#6A4E00; --personal:#7A5A0A;
  /* the ready colours for kinds the user adds (feature 016) */
  --k-teal:#0E5E58; --k-blue:#244F8C; --k-green:#2F5E22; --k-slate:#46515F; --k-copper:#8A3A14; --k-olive:#535C14;
  --tint:9%;
  --font-display:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-mono:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-num:"Spectral",Georgia,"Times New Roman",serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
}
/* The one dark set. data-theme is always light or dark (feature 022), so no media-query copy is needed. */
:root[data-theme="dark"]{
  --bg:#16141A; --surface:#201D24; --fg:#EDE9E1; --muted:#A7A39A; --line:#36313B; --quiet:#3A3540; --danger:#FF9A76;
  --shell:#3A1119; --shell-fg:#EDE9E1; --shell-dim:#C9A3AA;
  --uni:#EE8E9C; --study:#F2A7B8; --course:#CFA0DD; --work:#D8B898; --gym:#E4C55C; --quran:#E8C96A; --personal:#EFD98F;
  --k-teal:#7FD3C9; --k-blue:#A3C2F2; --k-green:#A9D68F; --k-slate:#B9C4D1; --k-copper:#F0A57D; --k-olive:#CBD48A;
  --tint:15%; color-scheme:dark;
}
/* Palettes (feature 022): the frame and the ground only. The kinds' inks and --fg never change (the Denomination
   Rule); tools/check-schedule.js checks every ink on every palette, light and dark. Oxblood is :root above. */
:root[data-palette="olive"]{--bg:#E9EADF; --surface:#FBFBF5; --muted:#5A5C4E; --line:#D0D2C2; --quiet:#D9DBCC; --shell:#434C14; --shell-dim:#DDE3BF;}
:root[data-palette="olive"][data-theme="dark"]{--bg:#151611; --surface:#1E2019; --muted:#A6A796; --line:#33352B; --quiet:#383A2F; --shell:#262B0C; --shell-dim:#C3C9A0;}
:root[data-palette="navy"]{--bg:#E4E8EE; --surface:#F8FAFC; --muted:#545B66; --line:#CBD2DC; --quiet:#D4DAE3; --shell:#1F2F4F; --shell-dim:#C7D2E6;}
:root[data-palette="navy"][data-theme="dark"]{--bg:#12151B; --surface:#1A1F27; --muted:#A0A7B2; --line:#2E3540; --quiet:#343B46; --shell:#121C30; --shell-dim:#A9B8D3;}
:root[data-palette="graphite"]{--bg:#E8E8E6; --surface:#FAFAF9; --muted:#57585A; --line:#D1D1CE; --quiet:#D9D9D6; --shell:#2E3135; --shell-dim:#D3D5D8;}
:root[data-palette="graphite"][data-theme="dark"]{--bg:#141516; --surface:#1D1E20; --muted:#A5A6A8; --line:#333538; --quiet:#393B3E; --shell:#1E2023; --shell-dim:#BFC1C4;}
html{scrollbar-color:var(--quiet) var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;caret-color:var(--course);accent-color:var(--course)}
::selection{background:color-mix(in srgb,var(--course) 28%,var(--surface));color:var(--fg)}
#app{min-height:60vh}
.wrap{max-width:720px;margin:0 auto;padding-inline:var(--s4);padding-block:18px 128px;display:flex;flex-direction:column;gap:var(--s5)}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.2}
h2{font-family:var(--font-display);font-weight:500;font-size:18px;line-height:1.35}
h3{font-family:var(--font-display);font-weight:500;font-size:16px;line-height:1.35}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--course);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec{display:flex;flex-direction:column;gap:var(--s3)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:var(--s1) var(--s3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.c-uni{--c:var(--uni)} .c-study{--c:var(--study)} .c-course{--c:var(--course)} .c-work{--c:var(--work)} .c-gym{--c:var(--gym)} .c-quran{--c:var(--quran)} .c-personal{--c:var(--personal)} .c-move{--c:var(--quiet)} .c-rest{--c:var(--quiet)} .c-life{--c:var(--gym)}
.c-k-teal{--c:var(--k-teal)} .c-k-blue{--c:var(--k-blue)} .c-k-green{--c:var(--k-green)} .c-k-slate{--c:var(--k-slate)} .c-k-copper{--c:var(--k-copper)} .c-k-olive{--c:var(--k-olive)}

/* headers: the heading leads, the date sits under it */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.top-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.sub{font-size:14px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding-top:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.sync.cloud i{background:var(--gym)}
.btn{min-height:40px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn svg{width:16px;height:16px;flex:none}
.top > .btn{white-space:nowrap;flex:none}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.icon-btn svg{width:18px;height:18px}

/* day picker */
.daypick{display:block}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-width:0}
.dp{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;padding:4px 0;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;line-height:1.3}
.dp .dn{font-size:12px;color:var(--muted)}
.dp .dd{font-family:var(--font-mono);font-weight:600;font-size:15px}
.dp.is-today .dn{color:var(--fg);font-weight:600}
.dp.is-today{border-color:var(--line)}
.dp[aria-pressed="true"]{background:var(--shell);color:var(--shell-fg);border-color:var(--shell)}
.dp[aria-pressed="true"] .dn{color:var(--shell-dim)}

/* now card: the block in progress, one tap to finish it */
.now{display:flex;flex-direction:column;gap:var(--s3);background:color-mix(in srgb,var(--c) var(--tint),var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-radius:18px;padding:var(--s4)}
.now-title{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.3}
.now-meta{font-size:14px;color:var(--muted)}
.now-meta b{color:var(--c);font-weight:600}
.now-actions{display:flex;flex-wrap:wrap;gap:var(--s2)}
.now-actions .btn{min-height:48px;font-size:15px;padding-inline:18px}
.now-actions .btn.primary{background:var(--c);border-color:var(--c);color:var(--surface);flex:1 1 12rem}
.now-actions .btn.primary[aria-pressed="true"]{background:var(--surface);color:var(--c)}
.now-next{display:flex;flex-direction:column;gap:2px;border-top:1px solid color-mix(in srgb,var(--c) 22%,var(--line));padding-top:var(--s3);font-size:14px}
.now-next .row-line{display:flex;justify-content:space-between;gap:var(--s3)}
.now-next .lbl{color:var(--muted)}
.now-done{font-family:var(--font-display);font-weight:500;font-size:18px}

/* prayers */
.prayers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;text-align:center}
.pr{display:flex;flex-direction:column;padding:6px 2px;border-radius:10px}
.pr .pn{font-size:12px;color:var(--muted)}
.pr .pt{font-family:var(--font-mono);font-weight:600;font-size:14px}
.pr.next{background:color-mix(in srgb,var(--quran) var(--tint),var(--surface));outline:1px solid var(--quran)}
.pr.next .pn{color:var(--quran);font-weight:600}
.pr.past .pt{color:var(--muted)}

/* progress */
.prog{display:flex;flex-direction:column;gap:6px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);font-size:14px}
.track{height:8px;border-radius:4px;background:color-mix(in srgb,var(--line) 75%,transparent);overflow:hidden}
.fill{height:100%;background:var(--c,var(--fg));border-radius:4px;transition:width .2s cubic-bezier(.16,1,.3,1)}

/* balance: university and course on one pan, work and life on the other */
.balance{display:flex;flex-direction:column;gap:var(--s2)}
.balance svg{width:100%;max-width:280px;height:auto;align-self:center}
.balance .ring{fill:none;stroke:var(--line);stroke-width:1}
.balance .petal{fill:none;stroke:var(--c);stroke-width:1.1;transition:stroke .45s cubic-bezier(.16,1,.3,1),stroke-width .45s cubic-bezier(.16,1,.3,1)}
.balance .petal.off{stroke:var(--quiet);stroke-width:.8}
.balance .axis-line{stroke:var(--line);stroke-width:1}
.balance .core{fill:var(--surface);stroke:var(--line);stroke-width:1}
.balance .core-num{font-family:var(--font-num);font-weight:700;font-size:24px;fill:var(--fg)}
.balance .core-lbl{font-family:var(--font-body);font-size:10px;fill:var(--muted)}
.balance-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);font-size:14px}
.balance-legend div{display:flex;flex-direction:column;gap:2px}
.balance-legend b{font-family:var(--font-num);font-size:26px;font-weight:700;line-height:1.1}
.balance-legend .a b{color:var(--uni)} .balance-legend .b b{color:var(--gym)}
.balance-legend .b{text-align:end}
.balance-note{font-size:14px;color:var(--muted);text-align:center}

/* timeline */
.note{color:var(--muted);font-size:14px;max-width:62ch}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:44px 82px minmax(0,1fr) auto;gap:var(--s2);align-items:start;border-radius:14px}
.row.main{background:color-mix(in srgb,var(--c) var(--tint),var(--surface));padding:6px 10px 6px 6px}
.row.quiet{padding:2px 10px 2px 6px;color:var(--muted);font-size:14px}
.row.is-now{outline:2px solid var(--fg);outline-offset:-2px}
.row.quiet.is-now{background:var(--surface)}
.row.skipped{background:transparent;border:1px dashed var(--line)}
.chk{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
.chk i{width:28px;height:28px;border-radius:50%;border:2px solid var(--c);background:var(--surface);display:grid;place-items:center;transition:background .15s ease}
.chk svg{width:15px;height:15px;opacity:0;color:var(--surface)}
.chk[aria-checked="true"] i{background:var(--c)}
.chk[aria-checked="true"] svg{opacity:1}
.chk:disabled{cursor:default}
.chk:disabled i{border-style:dashed;border-color:var(--muted);background:transparent}
.row-body{display:block;width:100%;text-align:start;background:none;border:0;padding:8px 0;cursor:pointer;border-radius:10px;min-width:0}
.row.quiet .row-body{cursor:default;padding:6px 0}
.row-body > span{display:block}
.row.done .title,.row.skipped .title{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
.row.moved .title{text-decoration:none}
.postpone{grid-column:1 / -1;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.postpone-batch{flex-direction:column;align-items:stretch}
.postpone-batch p{display:flex;flex-direction:column;gap:4px}
.o-now{display:flex;flex-direction:column;gap:var(--s3)}
.time{display:flex;flex-direction:column;line-height:1.35;padding-top:10px;white-space:nowrap;min-width:0}
.row.quiet .time{padding-top:7px}
.time .t{font-family:var(--font-mono);font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums}
.row.quiet .time .t{font-weight:500;font-size:13px}
.time .suf{font-size:11.5px;color:var(--muted);margin-inline-start:2px}
.time .end{font-size:12px;color:var(--muted)}
.time .end .t{font-size:12px;font-weight:500}
.title{font-weight:600;font-size:15.5px;line-height:1.45}
.row.quiet .title{font-weight:400;font-size:14px}
.subj{font-weight:600}
.meta{margin-top:2px;font-size:13px;color:var(--muted);text-wrap:pretty}
.meta b{color:var(--c);font-weight:600}
.now-pill{display:inline-block;font-size:11px;font-weight:600;background:var(--fg);color:var(--bg);padding:0 8px;border-radius:999px;margin-inline-start:6px;vertical-align:2px}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mk{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.mk svg{width:12px;height:12px;color:var(--quran)}
.mk.appt{border-color:var(--quran);color:var(--quran);font-weight:600}
.denom{direction:ltr;unicode-bidi:isolate;font-family:var(--font-num);font-weight:700;font-size:26px;line-height:1;color:var(--c);padding-top:10px;white-space:nowrap;font-variant-numeric:lining-nums}
.denom small{font-family:var(--font-body);font-weight:500;font-size:11px;margin-inline-start:2px}
.row.done .denom,.row.skipped .denom{opacity:.45}
.row-actions{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:var(--s2);padding:0 0 var(--s2)}
.add-block{align-self:flex-start}
.head-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.o-head .top{flex-wrap:wrap}
.arrows{display:inline-flex;gap:6px}
.review-all{align-self:flex-start}
.review{display:flex;flex-direction:column;gap:var(--s3);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:var(--s4)}
.review-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.review-list li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s2) var(--s3);padding:10px 0;border-top:1px solid var(--line)}
.review-list li:first-child{border-top:0}
.review-text{display:flex;flex-direction:column;min-width:0;flex:1 1 12rem}
.review-actions{display:flex;gap:var(--s2)}
.review-actions .btn.primary{background:var(--c);border-color:var(--c);color:var(--surface)}
.review-empty{font-family:var(--font-display);font-weight:500;font-size:17px}
.add-task{align-self:flex-start}
.panel > .add-task{display:inline-flex}

/* main target */
.target{display:flex;flex-direction:column;gap:6px;width:100%;text-align:start;cursor:pointer;background:color-mix(in srgb,var(--course) var(--tint),var(--surface));border:1px solid color-mix(in srgb,var(--course) 30%,var(--line));border-radius:14px;padding:12px 14px}
.target:hover{border-color:var(--course)}
.target-name{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.3}
.target .track{display:block;height:6px}

/* tasks */
.tlist{display:flex;flex-direction:column}
.titem{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:var(--s2);align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.titem.has-act{grid-template-columns:44px minmax(0,1fr) auto auto}
.titem:first-child{border-top:0}
.titem .ttext{overflow-wrap:anywhere}
.titem.done .ttext{text-decoration:line-through;color:var(--muted)}
.ttag{font-size:12px;color:var(--c);font-weight:600}
.tdue{font-size:12px;color:var(--muted)}
.tdue.late{color:var(--danger);font-weight:600}
.del{min-height:44px;min-width:44px;background:none;border:0;color:var(--muted);cursor:pointer;padding:0 8px;border-radius:10px;font-size:13px}
.del:hover{color:var(--danger)}
.edit{min-height:44px;min-width:44px;background:none;border:0;color:var(--muted);cursor:pointer;padding:0 8px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.edit svg{width:18px;height:18px;flex:none}
.edit:hover{color:var(--fg)}
.tact{display:flex;align-items:center}
.paste-open{margin-inline-start:var(--s2)}
.paste{display:flex;flex-direction:column;gap:10px}
.paste textarea{font-size:14px}
.paste-row{display:grid;grid-template-columns:24px minmax(0,1fr);gap:var(--s2);align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.paste-row input{width:20px;height:20px;margin-top:2px}
.paste-text{cursor:pointer}
.paste-type{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;max-width:100%;box-sizing:border-box;align-self:flex-start}
.paste-rejected{border-top:1px solid var(--line);padding-top:8px}
.paste-rejected ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.paste-rejected li{display:flex;flex-direction:column;gap:2px;min-width:0}
.paste-raw{overflow-wrap:anywhere;font-size:14px}
.paste-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.paste-text{overflow-wrap:anywhere}
.titem-edit{padding:8px 0;border-top:1px solid var(--line)}
.titem-edit:first-child{border-top:0}

/* week */
.strips{display:flex;flex-direction:column;gap:2px}
.strip{display:grid;grid-template-columns:46px minmax(0,1fr);align-items:center;gap:var(--s2);width:100%;min-height:36px;background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;text-align:start}
.strip:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.strip-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.today-dot{width:6px;height:6px;border-radius:50%;background:var(--fg);display:inline-block}
.bar{position:relative;height:16px;border-radius:4px;background:color-mix(in srgb,var(--line) 55%,transparent);overflow:hidden}
.seg{position:absolute;top:0;bottom:0;background:var(--c);box-shadow:inset 1px 0 0 var(--surface)}
.seg.c-move,.seg.c-rest{background:var(--quiet)}
.seg.skipped{opacity:.35}
.tick{position:absolute;top:0;bottom:0;width:1.5px;background:var(--fg);opacity:.45}
.nowmark{position:absolute;top:0;bottom:0;width:2.5px;background:var(--fg)}
.axis{display:grid;grid-template-columns:46px minmax(0,1fr);gap:var(--s2);padding-inline:6px;margin-top:2px}
.axis-track{position:relative;height:18px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.axis-track span{position:absolute;top:0;white-space:nowrap;transform:translateX(50%)}
.axis-track span.first{transform:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 6px 2px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.legend .tk{width:2px;height:10px;border-radius:0;background:var(--fg);opacity:.5}
.stats{display:flex;flex-direction:column;gap:14px}
.stat{display:grid;grid-template-columns:minmax(0,8rem) minmax(0,1fr) auto;gap:var(--s3);align-items:center;font-size:14px}
.stat .track{height:10px;border-radius:5px}
.stat .val{font-size:12.5px;color:var(--muted);text-align:end;white-space:nowrap}
.stat .val b{font-family:var(--font-mono);color:var(--fg);font-weight:600}
.stat .extra{grid-column:1 / -1;font-size:12.5px;color:var(--muted);margin-top:-8px}
details.rules-box summary{cursor:pointer;font-family:var(--font-display);font-weight:500;font-size:16px;padding:var(--s2) 0;list-style-position:inside}
.rules{margin:var(--s2) 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:7px;max-width:64ch;font-size:14px}

/* course */
.weeks{display:flex;flex-direction:column;gap:10px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 4px}
.week.is-current{border-color:var(--course);box-shadow:0 0 0 1px var(--course)}
.week-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap;padding-bottom:6px}
.week-dates{font-size:13px;color:var(--muted)}
.cur-pill{font-size:12px;font-weight:600;color:var(--course)}
.week-note{font-size:13px;color:var(--muted);padding-bottom:8px}
.mod{display:grid;grid-template-columns:44px auto minmax(0,1fr);gap:var(--s2);align-items:center;padding:2px 0;border-top:1px solid var(--line)}
.mod .mnum{font-family:var(--font-mono);font-weight:600;color:var(--course);min-width:2.2ch}
.mod .mtitle{overflow-wrap:anywhere}
.mod .mextra{color:var(--muted);font-size:13px}
.mod.done .mtitle bdi{text-decoration:line-through;color:var(--muted)}
.mod .chk{--c:var(--course)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips .star{width:14px;height:14px;color:var(--work)}
.chips button[aria-pressed="true"] .star{color:inherit}

/* forms */
.form{display:flex;flex-direction:column;gap:10px}
.form-row{display:flex;flex-wrap:wrap;gap:var(--s2)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 9rem;min-width:0}
.field.wide{flex-basis:100%}
/* layout tweaks that used to be inline styles */
.panel.tight{padding:10px}
.panel.tlist{padding-block:4px}
.prog.plain{--c:var(--fg)}
.form-row.to-end{align-items:flex-end}
.field.narrow{flex:0 1 8rem}
.tlist.spaced{margin-top:6px}
.form-above{margin-bottom:10px}
.form-below{margin-top:12px}
.shrink{min-width:0}
.snap-days{display:flex;flex-direction:column;gap:6px;margin-top:var(--s2)}
/* schedule editor (feature 014) */
.ed-row{display:flex;align-items:baseline;gap:var(--s3);min-height:44px}
.ed-row .num{min-width:3.2em;font-variant-numeric:tabular-nums}
.ed-form,.ed-part{margin-top:var(--s2)}
.ed-part summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.ed-kind{padding-block:var(--s2);border-top:1px solid var(--line)}
.ed-flags{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4)}
.ed-colors{display:flex;flex-wrap:wrap;gap:var(--s2)}
.swatch{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
.swatch i{width:18px;height:18px;border-radius:50%;background:var(--c)}
.swatch[aria-pressed="true"]{border:2px solid var(--fg);font-weight:600}
.check-line{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px}
.check-line input{width:20px;height:20px}
.ed-preview{margin-top:var(--s3);padding:10px 12px;border:1px dashed var(--line);border-radius:12px}
.field input,.field select,.field textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%;min-height:44px;box-sizing:border-box}
.field textarea{min-height:9rem;resize:vertical;line-height:1.7}
::placeholder{color:var(--muted);opacity:1}
.form-err{font-size:13px;color:var(--danger)}
.backup-act{display:flex;flex-wrap:wrap;gap:var(--s2)}
.backup-act .btn{min-height:44px;min-width:44px}
.restore{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.restore-preview{flex-direction:column;align-items:stretch}
.storage-line{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
.appt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.appt:first-child{border-top:0}
.aact{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.appt-edit{padding:8px 0;border-top:1px solid var(--line)}
.appt-edit:first-child{border-top:0}
.appt .when{font-size:13px;color:var(--muted)}
.empty{font-size:14px;color:var(--muted);padding:6px 0}
.filters{display:flex;gap:6px}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.add-form{display:flex;flex-direction:column;gap:10px}
.course-form{gap:12px}
.install,.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.install p,.notice p{display:flex;flex-direction:column;min-width:0}
.notice .btn{flex:none}

/* UI polish: give daily navigation, empty states, and secondary controls a clearer rhythm. */
.o-head{gap:var(--s3)}
.o-head .top{align-items:center}
.o-head .head-actions{gap:8px}
.o-head .daypick{padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.o-head .days{gap:5px}
.o-head .dp{min-height:58px;border-radius:11px}
.o-head .dp[aria-pressed="true"]{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--shell-fg) 28%,transparent)}
.coursev > h2{padding-top:var(--s2);border-top:1px solid var(--line)}
.coursev .prog{padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tasksv .sec-head,.settingsv .sec-head,.wk-routines .sec-head{align-items:center}
.tasksv .panel,.settingsv .panel{border-radius:16px}
.empty{padding:14px 16px;border:1px dashed var(--line);border-radius:12px;background:color-mix(in srgb,var(--fg) 2.5%,var(--surface));line-height:1.7}
.coursev .week{border-radius:16px;padding:14px 16px 6px}
.settingsv input[type="file"]{padding:7px;background:var(--surface);cursor:pointer}
.settingsv input[type="file"]::file-selector-button{min-height:32px;margin-inline-end:10px;padding:5px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
.settingsv input[type="file"]::file-selector-button:hover{border-color:var(--muted)}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible,.wk-in:focus-visible{border-color:var(--course);outline:2px solid color-mix(in srgb,var(--course) 28%,transparent);outline-offset:1px}
.btn{transition:background-color .15s ease,border-color .15s ease,transform .15s ease}
.btn:active{transform:translateY(1px)}

/* layout blocks */
.today-view,.weekv,.coursev,.tasksv,.settingsv{display:flex;flex-direction:column;gap:var(--s5)}
.today-main,.today-side{display:contents}
.o-head{order:0} .o-now{order:1} .o-target{order:2} .o-tasks{order:3} .o-timeline{order:4} .o-prayers{order:5} .o-balance{order:6}
.brand{display:none}

/* workouts */
.wkv{display:flex;flex-direction:column;gap:var(--s4)}
.wkv .btn{min-height:44px;min-width:44px}
.wkv .wk-link{min-width:44px}
.wk-head{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:var(--s3);background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.wk-title{flex:1 1 auto;min-width:0;text-align:center;overflow-wrap:anywhere}
.wk-title h1{font-size:20px}
.wk-meta{font-size:13px;color:var(--muted)}
.wk-rest{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);font-size:14px;padding:2px 0;border-block:1px dashed var(--line)}
.wk-rest.over{color:var(--danger);font-weight:600}
.wk-rest-act{display:flex;gap:var(--s1)}
.wk-rest-act .btn{min-height:44px}
.wk-step{display:flex;align-items:center;justify-content:center;gap:var(--s4)}
.wk-step .btn{min-width:64px;min-height:44px}
.wk-step-v{font-size:22px;font-weight:600;min-width:4ch;text-align:center}
.wk-home{display:flex;flex-direction:column;gap:var(--s3)}
.wk-home .btn{min-height:52px;font-size:16px}
.wk-ex{display:flex;flex-direction:column;gap:var(--s3)}
.wk-ex-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.wk-ex-head h2{min-width:0;overflow-wrap:anywhere}
.wk-illustration{display:block;width:88px;height:64px;flex:none;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--gym) 8%,var(--surface))}
.wk-illustration.large{width:min(100%,360px);height:auto;aspect-ratio:2.25;border-radius:14px;background:color-mix(in srgb,var(--gym) 5%,var(--surface))}
.wk-illustration.wg-frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px;box-sizing:border-box;border:0;background:#f7f7f4}
.wk-illustration.wg-frames:not(.large){position:relative;overflow:hidden;grid-template-rows:minmax(0,1fr);gap:4px;padding:5px;border:1px solid color-mix(in srgb,var(--line) 76%,transparent);border-radius:13px;background:linear-gradient(145deg,#fffefa,#f2eee4);box-shadow:inset 0 1px 0 rgba(255,255,255,.82),0 3px 9px rgba(0,0,0,.09)}
.wk-illustration.wg-frames:not(.large)::after{content:"";position:absolute;inset-inline-start:9px;bottom:4px;width:24px;height:2px;border-radius:2px;background:var(--gym);opacity:.68}
.wk-illustration.large.wg-frames{width:min(100%,420px);height:auto;aspect-ratio:auto}
.wg-frame{display:flex;flex-direction:column;min-width:0;margin:0;overflow:hidden;border:1px solid var(--line);border-radius:9px;background:#f7f7f4}
.wg-frame img{display:block;width:100%;aspect-ratio:1;object-fit:contain;filter:brightness(0)}
.wg-frame figcaption{padding:3px 0 5px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.35px;color:var(--muted)}
.wg-generic-figure{display:block;width:100%;aspect-ratio:1;fill:#fff;stroke:#171717;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;background:#f7f7f4}
.wg-generic-figure>path:not(.wg-generic-floor){fill:none;stroke-width:4.6}
.wg-generic-figure .wg-generic-floor{fill:none;stroke:#777;stroke-width:1.4}
.wg-thumb{display:block;grid-column:1/-1;width:100%;height:100%;object-fit:contain;background:transparent;border-radius:8px;filter:brightness(0);transform:scale(1.22)}
.wk-exrow .wk-pick{min-height:72px}
.wk-ex-visual{display:flex;align-items:center;gap:var(--s3);min-width:0;flex:1}
.wk-ex-visual h2{min-width:0}
.wk-rline{display:flex;align-items:center;gap:var(--s3)}
.wk-rline .wk-illustration{width:76px;height:54px}
.wk-pick bdi{flex:1;min-width:0}
.wk-ex-detail{display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding:var(--s4);border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.wk-history-name{display:flex;align-items:center;gap:var(--s2);min-width:0}
.wk-history-name bdi{min-width:0;overflow-wrap:anywhere}
.wk-history-name .wk-illustration{width:58px;height:44px}
.wk-rsummary{display:flex;flex-wrap:wrap;gap:var(--s2)}
.wk-rsummary-item{display:flex;align-items:center;gap:6px;min-width:0}
.wk-rsummary-item .wk-illustration{width:52px;height:40px}
.wk-ritem-name{display:flex;align-items:center;gap:var(--s2)}
.wk-ritem-name .wk-illustration{width:72px;height:52px}
.wk-menu{display:flex;gap:var(--s2)}
.wk-sets{display:flex;flex-direction:column;gap:6px}
.wk-set{display:grid;grid-template-columns:28px minmax(0,1fr) 68px 68px 44px;gap:6px;align-items:center}
.wk-set-head{font-size:12px;color:var(--muted);text-align:center}
.wk-no{text-align:center;font-weight:600}
.wk-prev{font-size:13px;color:var(--muted);text-align:center;white-space:nowrap}
.wk-in{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:0;width:100%;min-height:44px;box-sizing:border-box;text-align:center}
.wk-in[aria-invalid="true"]{border-color:var(--danger)}
.wk-done{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;padding:0}
.wk-done svg{width:18px;height:18px;opacity:.35}
.wk-done[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wk-done[aria-pressed="true"] svg{opacity:1}
.wk-add{display:flex;flex-wrap:wrap;gap:var(--s2)}
.wk-picklist{display:flex;flex-direction:column;padding:6px 14px}
.wk-pick{display:block;width:100%;text-align:start;background:none;border:0;border-top:1px solid var(--line);min-height:48px;padding:10px 0;cursor:pointer;font-size:15px}
.wk-pick:first-child{border-top:0}
.wk-exrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;border-top:1px solid var(--line)}
.wk-exrow:first-child{border-top:0}
.wk-exrow .wk-pick{flex:1;width:auto;border-top:0}
.wk-exrow .btn{min-height:44px}
.wk-pick{display:flex;align-items:center;gap:var(--s3);text-align:start}
.wk-pick > .wk-illustration{width:108px;height:76px}
.wk-exrow .wk-pick > .wk-illustration{width:132px;height:96px}
.wk-ex-visual > .wk-illustration{width:120px;height:82px}
.wk-ask{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wk-exs{display:flex;flex-direction:column;gap:14px}
.wk-exadd{display:flex;flex-direction:column;gap:10px}
.wk-sheet{position:fixed;inset-inline:var(--s4);bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:7;max-width:520px;margin-inline:auto;display:flex;flex-direction:column;gap:var(--s2);background:var(--surface);border:1px solid var(--fg);border-radius:14px;padding:var(--s4);box-shadow:0 8px 24px rgba(10,16,22,.22)}
.wk-sheet-actions{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
.wk-sheet-actions .btn{flex:1 1 8rem;min-height:44px}
.wk-sheet-actions .btn:disabled{opacity:.45;cursor:default}

.wk-switch .btn{flex:1;min-height:44px}
.wk-hist{display:flex;flex-direction:column;gap:var(--s5)}
.wk-card{display:flex;flex-direction:column;gap:6px;width:100%;text-align:start;cursor:pointer;font:inherit;color:inherit}
.wk-card:hover{border-color:var(--muted)}
.wk-card-head{display:flex;flex-direction:column}
.wk-card-row{display:grid;grid-template-columns:minmax(0,8.5rem) minmax(0,1fr);gap:var(--s3);font-size:14px}
.wk-card-foot{display:flex;justify-content:space-between;gap:var(--s3);border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.wk-hrow{display:flex;align-items:center;gap:var(--s3);padding:4px 0}
.wk-hfix{margin-inline-start:auto;min-height:44px}
/* routines */
.wk-routines{display:flex;flex-direction:column;gap:var(--s3)}
.wk-routines .sec-head .btn{min-height:44px}
.wk-rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
.wk-rcard{display:flex;flex-direction:column;gap:4px;min-width:0}
.wk-rcard-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
.wk-rcard-head .wk-link{text-decoration:none;min-width:44px;overflow-wrap:anywhere}
.wk-rcard-body{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:start;cursor:pointer;min-height:44px}
.wk-rcard .wk-menu{flex-wrap:wrap}
.wk-rcard .wk-menu .btn{min-height:44px}
.wk-rline{padding:10px 0;border-top:1px solid var(--line)}
.wk-rline:first-child{border-top:0}
.wk-wide{width:100%;justify-content:center;min-height:48px}
.wk-redit{display:flex;flex-direction:column;padding:6px 14px}
.wk-ritem{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.wk-ritem:first-child{border-top:0}
.wk-ritem-act{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.wk-ritem-act .wk-step{gap:var(--s2);margin-inline-end:auto}
.wk-ritem-act .wk-step .btn{min-width:44px}
.wk-ritem-act .wk-step-v{font-size:16px}
.wk-ritem-act > .btn{min-width:44px;min-height:44px;justify-content:center}
.wk-hedit{display:grid;grid-template-columns:28px 68px 68px minmax(0,1fr);gap:6px;align-items:center;padding:4px 0}
.wk-hedit-act{display:flex;gap:6px;justify-content:flex-end}
.wk-hedit-act .btn{min-height:44px;min-width:44px;justify-content:center}
.wk-hedit .form-err{grid-column:1 / -1}
.wk-link{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:start;min-height:44px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.wk-best{display:flex;flex-direction:column;gap:var(--s1)}

/* toast with undo */
.toast{position:fixed;inset-inline:var(--s4);bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:6;max-width:520px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);background:var(--fg);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;box-shadow:0 8px 24px rgba(10,16,22,.22)}
.toast p{padding-inline-start:10px;font-size:14px}
.toast .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}

/* bottom nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:5;background:var(--shell);color:var(--shell-fg);padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px))}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.nav button .dot{position:absolute;top:8px;inset-inline-end:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--shell-fg);box-shadow:0 0 0 2px var(--shell)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;min-height:52px;padding:6px 0;border-radius:12px;cursor:pointer;color:var(--shell-dim);font-size:12px}
.nav button:focus-visible{outline-color:var(--shell-fg)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--shell-fg);font-weight:600;background:color-mix(in srgb,var(--shell-fg) 16%,transparent)}

.fail{max-width:560px;margin:40px auto;padding-inline:16px;color:var(--muted);text-align:center}
@media (max-width:400px){
  .o-head .top{align-items:stretch}
  .o-head .head-actions{justify-content:space-between;width:100%}
  .o-head .head-actions > .btn{flex:1}
  .o-head .daypick{padding:4px}
  .o-head .dp{min-height:54px}
  .empty{padding:12px}
  .row{grid-template-columns:44px 76px minmax(0,1fr) auto;gap:6px}
  .time .end{font-size:11.5px}
  .stat{grid-template-columns:minmax(0,6rem) minmax(0,1fr) auto}
}
@media (min-width:960px){
  .shell{padding-inline-start:232px}
  .nav{top:0;bottom:0;inset-inline-start:0;inset-inline-end:auto;width:232px;padding:28px 14px;display:flex;flex-direction:column;gap:22px}
  .nav-in{display:flex;flex-direction:column;gap:4px;max-width:none;margin:0}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;padding:10px 12px;font-size:15px}
  .brand{display:block;font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.3;padding-inline:12px}
  .brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--shell-dim);margin-top:4px}
  .wrap{max-width:1120px;padding-inline:40px;padding-block:36px 48px;gap:var(--s6)}
  .toast,.wk-sheet{bottom:var(--s5)}
  .today-view{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"head head" "main side";gap:var(--s6) 36px;align-items:start}
  .o-head{grid-area:head}
  .today-main{display:flex;flex-direction:column;gap:var(--s5);grid-area:main;min-width:0}
  .today-side{display:flex;flex-direction:column;gap:var(--s5);grid-area:side;position:sticky;top:24px;min-width:0}
  .daypick{max-width:640px}
  .weekv{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-areas:"head head" "strips balance" "strips stats" "subjects rules";gap:var(--s5) 36px;align-items:start}
  .a-head{grid-area:head} .a-balance{grid-area:balance} .a-strips{grid-area:strips} .a-stats{grid-area:stats} .a-subjects{grid-area:subjects} .a-rules{grid-area:rules}

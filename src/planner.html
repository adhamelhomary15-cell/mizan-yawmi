        <button type="button" class="btn primary" aria-pressed=${st === 'done' ? 'true' : 'false'} onClick=${() => setStatus(update, iso, main.key, st === 'done' ? null : 'done')}><${CheckSvg} />${st === 'done' ? 'اتعلّم، رجّعه' : 'خلّصته'}</button>
        <button type="button" class="btn" onClick=${() => skip(main)}>اتلغى النهارده</button>
      </div>
      <div class="now-next">
        ${after ? html`<p class="row-line"><span class="lbl">بعده</span><span><${Title} text=${after.title} /> · ${fmtStr(after.s)}</span></p>` : null}
        ${nx ? html`<p class="row-line"><span class="lbl">${fri && nx[0] === 'dhuhr' ? 'الجمعة' : nx[1]}</span><span>${fmtStr(p[nx[0]])} · بعد ${countdown(p[nx[0]] - now.min)}</span></p>` : null}
      </div>
      <${DayProgress} iso=${iso} store=${store} />
    </section>`;
  }

  // Night review: everything not yet marked, one tap each. Opened from the header button.
  function Review({iso, now, store, update, skip, act, onClose}){
    const isToday = iso === now.iso;
    const tracked = dayBlocks(iso, store).filter(b => CATS[b.cat].track);
    const open = tracked.filter(b => statusOf(store, iso, b.key) === null && (!isToday || b.s <= now.min));
    const later = isToday ? tracked.filter(b => statusOf(store, iso, b.key) === null && b.s > now.min).length : 0;
    const ab = balanceOf([iso], store);
    return html`<section class="review" aria-label="مراجعة اليوم">
      <div class="sec-head"><h2>${isToday ? 'راجع يومك' : 'مراجعة ' + DAY_NAMES[weekday(iso)]}</h2><button type="button" class="btn ghost small" onClick=${onClose}>اقفل</button></div>
      ${open.length ? html`<ul class="review-list">
        ${open.map(b => html`<li class=${'c-' + b.cat}>
          <div class="review-text"><span class="title"><${Title} text=${b.title} /></span><span class="meta"><b>${CATS[b.cat].label}</b> · ${fmtStr(b.s)} لحد ${fmtStr(b.e)}</span></div>
          <div class="review-actions">
            <button type="button" class="btn primary" onClick=${() => setStatus(update, iso, b.key, 'done')}><${CheckSvg} />خلّصته</button>
            <button type="button" class="btn" onClick=${() => skip(b)}>اتلغى</button>
          </div>
        </li>`)}
      </ul>` : html`<p class="review-empty">${later ? 'كل اللي فات متعلّم.' : 'كل بلوكات اليوم متعلّمة.'}</p>`}
      ${open.length > 1 ? html`<button type="button" class="btn review-all" onClick=${() => act('اتعلّم ' + open.length + ' بلوك إنهم خلصوا', s => { const c = s.checks[iso] || {}; open.forEach(b => { c[b.key] = true; }); s.checks[iso] = c; return s; })}><${CheckSvg} />علّمهم كلهم خلصوا</button>` : null}
      ${later ? html`<p class="small muted">فاضل <bdi class="num">${later}</bdi> بلوك لسه ميعادهم مجاش.</p>` : null}
      <${DayProgress} iso=${iso} store=${store} />
      <${Balance} a=${ab.a} b=${ab.b} label=${isToday ? 'النهارده' : 'اليوم ده'} />
    </section>`;
  }

  function AddBlock({iso, update, onDone}){
    const [title, setTitle] = useState('');
    const [s, setS] = useState('');
    const [e, setE] = useState('');
    const [cat, setCat] = useState('study');
    const [err, setErr] = useState('');
    const submit = ev => {
      ev.preventDefault();
      if (!title.trim()) return setErr('اكتب اسم الحاجة.');
      if (!s || !e) return setErr('اختار هتبدأ إمتى وهتخلص إمتى.');
      if (hmToMin(e) <= hmToMin(s)) return setErr('ميعاد الخلصان لازم يكون بعد البداية.');
      setErr('');
      update(st => { const list = (st.extras[iso] || []).slice(); list.push({id: uid36(), s, e, cat, title: title.trim().slice(0, 80)}); st.extras[iso] = list; return st; });
      onDone();
    };
    return html`<form class="panel add-form" onSubmit=${submit}>
      <div class="sec-head"><h2>حاجة زيادة لليوم ده</h2><button type="button" class="btn ghost small" onClick=${onDone}>إلغاء</button></div>
      <div class="form-row">
        <label class="field wide" for="ab-title">إيه هي<input id="ab-title" value=${title} onInput=${x => setTitle(x.target.value)} placeholder="مثلاً: محاضرة تعويضية" maxlength="80" /></label>
        <label class="field" for="ab-s">من<input id="ab-s" type="time" value=${s} onInput=${x => setS(x.target.value)} /></label>
        <label class="field" for="ab-e">لحد<input id="ab-e" type="time" value=${e} onInput=${x => setE(x.target.value)} /></label>
        <label class="field" for="ab-cat">النوع<select id="ab-cat" value=${cat} onChange=${x => setCat(x.target.value)}>
          ${['uni','study','course','work','gym','quran','personal'].map(k => html`<option value=${k}>${CATS[k].label}</option>`)}</select></label>
      </div>
      ${err ? html`<p class="form-err" role="alert">${err}</p>` : null}
      <div><button type="submit" class="btn primary">ضيفها</button></div>
    </form>`;
  }

  function TodayView({iso, setIso, now, store, update, goTab, remove, act}){
    const skip = b => act('اتلغى "' + plainTitle(b.title) + '" النهارده', s => { const c = s.checks[iso] || {}; c[b.key] = 'skip'; s.checks[iso] = c; return s; });
    const blocks = dayBlocks(iso, store);
    const p = prayers(iso);
    const appts = apptsFor(iso, store);
    const isToday = iso === now.iso;
    const [open, setOpen] = useState(null);
    const [adding, setAdding] = useState(false);
    const [reviewing, setReviewing] = useState(false);
    useEffect(() => { setOpen(null); setAdding(false); }, [iso]);
    const dayTasks = store.tasks.filter(t => !t.done && t.due && (t.due === iso || (isToday && t.due < iso)));
    const wd = weekday(iso);
    const ab = balanceOf([iso], store);

    return html`<div class="today-view">
      <div class="sec o-head">
        <div class="top">
          <div class="top-meta">
            <h1>${DAY_NAMES[wd]}</h1>
            <p class="sub">${dateLabel(iso)}${isToday ? ' · النهارده' : ''}</p>
          </div>
          <div class="head-actions">
            ${!isToday ? html`<button type="button" class="btn" onClick=${() => setIso(now.iso)}>النهارده</button>` : null}
            <button type="button" class="btn" aria-expanded=${reviewing ? 'true' : 'false'} onClick=${() => setReviewing(!reviewing)}>${reviewing ? 'اقفل المراجعة' : 'راجع يومك'}</button>
            <${WeekArrows} iso=${iso} setIso=${setIso} />
          </div>
        </div>
        <${DayPicker} iso=${iso} setIso=${setIso} now=${now} />
      </div>

      <div class="today-main">
        <div class="o-now">${reviewing ? html`<${Review} iso=${iso} now=${now} store=${store} update=${update} skip=${skip} act=${act} onClose=${() => setReviewing(false)} />`
          : isToday ? html`<${NowCard} iso=${iso} now=${now} store=${store} update=${update} skip=${skip} onReview=${() => setReviewing(true)} />` : html`<${DayProgress} iso=${iso} store=${store} />`}</div>

        <div class="sec o-timeline">
          <ol class="timeline">
            ${blocks.map(b => {
              const quiet = b.cat === 'rest' || b.cat === 'move';
              const tracked = CATS[b.cat].track;
              const cur = isToday && now.min >= b.s && now.min < b.e;
              const st = statusOf(store, iso, b.key);
              const isOpen = open === b.key;
              const marks = [];
              if (p) PRAYERS.forEach(([k, name]) => { if (k !== 'fajr' && p[k] >= b.s && p[k] < b.e) marks.push({kind:'pr', text:(wd === 5 && k === 'dhuhr' ? 'الجمعة' : name) + ' ' + fmtStr(p[k]), at:p[k]}); });
              appts.forEach(a => { if (a.min >= b.s && a.min < b.e) marks.push({kind:'appt', text:a.label + ' ' + fmtStr(a.min), at:a.min}); });
              marks.sort((x, y) => x.at - y.at);
              const markEls = marks.length ? html`<span class="marks">${marks.map(m => html`<span class=${'mk' + (m.kind === 'appt' ? ' appt' : '')}>${m.kind === 'pr' ? html`<${Moon} />` : null}${m.text}</span>`)}</span>` : null;
              const body = html`
                <span class="title"><${Title} text=${b.title} />${quiet ? html`<span class="muted small"> · ${durText(b.e - b.s)}</span>` : null}${cur ? html`<span class="now-pill">دلوقتي</span>` : null}</span>
                ${quiet ? (b.detail ? html`<span class="meta">${b.detail}</span>` : null)
                  : html`<span class="meta"><b>${CATS[b.cat].label}</b>${st === 'skip' ? ' · اتلغى' : ''}${b.detail ? ' · ' + b.detail : ''}</span>`}
                ${markEls}`;
              return html`<li class=${'row ' + (quiet ? 'quiet' : 'main') + ' c-' + b.cat + (cur ? ' is-now' : '') + (st === 'done' ? ' done' : '') + (st === 'skip' ? ' skipped' : '')}>
                <div>${tracked ? html`<${Check} on=${st === 'done'} cat=${b.cat} label=${'خلّصت: ' + plainTitle(b.title)} onToggle=${() => setStatus(update, iso, b.key, st === 'done' ? null : 'done')} />` : null}</div>
                <div class="time"><span><${Time} min=${b.s} /></span>${quiet ? null : html`<span class="end">لحد <${Time} min=${b.e} /></span>`}</div>
                ${quiet && !b.extra
                  ? html`<div class="row-body">${body}</div>`
                  : html`<button type="button" class="row-body" aria-expanded=${isOpen ? 'true' : 'false'} onClick=${() => setOpen(isOpen ? null : b.key)}>${body}</button>`}
                ${quiet ? null : html`<span class="denom" aria-hidden="true">${(b.e - b.s) < 60 ? (b.e - b.s) : hoursText(b.e - b.s)}<small>${(b.e - b.s) < 60 ? 'د' : 'س'}</small></span>`}
                ${isOpen ? html`<div class="row-actions">
                  ${tracked ? (st === 'skip'
                    ? html`<button type="button" class="btn" onClick=${() => { setStatus(update, iso, b.key, null); setOpen(null); }}>رجّعه للجدول</button>`
                    : html`<button type="button" class="btn" onClick=${() => { setOpen(null); skip(b); }}>اتلغى النهارده</button>`) : null}
                  ${b.extra ? html`<button type="button" class="btn ghost" onClick=${() => { setOpen(null); remove('اتمسحت "' + b.title + '"', s => { s.extras[iso] = (s.extras[iso] || []).filter(x => x.id !== b.extra); return s; }); }}>امسحها</button>` : null}
                </div>` : null}
              </li>`;
            })}
          </ol>
          ${adding ? html`<${AddBlock} iso=${iso} update=${update} onDone=${() => setAdding(false)} />`
            : html`<button type="button" class="btn add-block" onClick=${() => setAdding(true)}><${Plus} />ضيف حاجة لليوم ده</button>`}
          ${(SCHED[wd] || {}).note ? html`<p class="note">${SCHED[wd].note}</p>` : null}
          ${ANCHOR_NOTICES[dayNotice(iso)] ? html`<p class="note">${ANCHOR_NOTICES[dayNotice(iso)]}</p>` : null}
          <p class="small muted">دوس على أي بلوك عشان تلغيه النهارده. ${p ? 'الفجر ' + fmtStr(p.fajr) + '، والمواعيد محسوبة لـ ' + (CFG.location.label || 'موقعك') + ' بطريقة ' + CFG.prayerMethod + '.' : ''}</p>
        </div>
      </div>

      <aside class="today-side">
        <div class="o-target"><${TargetCard} iso=${iso} store=${store} goTab=${goTab} /></div>
        ${dayTasks.length ? html`<div class="sec o-tasks">
          <div class="sec-head"><h2>مهام ${isToday ? 'النهارده' : 'اليوم ده'}</h2><button type="button" class="btn ghost small" onClick=${() => goTab('tasks')}>كل المهام</button></div>
          <div class="panel tlist" style="padding-block:4px">
            ${dayTasks.map(t => html`<div class=${'titem c-' + t.tag}>
              <${Check} on=${false} cat=${t.tag} label=${'خلّص: ' + t.text} onToggle=${() => update(s => { const x = s.tasks.find(y => y.id === t.id); if (x) x.done = true; return s; })} />
              <span class="ttext">${t.text}</span>
              <span class=${'tdue' + (t.due < iso ? ' late' : '')}>${t.due < iso ? 'متأخرة' : TASK_TAGS[t.tag]}</span>
            </div>`)}
          </div>
        </div>` : null}
        <div class="sec o-prayers"><h2>مواعيد الصلاة</h2><${PrayerCard} iso=${iso} now=${now} /></div>
        <div class="sec o-balance"><h2>ميزان اليوم</h2><div class="panel"><${Balance} a=${ab.a} b=${ab.b} label="النهارده" /></div></div>
      </aside>
    </div>`;
  }

  /* ---------------- Week ---------------- */
  function WeekView({iso, setIso, now, store, goDay}){
    const ws = weekStart(iso);
    const days = WEEK_ORDER.map((_, i) => addDays(ws, i));
    const plan = {}, got = {}, skipped = {}, subjPlan = {}, subjGot = {};
    let gym = 0, gymPlan = 0, quranDays = 0;
    days.forEach(d => {
      let q = false;
      dayBlocks(d, store).forEach(b => {
        const m = b.e - b.s;
        if (!CATS[b.cat].track) return;
        const st = statusOf(store, d, b.key);
        if (st === 'skip'){ skipped[b.cat] = (skipped[b.cat] || 0) + m; return; }
        plan[b.cat] = (plan[b.cat] || 0) + m;
        if (b.cat === 'gym') gymPlan++;
        if (b.subj) subjPlan[b.subj] = (subjPlan[b.subj] || 0) + m;
        if (st === 'done'){
          got[b.cat] = (got[b.cat] || 0) + m;
          if (b.subj) subjGot[b.subj] = (subjGot[b.subj] || 0) + m;
          if (b.cat === 'gym') gym++;
          if (b.cat === 'quran') q = true;
        }
      });
      if (q) quranDays++;
    });
    const statRow = (cat, label, pl, gt, extra) => html`<div class=${'stat c-' + cat}>
      <span>${label}</span>
      <div class="track"><div class="fill" style=${{width: (pl ? Math.min(100, gt/pl*100) : 0) + '%'}}></div></div>
      <span class="val"><b>${hoursText(gt)}</b> من ${hoursText(pl)} س</span>
      ${extra ? html`<span class="extra">${extra}</span>` : null}</div>`;
    const skipNote = k => skipped[k] ? 'اتلغى ' + durText(skipped[k]) : '';
    const join = (...xs) => xs.filter(Boolean).join(' · ');
    const bal = balanceOf(days, store);

    return html`<div class="weekv">
      <div class="top a-head">
        <div class="top-meta"><h1>الأسبوع</h1><p class="sub">${dateLabel(days[0])} – ${dateLabel(days[6])}</p></div>
        <${WeekArrows} iso=${iso} setIso=${setIso} />
      </div>

      <div class="sec a-balance"><h2>ميزان الأسبوع</h2><div class="panel"><${Balance} a=${bal.a} b=${bal.b} label="الأسبوع ده" /></div></div>

      <div class="sec a-strips">
        <div class="sec-head"><h2>شكل الأسبوع</h2><p class="small muted">دوس على يوم تفتحه</p></div>
        <div class="panel" style="padding:10px">
          <div class="strips">
            ${days.map(d => {
              const p = prayers(d);
              const isToday = d === now.iso;
              return html`<button type="button" class="strip" onClick=${() => goDay(d)} aria-label=${DAY_NAMES[weekday(d)] + ' ' + dateLabel(d)}>
                <span class="strip-name">${DAY_SHORT[weekday(d)]}${isToday ? html`<i class="today-dot"></i>` : null}</span>
                <span class="bar">
                  ${dayBlocks(d, store).map(b => html`<span class=${'seg c-' + b.cat + (statusOf(store, d, b.key) === 'skip' ? ' skipped' : '')} style=${{insetInlineStart: ((b.s - START)/SPAN*100).toFixed(3) + '%', width: ((b.e - b.s)/SPAN*100).toFixed(3) + '%'}}></span>`)}
                  ${p ? ['dhuhr','asr','maghrib','isha'].map(k => html`<span class="tick" style=${{insetInlineStart: ((p[k] - START)/SPAN*100).toFixed(3) + '%'}}></span>`) : null}
                  ${isToday ? html`<span class="nowmark" style=${{insetInlineStart: ((Math.min(Math.max(now.min, START), END) - START)/SPAN*100).toFixed(3) + '%'}}></span>` : null}
                </span>
              </button>`;
            })}
          </div>
          <div class="axis" aria-hidden="true"><span></span>
            <div class="axis-track">
              <span class="first" style="inset-inline-start:0%">7ص</span>
              <span style="inset-inline-start:27.78%">12م</span>
              <span style="inset-inline-start:55.56%">5م</span>
              <span style="inset-inline-start:83.33%">10م</span>
            </div>
          </div>
          <div class="legend">
            <span class="c-uni"><i></i>${CATS.uni.label}</span>
            <span class="c-course"><i></i>${CATS.course.label}</span>
            <span class="c-work"><i></i>${CATS.work.label}</span>
            <span class="c-life"><i></i>${CATS.gym.label + ' و' + CATS.quran.label + ' و' + CATS.personal.label}</span>
            <span class="c-rest"><i></i>${CATS.rest.label + ' و' + CATS.move.label}</span>
            <span><i class="tk"></i>صلاة</span>
          </div>
        </div>
      </div>

      <div class="sec a-stats">
        <h2>اللي اتعمل من الجدول</h2>
        <div class="panel stats">
          ${statRow('uni', CATS.uni.long, plan.uni || 0, got.uni || 0, skipNote('uni'))}
          ${statRow('study', CATS.study.long, plan.study || 0, got.study || 0, skipNote('study'))}
          ${statRow('course', CATS.course.long, plan.course || 0, got.course || 0, skipNote('course'))}
          ${statRow('work', CATS.work.long, plan.work || 0, got.work || 0, skipNote('work'))}
          ${statRow('gym', CATS.gym.long, plan.gym || 0, got.gym || 0, join('رحت ' + gym + ' من ' + gymPlan + ' مرات', skipNote('gym')))}
          ${statRow('quran', CATS.quran.long, plan.quran || 0, got.quran || 0, join(CATS.quran.label + ' في ' + quranDays + ' من 7 أيام', skipNote('quran')))}
        </div>
      </div>

      <div class="sec a-subjects">
        <h2>${CATS.study.long} بالمادة</h2>
        <div class="panel stats">
          ${Object.keys(SUBJ).sort((a, b) => (subjPlan[b] || 0) - (subjPlan[a] || 0)).map(k => statRow('study', html`<bdi class="subj" title=${SUBJ[k]}>${k}</bdi>`, subjPlan[k] || 0, subjGot[k] || 0))}
        </div>
      </div>

      <details class="a-rules rules-box">
        <summary>إزاي الجدول متظبط</summary>
        <ul class="rules">${RULES.map(r => html`<li>${r}</li>`)}</ul>
      </details>
    </div>`;
  }

  /* ---------------- Course ---------------- */
  function CourseForm({now, onSave, onCancel}){
    const [name, setName] = useState('');
    const [sub, setSub] = useState('');
    const [from, setFrom] = useState(now.iso);
    const [to, setTo] = useState(addDays(now.iso, 27));
    const [count, setCount] = useState('8');
    const [mods, setMods] = useState('');
    const [err, setErr] = useState('');
    const fillNumbers = () => {
      const n = Math.max(1, Math.min(60, parseInt(count, 10) || 0));
      setMods(Array.from({length: n}, (_, i) => 'موديول ' + (i + 1)).join('\n'));
    };
    const submit = e => {
      e.preventDefault();
      const lines = mods.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 60);
      if (!name.trim()) return setErr('اكتب اسم الكورس.');
      if (!isISO(from) || !isISO(to)) return setErr('اختار تاريخ البداية وتاريخ الهدف.');
      if (to < from) return setErr('تاريخ الهدف لازم يكون بعد البداية.');
      if (!lines.length) return setErr('اكتب الموديولات، كل موديول في سطر، أو دوس "اعمل قايمة بالأرقام".');
      setErr('');
      onSave({id: 'c' + uid36(), name: name.trim().slice(0, 60), sub: sub.trim().slice(0, 120), from, to, modules: lines.map((t, i) => ({id: 'm' + (i + 1) + '-' + uid36(), title: t.slice(0, 120)})), done: {}});
    };
    return html`<form class="panel form course-form" onSubmit=${submit}>
      <div class="sec-head"><h2>كورس جديد</h2><button type="button" class="btn ghost small" onClick=${onCancel}>إلغاء</button></div>
      <div class="form-row">
        <label class="field wide" for="cf-name">اسم الكورس<input id="cf-name" value=${name} onInput=${e => setName(e.target.value)} placeholder="مثلاً: Python for Cybersecurity" maxlength="60" /></label>
        <label class="field wide" for="cf-sub">وصف قصير (اختياري)<input id="cf-sub" value=${sub} onInput=${e => setSub(e.target.value)} placeholder="المنصة أو المدرّس أو الهدف منه" maxlength="120" /></label>
        <label class="field" for="cf-from">هبدأ يوم<input id="cf-from" type="date" value=${from} onInput=${e => setFrom(e.target.value)} /></label>
        <label class="field" for="cf-to">عايز أخلّصه يوم<input id="cf-to" type="date" value=${to} onInput=${e => setTo(e.target.value)} /></label>
      </div>
      <label class="field wide" for="cf-mods">الموديولات أو الدروس، كل واحد في سطر
        <textarea id="cf-mods" value=${mods} onInput=${e => setMods(e.target.value)} placeholder=${'Intro & Setup\nCore Concepts\nFirst Project'}></textarea>
      </label>
      <div class="form-row" style="align-items:flex-end">
        <label class="field" for="cf-count" style="flex:0 1 8rem">عدد الموديولات<input id="cf-count" type="number" min="1" max="60" value=${count} onInput=${e => setCount(e.target.value)} /></label>
        <button type="button" class="btn" onClick=${fillNumbers}>اعمل قايمة بالأرقام</button>
      </div>
      <p class="small muted">التطبيق بيوزّع الموديولات على الأسابيع من البداية لحد الهدف لوحده.</p>
      ${err ? html`<p class="form-err" role="alert">${err}</p>` : null}
      <div><button type="submit" class="btn primary">ضيف الكورس</button></div>
    </form>`;
  }

  function CourseView({now, store, update, remove}){
    const [sel, setSel] = useState(store.mainCourse);
    const [adding, setAdding] = useState(false);

    if (Array.isArray(v.workouts)) root.workouts = v.workouts.filter(w => w && str(w.id, 60) && num(w.startedAt) && num(w.endedAt) && Array.isArray(w.exercises)).map(w => {
      const o = {id: w.id, startedAt: w.startedAt, endedAt: Math.max(w.endedAt, w.startedAt), exercises: w.exercises.filter(e => e && typeof e.exId === 'string').map(e => ({exId: e.exId, name: typeof e.name === 'string' ? e.name : e.exId, sets: sets(e.sets)})).filter(e => e.sets.length)};
      if (typeof w.routineName === 'string') o.routineName = w.routineName;
      return o;
    }).filter(w => w.exercises.length);
    const c = v.current;
    if (c && typeof c === 'object' && str(c.id, 60) && num(c.startedAt) && Array.isArray(c.exercises)) {
      root.current = {id: c.id, startedAt: c.startedAt, rest: null,
        exercises: c.exercises.filter(e => e && typeof e.exId === 'string' && Array.isArray(e.sets)).map(e => ({exId: e.exId, sets: e.sets.filter(s => s && typeof s === 'object').map(s => ({w: num(s.w) || typeof s.w === 'string' ? s.w : '', r: num(s.r) || typeof s.r === 'string' ? s.r : '', done: s.done === true}))}))};
      if (typeof c.routineId === 'string') root.current.routineId = c.routineId;
      if (typeof c.routineName === 'string') root.current.routineName = c.routineName;
      const r = c.rest;
      if (r && num(r.startedAt) && num(r.seconds) && r.seconds > 0) {
        root.current.rest = {startedAt: r.startedAt, seconds: r.seconds, alerted: r.alerted === true};
        // which set the rest row sits under
        if (Number.isInteger(r.ei) && Number.isInteger(r.si) && r.ei >= 0 && r.si >= 0) { root.current.rest.ei = r.ei; root.current.rest.si = r.si; }
      }
    }
    const p = v.prefs;
    if (p && typeof p === 'object') {
      if (num(p.restSeconds)) root.prefs.restSeconds = Math.min(600, Math.max(10, Math.round(p.restSeconds)));
      if (typeof p.sound === 'boolean') root.prefs.sound = p.sound;
    }
    return {root, tooNew: false};
  }
  // end of workout rules

  // start of backup rules
  // One plain file the owner keeps: a marker, a format version, when it was made, a checksum, and the three parts.
  // Nothing here touches storage, the page or the network; the caller passes the app's own normalisers in, so a
  // backup is read with the same rules as the data it replaces. Marks are carried exactly as they are, never made.
  const BACKUP_FORMAT = 'mizan-backup';
  const BACKUP_VERSION = 1;
  const BACKUP_MAX_BYTES = 5 * 1024 * 1024;
  // FNV-1a, 32 bits, over the UTF-16 code units: catches a damaged or hand-edited file; not a security measure.
  function fnv1a(text){
    let h = 0x811c9dc5;
    for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return ('0000000' + h.toString(16)).slice(-8);
  }
  // dateIso is today's date in the app's time zone (the caller knows it); the name holds nothing else.
  function makeBackup(parts, now, dateIso){
    const data = {progress: parts.progress, workouts: parts.workouts, settings: parts.settings || null};
    const file = {format: BACKUP_FORMAT, version: BACKUP_VERSION, createdAt: new Date(now).toISOString(), checksum: fnv1a(JSON.stringify(data)), data};
    return {text: JSON.stringify(file), name: 'mizan-backup-' + dateIso + '.json'};
  }
  // Returns {ok: false, code} or {ok: true, parts, preview}; never throws. Codes: empty, not-json, settings-file,
  // not-backup, too-new, damaged.
  function readBackup(text, deps){
    try {
      if (typeof text !== 'string' || !text.trim()) return {ok: false, code: 'empty'};
      let f;
      // A half-downloaded or cut backup no longer parses but still carries the marker: that is damage, not a foreign file.
      try { f = JSON.parse(text); } catch(e){ return {ok: false, code: /"format"\s*:\s*"mizan-backup"/.test(text) ? 'damaged' : 'not-json'}; }
      const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
      if (!isObj(f)) return {ok: false, code: 'not-backup'};
      if (f.format === 'mizan-settings') return {ok: false, code: 'settings-file'};
      if (f.format !== BACKUP_FORMAT) return {ok: false, code: 'not-backup'};
      if (!Number.isInteger(f.version) || f.version < 1) return {ok: false, code: 'damaged'};
      if (f.version > BACKUP_VERSION) return {ok: false, code: 'too-new'};
      const d = f.data;
      if (typeof f.createdAt !== 'string' || Number.isNaN(Date.parse(f.createdAt))) return {ok: false, code: 'damaged'};
      if (!isObj(d) || !isObj(d.progress) || !isObj(d.workouts) || !(d.settings === null || isObj(d.settings))) return {ok: false, code: 'damaged'};
      if (typeof f.checksum !== 'string' || f.checksum !== fnv1a(JSON.stringify(d))) return {ok: false, code: 'damaged'};
      const w = deps.normalizeRoot(d.workouts);
      if (w.tooNew) return {ok: false, code: 'too-new'};
      const progress = deps.normalize(d.progress);
      let settings = null, settingsValid = 'none';
      if (d.settings !== null) {
        let r = null;
        try { r = deps.validateSettings(d.settings); } catch(e){ r = null; }
        if (r && r.ok) { settings = r.settings; settingsValid = 'valid'; } else settingsValid = 'invalid';
      }
      const workouts = w.root;
      const preview = {createdAt: f.createdAt, tasks: progress.tasks.length, appts: progress.appts.length, courses: progress.courses.length,
        tickDays: Object.keys(progress.checks).length, workouts: workouts.workouts.length, openWorkout: !!workouts.current, settings: settingsValid};
      return {ok: true, parts: {progress, workouts, settings, settingsValid}, preview};
    } catch(e){ return {ok: false, code: 'damaged'}; }
  }
  // end of backup rules

  /* ---------------- one form for adding and editing a task or an appointment ---------------- */
  // initial: task {text, tag, due} or appt {label, day, time}. onSubmit gets the validated, trimmed value.
  function ItemForm({kind, initial, idPrefix, textLabel, submitLabel, focusFirst, onSubmit, onCancel}){
    const isTask = kind === 'task';
    const [draft, setDraft] = useState(() => isTask
      ? {text: initial.text, tag: Object.prototype.hasOwnProperty.call(TASK_TAGS, initial.tag) ? initial.tag : '', due: initial.due || ''}
      : {label: initial.label, day: String(initial.day), time: initial.time || ''});
    const [err, setErr] = useState('');
    const first = useRef(null);
    useEffect(() => { if (focusFirst && first.current) first.current.focus(); }, []);
    const set = k => e => setDraft(d => Object.assign({}, d, {[k]: e.target.value}));
    const submit = e => {
      e.preventDefault();
      const r = isTask ? validateTaskFields(draft, TASK_TAGS) : validateApptFields(draft, WEEK_ORDER);
      if (!r.ok){ setErr(r.error); return; }
      setErr('');
      onSubmit(r.value);
    };
    const onKey = e => { if (e.key === 'Escape'){ e.preventDefault(); onCancel(); } };
    return html`<form class="form" onSubmit=${submit} onKeyDown=${onKey}>
      <div class="form-row">
        ${isTask ? html`
          <label class="field wide" for=${idPrefix + '-text'}>${textLabel}<input id=${idPrefix + '-text'} ref=${first} value=${draft.text} onInput=${set('text')} placeholder="مثلاً: حل شيت 3" maxlength="140" /></label>
          <label class="field" for=${idPrefix + '-tag'}>النوع<select id=${idPrefix + '-tag'} value=${draft.tag} onChange=${set('tag')}>
            ${draft.tag === '' ? html`<option value="">اختار النوع</option>` : null}
            ${Object.keys(TASK_TAGS).map(k => html`<option value=${k}>${TASK_TAGS[k]}</option>`)}</select></label>
          <label class="field" for=${idPrefix + '-due'}>آخر ميعاد (اختياري)<input id=${idPrefix + '-due'} type="date" value=${draft.due} onInput=${set('due')} /></label>`
        : html`
          <label class="field wide" for=${idPrefix + '-label'}>${textLabel}<input id=${idPrefix + '-label'} ref=${first} value=${draft.label} onInput=${set('label')} placeholder="مثلاً: ميتنج الفريق" maxlength="60" /></label>
          <label class="field" for=${idPrefix + '-day'}>اليوم<select id=${idPrefix + '-day'} value=${draft.day} onChange=${set('day')}>
            ${WEEK_ORDER.map(d => html`<option value=${String(d)}>${DAY_NAMES[d]}</option>`)}</select></label>
          <label class="field" for=${idPrefix + '-time'}>الساعة<input id=${idPrefix + '-time'} type="time" value=${draft.time} onInput=${set('time')} /></label>`}
      </div>
      ${err ? html`<p class="form-err" role="alert">${err}</p>` : null}
      <div class="form-row"><button type="submit" class="btn primary">${submitLabel}</button><button type="button" class="btn ghost" onClick=${onCancel}>إلغاء</button></div>
    </form>`;
  }

  /* ---------------- paste tasks from an AI ---------------- */
  // The pasted text is kept in memory only: it survives switching tabs in one session and is gone when the app closes.
  let PASTE_DRAFT = '';
  const PASTE_MAX_CHARS = 20000;
  const PASTE_REASONS = {
    'no-separator': () => 'مفيش | في السطر ده',
    'too-many-separators': () => 'فيه | أكتر من اللازم',
    'empty-text': () => 'نص المهمة فاضي',
    'too-long': x => 'النص أطول من 140 حرف (' + x.length + ')',
    'bad-date': () => 'التاريخ مش مظبوط'
  };
  function PasteTasks({now, store, update, actEdit, onClose}){
    const [text, setText] = useState(PASTE_DRAFT);
    const [result, setResult] = useState(null);
    const [sel, setSel] = useState({});
    const [picked, setPicked] = useState({});
    const [copied, setCopied] = useState('');
    const promptRef = useRef(null), pasteRef = useRef(null);
    const prompt = buildAiPrompt(TASK_TAGS, now.iso);
    useEffect(() => { if (pasteRef.current) pasteRef.current.focus(); }, []);
    const copy = async () => {
      try {
        if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('no clipboard');
        await navigator.clipboard.writeText(prompt);
        setCopied('ok');
      } catch(e){
        if (promptRef.current) { promptRef.current.focus(); promptRef.current.select(); }
        setCopied('manual');
      }
    };
    const onText = e => { PASTE_DRAFT = e.target.value; setText(e.target.value); setResult(null); };
    const check = () => {
      const r = parseTaskLines(text, TASK_TAGS, store.tasks.map(t => t.text));
      const s = {}; r.items.forEach(i => { s[i.n] = i.include; });
      setResult(r); setSel(s); setPicked({});
    };
    // A line with no valid type stays out until the user picks one; the app never chooses a type for them.
    const tagOf = i => i.tag || picked[i.n] || '';
    const pickType = (i, tag) => { setPicked(p => Object.assign({}, p, {[i.n]: tag})); setSel(p => Object.assign({}, p, {[i.n]: !!tag})); };
    const ready = result ? result.items.filter(i => sel[i.n] && tagOf(i)) : [];
    const confirm = () => {
      if (!ready.length) return;
      const made = ready.map(i => ({id: uid36(), text: i.text, tag: tagOf(i), due: i.due, done: false, created: now.iso}));
      // One undo for the whole batch: it removes only the tasks that are still exactly as added (undoBatch).
      const batch = made.map(t => ({id: t.id, text: t.text, tag: t.tag, due: t.due}));
      actEdit('اتضافت ' + made.length + ' مهمة',
        s => { made.forEach(t => s.tasks.push(t)); return s; },
        s => { s.tasks = undoBatch(s.tasks, batch); return s; });
      PASTE_DRAFT = '';
      onClose();
    };
    const onKey = e => { if (e.key === 'Escape'){ e.preventDefault(); onClose(); } };
    return html`<div class="paste" onKeyDown=${onKey}>
      <p class="small"><b>١. انسخ التعليمات وادّيها لأي AI</b> مع المهمة الكبيرة. هو اللي هيقسّمها بالشكل اللي التطبيق فاهمه.</p>
      <label class="field wide" for="paste-prompt">التعليمات<textarea id="paste-prompt" aria-label="التعليمات" dir="auto" readonly rows="9" ref=${promptRef} value=${prompt}></textarea></label>
      <div class="form-row"><button type="button" class="btn" onClick=${copy}>انسخ التعليمات</button></div>
      <p class="small muted" aria-live="polite">${copied === 'ok' ? 'اتنسخت. الصقها في الـ AI.' : copied === 'manual' ? 'المتصفح مش سامح بالنسخ. النص اتحدّد، انسخه بإيدك.' : ''}</p>
      <p class="small"><b>٢. الصق رد الـ AI هنا</b> وبعدين دوس "افحص".</p>
      <label class="field wide" for="paste-input">رد الـ AI<textarea id="paste-input" aria-label="رد الـ AI" dir="auto" rows="7" maxlength=${PASTE_MAX_CHARS} ref=${pasteRef} value=${text} onInput=${onText} placeholder=${'uni | Read chapter one | 2026-10-20\nwork | Review the draft'}></textarea></label>
      ${text.length >= PASTE_MAX_CHARS ? html`<p class="small">النص وصل للحد (${PASTE_MAX_CHARS} حرف)، والباقي ما اتقراش.</p>` : null}
      <div class="form-row"><button type="button" class="btn primary" disabled=${!text.trim()} onClick=${check}>افحص</button><button type="button" class="btn ghost" onClick=${onClose}>إلغاء</button></div>
      ${result ? html`<div class="paste-preview">
        <p class="small" role="status"><b>${result.items.length} مهمة في المعاينة، ${result.rejected.length} سطر مش مفهوم</b></p>
        ${result.leftOut ? html`<p class="small">${'سيبت ' + result.leftOut + ' سطر زيادة عن الحد (' + PASTE_MAX_LINES + ')'}</p>` : null}
        ${!result.items.length ? html`<div class="notice"><p><b>مفيش سطر اتفهم.</b><span class="small">التطبيق فاهم الصيغة دي بس، سطر لكل مهمة: <bdi>النوع | نص المهمة | آخر ميعاد</bdi></span></p></div>` : null}
        ${result.items.map(i => html`<div class="paste-row" key=${i.n}>
          <input type="checkbox" id=${'paste-i-' + i.n} checked=${!!sel[i.n]} disabled=${!tagOf(i)} onChange=${e => { const on = e.target.checked; setSel(p => Object.assign({}, p, {[i.n]: on})); }} />
          <span class="paste-main"><label for=${'paste-i-' + i.n} class="paste-text"><bdi>${i.text}</bdi></label>
            <span class="small muted">${tagOf(i) ? TASK_TAGS[tagOf(i)] : 'محتاج نوع'} · ${i.due ? dateLabel(i.due) : 'من غير ميعاد'}${i.dupe ? ' · ممكن يكون مكرر' : ''}</span>
            ${!i.tag ? html`<select class="paste-type" aria-label=${'اختار نوع: ' + i.text} value=${picked[i.n] || ''} onChange=${e => pickType(i, e.target.value)}><option value="">اختار النوع</option>${Object.keys(TASK_TAGS).map(k => html`<option value=${k}>${TASK_TAGS[k]}</option>`)}</select>` : null}
          </span>
        </div>`)}
        ${result.rejected.length ? html`<div class="paste-rejected"><p class="small"><b>سطور مش مفهومة (مش هتتضاف)</b></p>
          <ul>${result.rejected.map(x => html`<li key=${x.n}><span class="small muted">سطر ${x.n}: ${PASTE_REASONS[x.reason](x)}</span><bdi class="paste-raw">${x.raw.trim()}</bdi></li>`)}</ul></div>` : null}
        <div class="form-row"><button type="button" class="btn primary" disabled=${!ready.length} onClick=${confirm}>${'ضيف ' + ready.length + ' مهمة'}</button></div>
      </div>` : null}
    </div>`;
  }

  /* ---------------- Tasks & appointments ---------------- */
  function TasksView({now, store, update, goDay, remove, actEdit}){
    const [filter, setFilter] = useState('open');
    const [taskForm, setTaskForm] = useState(false);
    const [apptForm, setApptForm] = useState(false);
    const [pasteOpen, setPasteOpen] = useState(false);
    const openPaste = () => { setEditing(null); setTaskForm(false); setPasteOpen(true); };
    const closePaste = () => { setPasteOpen(false); setTimeout(() => { const b = document.getElementById('paste-open-btn'); if (b) b.focus(); }, 0); };
    // The one open edit form: null, or {kind: 'task' | 'appt', id}. Only one at a time; opening another drops the first unsaved.
    const [editing, setEditing] = useState(null);
    const lastEdited = useRef(null);
    useEffect(() => {
      if (editing !== null || !lastEdited.current) return;
      const el = document.getElementById('edit-btn-' + lastEdited.current);
      lastEdited.current = null;
      if (el) el.focus();
    }, [editing]);
    const openEdit = (kind, id) => { setTaskForm(false); setApptForm(false); setPasteOpen(false); lastEdited.current = null; setEditing({kind, id}); };
    const closeEdit = id => { lastEdited.current = id; setEditing(null); };
    const saveTask = (t, value) => {
      const before = {text: t.text, tag: t.tag, due: t.due || ''};
      actEdit('اتعدّلت المهمة',
        s => { s.tasks = applyEdit(s.tasks, t.id, value, TASK_EDIT_KEYS); return s; },
        s => { s.tasks = restoreFields(s.tasks, t.id, before, TASK_EDIT_KEYS); return s; });
      closeEdit(t.id);
    };

    // value comes validated and trimmed from ItemForm (name up to 60 characters, a day number, a time).
    const addAppt = value => {
      update(s => { s.appts.push({id: uid36(), label: value.label, day: value.day, time: value.time}); return s; });
      setApptForm(false);
    };
    const saveAppt = (a, value) => {
      const before = {label: a.label, day: a.day, time: a.time};
      actEdit('اتعدّل الميعاد',
        s => { s.appts = applyEdit(s.appts, a.id, value, APPT_EDIT_KEYS); return s; },
        s => { s.appts = restoreFields(s.appts, a.id, before, APPT_EDIT_KEYS); return s; });
      closeEdit(a.id);
    };
    // value comes validated and trimmed from ItemForm (text up to 140 characters, a known type, an optional date).
    const addTask = value => {
      update(s => { s.tasks.push({id: uid36(), text: value.text, tag: value.tag, due: value.due, done: false, created: now.iso}); return s; });
      setTaskForm(false);
    };
    const appts = store.appts.slice().sort((a, b) => WEEK_ORDER.indexOf(Number(a.day)) - WEEK_ORDER.indexOf(Number(b.day)) || a.time.localeCompare(b.time));
    const open = store.tasks.filter(t => !t.done).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
    const doneTasks = store.tasks.filter(t => t.done).slice(-20).reverse();
    const shown = filter === 'open' ? open : doneTasks;

    return html`<div class="tasksv">
      <div class="top a-head"><div class="top-meta"><h1>المهام</h1><p class="sub">مهام ليها ميعاد، ومواعيد ثابتة كل أسبوع</p></div></div>

      <div class="sec a-tasks">
        <div class="sec-head"><h2>المهام</h2>
          <div class="filters">
            <button type="button" class="btn small" aria-pressed=${filter === 'open' ? 'true' : 'false'} onClick=${() => { setEditing(null); setFilter('open'); }}>مفتوحة (${open.length})</button>
            <button type="button" class="btn small" aria-pressed=${filter === 'done' ? 'true' : 'false'} onClick=${() => { setEditing(null); setFilter('done'); }}>خلصت</button>
          </div>
        </div>
        <div class="panel">
          ${taskForm ? html`<div style="margin-bottom:10px"><${ItemForm} kind="task" initial=${{text: '', tag: 'uni', due: ''}} idPrefix="task" textLabel="مهمة جديدة" submitLabel="ضيف المهمة" focusFirst=${false} onSubmit=${addTask} onCancel=${() => setTaskForm(false)} /></div>` : pasteOpen ? html`<${PasteTasks} now=${now} store=${store} update=${update} actEdit=${actEdit} onClose=${closePaste} />` : html`<button type="button" class="btn add-task" onClick=${() => { setEditing(null); setTaskForm(true); }}><${Plus} />مهمة جديدة</button><button type="button" id="paste-open-btn" class="btn add-task paste-open" onClick=${openPaste}>الصق مهام من AI</button>`}
          <div class="tlist" style="margin-top:6px">
            ${shown.length ? shown.map(t => editing && editing.kind === 'task' && editing.id === t.id
              ? html`<div class="titem-edit" key=${t.id}><${ItemForm} kind="task" initial=${{text: t.text, tag: t.tag, due: t.due || ''}} idPrefix="edit-task" textLabel="نص المهمة" submitLabel="احفظ التعديل" focusFirst=${true} onSubmit=${v => saveTask(t, v)} onCancel=${() => closeEdit(t.id)} /></div>`
              : html`<div class=${'titem c-' + t.tag + (t.done ? ' done' : '')} key=${t.id}>
              <${Check} on=${!!t.done} cat=${t.tag} label=${(t.done ? 'رجّع: ' : 'خلّص: ') + t.text} onToggle=${() => update(s => { const x = s.tasks.find(y => y.id === t.id); if (x) x.done = !x.done; return s; })} />
              <div style="min-width:0"><p class="ttext">${t.text}</p>
                <p class="small"><span class="ttag">${TASK_TAGS[t.tag]}</span>${t.due ? html` · <span class=${'tdue' + (!t.done && t.due < now.iso ? ' late' : '')}>${dateLabel(t.due)}</span>` : null}</p></div>
              <div class="tact">
                <button type="button" class="edit" id=${'edit-btn-' + t.id} aria-label=${'عدّل ' + t.text} title="عدّل" onClick=${() => openEdit('task', t.id)}><${Pencil} /></button>
                <button type="button" class="del" aria-label=${'امسح ' + t.text} onClick=${() => remove('اتمسحت المهمة', s => { s.tasks = s.tasks.filter(x => x.id !== t.id); return s; })}>امسح</button>
              </div>
            </div>`) : html`<p class="empty">${filter === 'open' ? 'مفيش مهام مفتوحة. ضيف مثلاً شيت مطلوب أو ميعاد تسليم.' : 'لسه مخلّصتش مهام.'}</p>`}
          </div>
        </div>
      </div>
      <div class="sec a-appts">
        <div class="sec-head"><h2>مواعيد كل أسبوع</h2>${!apptForm ? html`<button type="button" class="btn small" onClick=${() => { setEditing(null); setApptForm(true); }}><${Plus} />ميعاد</button>` : null}</div>
        <div class="panel">
          ${appts.length ? html`<div>${appts.map(a => editing && editing.kind === 'appt' && editing.id === a.id
            ? html`<div class="appt-edit" key=${a.id}><${ItemForm} kind="appt" initial=${{label: a.label, day: a.day, time: a.time}} idPrefix="edit-appt" textLabel="الميعاد" submitLabel="احفظ التعديل" focusFirst=${true} onSubmit=${v => saveAppt(a, v)} onCancel=${() => closeEdit(a.id)} /></div>`
            : html`<div class="appt" key=${a.id}>
              <div><p>${a.label}</p><p class="when">${DAY_NAMES[a.day]} · ${fmtStr(toMin(a.time))}</p></div>
              <div class="aact">
                <button type="button" class="btn ghost small" onClick=${() => goDay(addDays(weekStart(now.iso), WEEK_ORDER.indexOf(Number(a.day))))}>افتح اليوم</button>
                <button type="button" class="edit" id=${'edit-btn-' + a.id} aria-label=${'عدّل ' + a.label} title="عدّل" onClick=${() => openEdit('appt', a.id)}><${Pencil} /></button>
                <button type="button" class="del" aria-label=${'امسح ' + a.label} onClick=${() => remove('اتمسح ميعاد "' + a.label + '"', s => { s.appts = s.appts.filter(x => x.id !== a.id); return s; })}>امسح</button>
              </div>
            </div>`)}</div>`
            : html`<p class="empty">المواعيد الأساسية متحطة في الجدول خلاص. أي ميعاد ثابت تاني، زي ميتنج شغل أسبوعي، ضيفه من "+ ميعاد" وهيظهر جوه يومه.</p>`}
          ${apptForm ? html`<div style="margin-top:12px"><${ItemForm} kind="appt" initial=${{label: '', day: 5, time: ''}} idPrefix="appt" textLabel="الميعاد" submitLabel="ضيف الميعاد" focusFirst=${false} onSubmit=${addAppt} onCancel=${() => setApptForm(false)} /></div>` : null}
        </div>
      </div>

    </div>`;
  }

  /* ---------------- Settings (import, status, reset) ---------------- */
  const MAX_SETTINGS_BYTES = 1024 * 1024;
  // Same order as tools/check-settings.js: size, empty, JSON, then the format rules.
  function checkSettingsText(text){
    if (text.length > MAX_SETTINGS_BYTES) return {ok:false, errors:[{code:'too-large', path:'file', detail:'file over 1 MB'}], warnings:[], settings:null};
    if (!text.trim()) return {ok:false, errors:[{code:'not-settings', path:'file', detail:'the file is empty'}], warnings:[], settings:null};
    let obj;
    try { obj = JSON.parse(text); } catch(e){ return {ok:false, errors:[{code:'not-settings', path:'file', detail:'not valid JSON'}], warnings:[], settings:null}; }
    return validateSettings(obj);
  }
  // Plain-language messages for the importer; only the first few problems are shown.
  function settingsMessages(res){
    const e = res.errors, has = c => e.some(x => x.code === c);
    if (has('too-large')) return ['الملف كبير أوي (أكتر من 1 ميجا).'];
    if (has('not-settings')) return ['ده مش ملف إعدادات للتطبيق (فاضي، أو مش JSON، أو الصيغة غلط).'];
    if (has('too-new')) return ['الملف ده معمول لنسخة أحدث من التطبيق.'];
    return e.slice(0, 5).map(x => x.path + ': ' + x.detail).concat(e.length > 5 ? ['وفيه ' + (e.length - 5) + ' مشاكل تانية.'] : []);
  }
  function summaryOf(s){
    const days = Object.keys(s.week), blocks = days.reduce((n, k) => { const b = s.week[k].blocks; return n + (Array.isArray(b) ? b.length : Object.keys(b).reduce((m, v) => m + b[v].length, 0)); }, 0);
    const lists = days.reduce((a, k) => { const b = s.week[k].blocks; return a.concat(Array.isArray(b) ? [b] : Object.keys(b).map(v => b[v])); }, []);
    const anchored = lists.reduce((n, l) => n + l.filter(b => b.length === 6).length, 0);
    return {days: days.length, blocks, anchored, course: s.course ? s.course.name : '', language: s.language, place: s.location.label || ''};
  }
  /* backup: saving a file to the owner's own device (the rules are in the "backup rules" block) */
  const BACKUP_META_KEY = 'mizan-backup-meta-v1';
  function readBackupMeta(){
    try { const m = JSON.parse(localStorage.getItem(BACKUP_META_KEY) || 'null'); return m && typeof m.lastBackupAt === 'string' && !Number.isNaN(Date.parse(m.lastBackupAt)) ? m.lastBackupAt : null; } catch(e){ return null; }
  }
  // What goes in a backup: the progress as the app holds it, the workout log (as stored, if a newer app wrote it, so
  // it is never lost), and the imported settings only when they exist and are valid; the example is never saved.
  function backupParts(store, wk){
    let settings = null;
    if (!LOADED.isExample) {
      try { const r = validateSettings(JSON.parse(localStorage.getItem(SETTINGS_KEY))); if (r.ok) settings = r.settings; } catch(e){}
    }
    let workouts = wk.data;
    if (wk.tooNew) { try { workouts = JSON.parse(localStorage.getItem(WORKOUTS_KEY)); } catch(e){} }
    return {progress: store, workouts, settings};
  }
  const RESTORE_SYNC_LATE_KEY = 'mizan-restore-sync-late';
  const BACKUP_REFUSALS = {
    'too-large': 'الملف كبير أوي على إنه نسخة احتياطية.',
    'empty': 'ده مش ملف نسخة احتياطية من ميزان يومي.',
    'not-json': 'ده مش ملف نسخة احتياطية من ميزان يومي.',
    'not-backup': 'ده مش ملف نسخة احتياطية من ميزان يومي.',
    'settings-file': 'ده ملف إعدادات. استورده من «استيراد ملف إعدادات».',
    'too-new': 'النسخة دي معمولة بنسخة أحدث من التطبيق. حدّث التطبيق الأول.',
    'damaged': 'الملف ده بايظ أو اتعدّل، فمش هسترجع منه حاجة.'
  };
  // Restore: read and check the file, show what it holds, and only on «استرجع» replace the device's data with it,
  // all or nothing. The progress goes in exactly as the file has it; no mark is made here.
  function RestorePart({wk, sync, replaceAll, when}){
    const [pending, setPending] = useState(null);   // the result of readBackup when it is ok
    const [err, setErr] = useState('');
    const [busy, setBusy] = useState(false);
    const inputRef = useRef(null), noRef = useRef(null), errRef = useRef(null);
    useEffect(() => { if (err && errRef.current) { try { errRef.current.focus(); } catch(e){} } }, [err]);
    const cancel = () => { setPending(null); if (inputRef.current) { inputRef.current.value = ''; try { inputRef.current.focus(); } catch(e){} } };
    useEffect(() => {
      if (!pending) return;
      if (noRef.current) noRef.current.focus();
      const key = e => { if (e.key === 'Escape' && !busy) cancel(); };
      document.addEventListener('keydown', key);
      return () => document.removeEventListener('keydown', key);
    }, [pending, busy]);
    const refuse = code => { setPending(null); setErr(BACKUP_REFUSALS[code] || BACKUP_REFUSALS['not-backup']); if (inputRef.current) inputRef.current.value = ''; };
    const onFile = e => {
      const f = e.target.files && e.target.files[0];
      setPending(null); setErr('');
      if (!f) return;
      if (f.size > BACKUP_MAX_BYTES) { refuse('too-large'); return; }
      const r = new FileReader();
      r.onload = () => {
        const res = readBackup(String(r.result || ''), {normalize, normalizeRoot, validateSettings});
        if (res.ok) setPending(res); else refuse(res.code);
      };
      r.onerror = () => refuse('not-backup');
      r.readAsText(f);
    };
    const apply = async () => {
      if (!pending || busy) return;
      if (wk.tooNew) { setPending(null); setErr('بيانات التمارين على الجهاز ده من نسخة أحدث من التطبيق، فمش هقدر أستبدلها.'); return; }
      const p = pending.parts, keys = [LOCAL_KEY, WORKOUTS_KEY, SETTINGS_KEY], raw = {};
      try { keys.forEach(k => { raw[k] = localStorage.getItem(k); }); }
      catch(e){ setPending(null); setErr('الاسترجاع فشل ومفيش حاجة اتغيّرت.'); return; }
      setBusy(true);
      try {
        localStorage.setItem(LOCAL_KEY, JSON.stringify(p.progress));
        localStorage.setItem(WORKOUTS_KEY, JSON.stringify(p.workouts));
        if (p.settingsValid === 'valid') localStorage.setItem(SETTINGS_KEY, JSON.stringify(p.settings));
      } catch(e){
        // put every key back as it was, so a half-written restore never stays
        keys.forEach(k => { try { if (raw[k] === null) localStorage.removeItem(k); else localStorage.setItem(k, raw[k]); } catch(e2){} });
        setBusy(false); setPending(null); setErr('الاسترجاع فشل ومفيش حاجة اتغيّرت.');
        return;
      }
      // The synced copy loads first on start, so it gets the restored progress before the reload (up to 5 seconds).
      const synced = await Promise.race([replaceAll(p.progress), new Promise(res => setTimeout(() => res(false), 5000))]);
      if (!synced) { try { sessionStorage.setItem(RESTORE_SYNC_LATE_KEY, '1'); } catch(e){} }
      location.reload();
    };
    const pv = pending && pending.preview;
    return html`<div class="restore">
      <label class="field wide" for="backup-file">اختار ملف النسخة الاحتياطية<input id="backup-file" ref=${inputRef} type="file" accept=".json,application/json" disabled=${busy} onChange=${onFile} /></label>
      <div aria-live="polite">
        ${err ? html`<div class="notice" role="alert" tabindex="-1" ref=${errRef}><p>${err}</p></div>` : null}
        ${pv ? html`<div class="notice restore-preview" role="group" aria-label="معاينة النسخة الاحتياطية"><p>
            <b>نسخة من <bdi>${when(pv.createdAt)}</bdi></b>
            <span class="small"><bdi>${pv.tasks}</bdi> مهمة · <bdi>${pv.appts}</bdi> ميعاد · <bdi>${pv.courses}</bdi> كورس · <bdi>${pv.tickDays}</bdi> يوم فيه علامات · <bdi>${pv.workouts}</bdi> تمرينة</span>
            ${pv.openWorkout ? html`<span class="small">فيه تمرينة مفتوحة</span>` : null}
            <span class="small">${pv.settings === 'valid' ? 'فيها إعدادات' : pv.settings === 'none' ? 'مفيهاش إعدادات، إعداداتك الحالية هتفضل' : 'الإعدادات اللي فيها مش صالحة، إعداداتك الحالية هتفضل'}</span>
            <span class="small"><b>الاسترجاع هيستبدل كل بياناتك على الجهاز ده بالنسخة دي.</b>${sync === 'cloud' ? ' وهيتغيّر كمان في النسخة المتزامنة' : ''}</span>
            ${busy ? html`<span class="small" role="status">بسترجع…</span>` : null}
          </p>
          <span class="backup-act"><button type="button" class="btn danger" disabled=${busy} onClick=${apply}>استرجع</button><button type="button" class="btn" ref=${noRef} disabled=${busy} onClick=${cancel}>لأ</button></span>
        </div>` : null}
      </div>
    </div>`;
  }

  function BackupSection({store, wk, sync, replaceAll}){
    const [last, setLast] = useState(readBackupMeta);
    const [msg, setMsg] = useState(null);   // {ok, text}
    const build = () => {
      const now = Date.now(), b = makeBackup(backupParts(store, wk), now, cairoParts(new Date(now)).iso);
      return {b, now, file: new File([b.text], b.name, {type: 'application/json'})};
    };
    const remember = now => {
      const at = new Date(now).toISOString();
      try { localStorage.setItem(BACKUP_META_KEY, JSON.stringify({lastBackupAt: at})); } catch(e){}
      setLast(at);
    };
    const failed = () => setMsg({ok: false, text: 'مقدرتش أحفظ الملف. افتح التطبيق في المتصفح العادي وجرّب تاني'});
    const save = () => {
      try {
        const {b, now, file} = build();
        const url = URL.createObjectURL(file), a = document.createElement('a');
        a.href = url; a.download = b.name; a.style.display = 'none';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        remember(now);
        setMsg({ok: true, name: b.name});
      } catch(e){ failed(); }
    };
    // The system share sheet, only where the device can share files, and only on this tap.
    let canShare = false;
    try { canShare = !!(navigator.canShare && navigator.canShare({files: [new File(['{}'], 'x.json', {type: 'application/json'})]})); } catch(e){}
    const share = async () => {
      let built;
      try { built = build(); } catch(e){ failed(); return; }
      try { await navigator.share({files: [built.file]}); remember(built.now); setMsg({ok: true, name: built.b.name}); }
      catch(e){ if (!e || e.name !== 'AbortError') failed(); }
    };
    const when = iso => { const p = cairoParts(new Date(iso)); return dateLabel(p.iso) + ' · ' + fmtStr(p.min); };
    return html`<div class="sec">
      <div class="sec-head"><h2>نسخة احتياطية</h2></div>
      <div class="panel form">
        <p class="small">${last ? html`آخر نسخة: <bdi>${when(last)}</bdi>` : 'لسه ما عملتش نسخة احتياطية على الجهاز ده'}</p>
        <span class="backup-act"><button type="button" class="btn primary" onClick=${save}>احفظ نسخة احتياطية</button>${canShare ? html`<button type="button" class="btn" onClick=${share}>ابعتها لمكان تاني</button>` : null}</span>
        <p class="small muted">الملف فيه بياناتك الشخصية. خليه في مكان آمن ومتبعتهوش لحد.</p>
        <div aria-live="polite">${msg ? (msg.ok ? html`<p class="small">اتحفظت النسخة: <bdi dir="ltr">${msg.name}</bdi></p>` : html`<div class="notice" role="alert"><p>${msg.text}</p></div>`) : null}</div>
        <${RestorePart} wk=${wk} sync=${sync} replaceAll=${replaceAll} when=${when} />
      </div>
    </div>`;
  }

  function SettingsView({store, wk, sync, replaceAll}){
    const [pending, setPending] = useState(null);
    const [msgs, setMsgs] = useState([]);
    const [done, setDone] = useState('');
    const [askReset, setAskReset] = useState(false);
    const msgRef = useRef(null);
    useEffect(() => { if (msgs.length && msgRef.current) { try { msgRef.current.focus(); } catch(e){} } }, [msgs]);
    const onFile = e => {
      const f = e.target.files && e.target.files[0];
      setPending(null); setMsgs([]); setDone('');
      if (!f) return;
      if (f.size > MAX_SETTINGS_BYTES) { setMsgs(['الملف كبير أوي (أكتر من 1 ميجا).']); return; }
      const r = new FileReader();
      r.onload = () => {
        const res = checkSettingsText(String(r.result || ''));
        if (!res.ok) { setMsgs(settingsMessages(res)); return; }
        setPending({settings: res.settings, warnings: res.warnings.length});
      };
      r.onerror = () => setMsgs(['مقدرتش أقرا الملف.']);
      r.readAsText(f);
    };
    const apply = () => {
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(pending.settings)); }
      catch(err){ setMsgs(['المتصفح ده مش بيسمح بالحفظ، فالإعدادات مش هتتخزن.']); return; }
      location.reload();
    };
    const reset = () => {
      try { localStorage.removeItem(SETTINGS_KEY); } catch(err){}
      location.reload();
    };
    const sm = pending ? summaryOf(pending.settings) : null;
    return html`<div class="settingsv">
      <div class="top a-head"><div class="top-meta"><h1>الإعدادات</h1><p class="sub">جدولك ومواقيت الصلاة واللغة، بتتخزن على الجهاز ده بس</p></div></div>
      <div class="sec">
        <div class="sec-head"><h2>المستخدم دلوقتي</h2></div>
        <div class="panel">
          <p><b>${LOADED.isExample ? 'جدول مثال عام' : (CFG.name || 'إعداداتي')}</b></p>
          <p class="small muted">${LOADED.isExample ? 'مفيش ملف إعدادات متخزن. استورد ملفك عشان التطبيق يبقى بتاعك.' : 'الإعدادات دي متخزنة على الجهاز ده وبتشتغل من غير نت.'}${LOADED.problem ? ' (الإعدادات المتخزنة مكنتش صالحة فبنعرض المثال.)' : ''}</p>
          <p class="small muted">الموقع: <bdi>${CFG.location.label || '—'}</bdi> · الطريقة: <bdi>${CFG.prayerMethod}</bdi> · اللغة: <bdi>${CFG.language}</bdi></p>
        </div>
      </div>
      <div class="sec">
        <div class="sec-head"><h2>استيراد ملف إعدادات</h2></div>
        <div class="panel form">
          <label class="field wide" for="settings-file">اختار ملف الإعدادات (JSON)<input id="settings-file" type="file" accept=".json,application/json" onChange=${onFile} /></label>
          <p class="small muted">الملف بيتقرا على جهازك بس ومبيتبعتش لأي مكان. التقدم والعلامات والمهام مش بتتأثر.</p>
          <div aria-live="polite">
            ${msgs.length ? html`<div class="notice" role="alert" tabindex="-1" ref=${msgRef}><p><b>مقدرتش أستورد الملف</b>${msgs.map(m => html`<span class="small"><bdi>${m}</bdi></span>`)}</p></div>` : null}
            ${sm ? html`<div class="notice"><p><b>جاهز للاستيراد: ${pending.settings.name || 'من غير اسم'}</b>
              <span class="small">${sm.days} أيام · ${sm.blocks} بلوك${sm.anchored ? ' · ' + sm.anchored + ' بلوك مربوط بالصلاة' : ''}${sm.course ? ' · كورس: ' : ''}${sm.course ? html`<bdi>${sm.course}</bdi>` : null} · الموقع: <bdi>${sm.place || '—'}</bdi> · اللغة: <bdi>${sm.language}</bdi>${pending.warnings ? ' · فيه ' + pending.warnings + ' حقول مش معروفة هتتجاهل' : ''}</span>
              <span class="small muted">${LOADED.isExample ? 'هيحل محل المثال.' : 'هيحل محل الإعدادات الحالية (' + (CFG.name || 'من غير اسم') + ').'}</span></p>
              <span><button type="button" class="btn primary" onClick=${apply}>استبدل</button> <button type="button" class="btn ghost" onClick=${() => setPending(null)}>إلغاء</button></span></div>` : null}
          </div>
        </div>
      </div>
      <${BackupSection} store=${store} wk=${wk} sync=${sync} replaceAll=${replaceAll} />
      ${LOADED.isExample ? null : html`<div class="sec">
        <div class="sec-head"><h2>رجوع للمثال</h2></div>
        <div class="panel">
          <p class="small muted">بيمسح الإعدادات المتخزنة بس. علاماتك ومهامك وتقدمك بيفضلوا زي ما هم.</p>
          ${askReset ? html`<div class="notice"><p><b>تأكيد: ترجع للجدول المثال؟</b></p><span><button type="button" class="btn danger" onClick=${reset}>أيوه، ارجع للمثال</button> <button type="button" class="btn ghost" onClick=${() => setAskReset(false)}>لأ</button></span></div>`
            : html`<button type="button" class="btn" onClick=${() => setAskReset(true)}>رجّع المثال</button>`}
        </div>
      </div>`}
    </div>`;
  }

  /* ---------------- Workouts (own storage key and hook; knows nothing of the progress store) ---------------- */
  function loadWorkouts(){ try { return normalizeRoot(localStorage.getItem(WORKOUTS_KEY)); } catch(e){ return {root: EMPTY_WORKOUTS(), tooNew: false}; } }
  function useWorkouts(){
    const first = useRef(null);
    if (!first.current) first.current = loadWorkouts();
    const [data, setData] = useState(first.current.root);
    const [saveFailed, setSaveFailed] = useState(false);
    const latest = useRef(data);
    const tooNew = first.current.tooNew;
    // Data written by a newer app is never overwritten.
    const update = fn => {
      if (tooNew) return;
      const next = normalizeRoot(fn(JSON.parse(JSON.stringify(latest.current)))).root;
      latest.current = next; setData(next);
      try { localStorage.setItem(WORKOUTS_KEY, JSON.stringify(next)); setSaveFailed(false); } catch(e){ setSaveFailed(true); }
    };
    return {data, update, tooNew, saveFailed};
  }
  const Dots = () => html`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>`;
  const BLANK_SET = () => ({w: '', r: '', done: false});

  // Alerts are feature-detected and need no permission. The audio context is made on the tap that marks a set done.
  let AUDIO = null;
  function primeAudio(){ try { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; if (!AUDIO) AUDIO = new C(); if (AUDIO.state === 'suspended') AUDIO.resume(); } catch(e){} }
  function beep(){ try { if (!AUDIO) return; const o = AUDIO.createOscillator(), g = AUDIO.createGain(); o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(AUDIO.destination); o.start(); o.stop(AUDIO.currentTime + 0.25); } catch(e){} }
  function alertRestOver(sound){ try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch(e){} if (sound) beep(); }
  // One-second tick for the small parts that show a clock; refreshed when the page becomes visible again.
  function useNow(){
    const [n, setN] = useState(Date.now());
    useEffect(() => {
      const t = setInterval(() => setN(Date.now()), 1000), v = () => setN(Date.now());
      document.addEventListener('visibilitychange', v);
      return () => { clearInterval(t); document.removeEventListener('visibilitychange', v); };
    }, []);
    return n;
  }
  // Keeps the screen on while a workout is open, where the browser allows it; any failure is ignored.
  function WakeLock(){
    useEffect(() => {
      let lock = null, dead = false;
      const get = async () => {
        try {
          if (!navigator.wakeLock || document.visibilityState !== 'visible' || lock) return;
          const l = await navigator.wakeLock.request('screen');
          if (dead) { l.release().catch(() => {}); return; }
          lock = l; l.addEventListener('release', () => { if (lock === l) lock = null; });
        } catch(e){}
      };
      const vis = () => { if (document.visibilityState === 'visible') get(); };
      get(); document.addEventListener('visibilitychange', vis);
      return () => { dead = true; document.removeEventListener('visibilitychange', vis); try { if (lock) lock.release().catch(() => {}); } catch(e){} lock = null; };
    }, []);
    return null;
  }
  // The workout timer and the remaining rest, and the one-time alert when a rest ends.
  function WorkoutClock({cur, onOver}){
    useNow();
    const now = Date.now(), left = restLeft(cur.rest, now);
    useEffect(() => { if (cur.rest && !cur.rest.alerted && left <= 0) onOver(document.visibilityState === 'visible' && -left <= 10000); });
    return html`<p class="wk-meta"><bdi dir="ltr" class="num">${formatClock(elapsedMs(cur.startedAt, now))}</bdi>${left === null ? null : html` · راحة <bdi dir="ltr" class="num">${restLabel(left)}</bdi>`}</p>`;
  }
  function RestRow({rest, onAdd, onSkip}){
    useNow();
    const left = restLeft(rest, Date.now()), over = left <= 0;
    return html`<div class=${'wk-rest' + (over ? ' over' : '')} role="group" aria-label="مؤقّت الراحة">
      <span>${over ? 'خلصت الراحة ' : 'راحة '}<bdi dir="ltr" class="num">${restLabel(left)}</bdi></span>
      <span class="wk-rest-act"><button type="button" class="btn" onClick=${onAdd}>+15 ث</button><button type="button" class="btn ghost" onClick=${onSkip}>تخطّي</button></span>
    </div>`;
  }
  const Stopwatch = () => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7"/><path d="M12 13.5V10M9.5 3.5h5"/></svg>`;

  // A confirmation that stays in view at the bottom; focus starts on the safe choice and goes back to the
  // control that opened it when it closes.
  function Sheet({label, onClose, children}){
    const ref = useRef(null);
    useEffect(() => {
      const opener = document.activeElement;
      const b = ref.current && ref.current.querySelector('[data-first]'); if (b) b.focus();
      const key = e => { if (e.key === 'Escape') onClose(); };
      document.addEventListener('keydown', key);
      return () => {
        document.removeEventListener('keydown', key);
        // after the closing render, if focus was lost with the sheet
        setTimeout(() => { try { if (opener && opener.isConnected && (!document.activeElement || document.activeElement === document.body)) opener.focus(); } catch(e){} }, 0);
      };
    }, []);
    return html`<div class="wk-sheet" role="dialog" aria-label=${label} ref=${ref}>${children}</div>`;
  }

  function ExercisePicker({all, onPick, onCreate, onBack}){
    const [q, setQ] = useState('');
    const [err, setErr] = useState('');
    const nq = normName(q);
    const shown = nq ? all.filter(x => normName(x.name).indexOf(nq) >= 0) : all;
    return html`<div class="wkv">
      <div class="wk-head">
        <button type="button" class="btn" onClick=${onBack}>رجوع</button>
        <h1 class="wk-title">ضيف تمرين</h1>
      </div>
      <label class="field"><span>دوّر أو اكتب اسم تمرين جديد</span>
        <input id="wk-search" type="text" value=${q} autocomplete="off" onInput=${e => { setQ(e.target.value); setErr(''); }} />
      </label>
      ${q.trim() ? html`<div><button type="button" class="btn primary" onClick=${() => setErr(onCreate(q) || '')}><${Plus} />ضيف تمرين جديد: <bdi>${q.trim()}</bdi></button>${err ? html`<p class="form-err" role="alert">${err}</p>` : null}</div>` : null}
      <div class="panel wk-picklist">
        ${shown.length ? shown.map(x => html`<button type="button" class="wk-pick" key=${x.id} onClick=${() => onPick(x.id)}><bdi>${x.name}</bdi></button>`) : html`<p class="empty">مفيش تمرين بالاسم ده. تقدر تضيفه من الزرار اللي فوق.</p>`}
      </div>
    </div>`;
  }

  /* history, workout detail and exercise page: read-only views over the finished workouts */
  const monthFmt = new Intl.DateTimeFormat('ar-EG-u-nu-latn', {month: 'long', year: 'numeric', timeZone: 'UTC'});
  const wkWhen = w => { const c = cairoParts(new Date(w.startedAt)); return DAY_NAMES[weekday(c.iso)] + '، ' + dateLabel(c.iso) + ' · ' + fmtStr(c.min); };
  const wkDay = ts => dateLabel(cairoParts(new Date(ts)).iso);
  const wkTitle = w => w.routineName || 'تمرينة';
  const allSets = w => w.exercises.reduce((a, e) => a.concat(e.sets), []);
  const recWords = f => f.weight && f.reps ? 'وزن وتكرارات' : f.weight ? 'وزن' : 'تكرارات';
  const Kg = ({s}) => html`<bdi dir="ltr" class="num">${s.w} × ${s.r}</bdi>`;
  const byNewest = list => list.slice().sort((a, b) => b.startedAt - a.startedAt);

  function WkSwitch({cur, go}){
    return html`<div class="filters wk-switch" role="group" aria-label="أقسام التمارين">
      <button type="button" class="btn" aria-pressed=${cur === 'home' ? 'true' : 'false'} onClick=${() => go({n: 'home'})}>تمرين</button>
      <button type="button" class="btn" aria-pressed=${cur === 'history' ? 'true' : 'false'} onClick=${() => go({n: 'history'})}>السجل</button>
      <button type="button" class="btn" aria-pressed=${cur === 'exercises' ? 'true' : 'false'} onClick=${() => go({n: 'exercises'})}>التمارين</button>
    </div>`;
  }

  function HistoryScreen({workouts, rec, onOpen}){
    const groups = useMemo(() => {
      const g = [];
      byNewest(workouts).forEach(w => {
        const key = cairoParts(new Date(w.startedAt)).iso.slice(0, 7);
        let x = g[g.length - 1];
        if (!x || x.key !== key) { x = {key, items: []}; g.push(x); }
        x.items.push(w);
      });
      return g;
    }, [workouts]);
    if (!groups.length) return html`<p class="empty">لسه مفيش تمرينات محفوظة. خلّص تمرينة وهتظهر هنا.</p>`;
    return html`<div class="wk-hist">${groups.map(g => { const [y, m] = g.key.split('-').map(Number); return html`<section class="sec" key=${g.key}>
      <div class="sec-head"><h2>${monthFmt.format(new Date(Date.UTC(y, m - 1, 1)))}</h2><span class="small muted"><bdi>${g.items.length}</bdi> تمرينة</span></div>
      ${g.items.map(w => { const rc = recordCount(w, rec.flags); return html`<button type="button" class="panel wk-card" key=${w.id} onClick=${() => onOpen(w.id)}>
        <span class="wk-card-head"><b>${wkTitle(w)}</b><span class="small muted">${wkWhen(w)}</span></span>
        <span class="wk-card-row small muted"><span>أفضل مجموعة</span><span>المجموعات</span></span>
        ${w.exercises.map((e, i) => html`<span class="wk-card-row" key=${i}><${Kg} s=${bestSet(e.sets)} /><span><bdi>${e.sets.length}</bdi> × <bdi>${e.name}</bdi></span></span>`)}
        <span class="wk-card-foot small">${rc ? html`<span><bdi>${rc}</bdi> رقم قياسي</span>` : null}<span><bdi class="num">${Math.round(volumeOf(allSets(w)))}</bdi> كجم</span><bdi dir="ltr" class="num">${formatClock(w.endedAt - w.startedAt)}</bdi></span>
      </button>`; })}
    </section>`; })}</div>`;
  }

  // A finished workout. One set at a time can be corrected; the workout can be deleted with the app's undo.
  function WorkoutDetail({w, rec, onExercise, onBack, onCorrect, onDelete}){
    const rc = recordCount(w, rec.flags);
    const [ed, setEd] = useState(null);   // {ei, si, w, r, err}
    const editKey = ed && ed.ei + ':' + ed.si;
    const lastKey = useRef(null);
    useEffect(() => {
      // closing the editor puts focus back on that set's «عدّل»
      if (!ed) { const b = lastKey.current && document.querySelector('[data-fix="' + lastKey.current + '"]'); if (b) b.focus(); lastKey.current = null; return; }
      lastKey.current = editKey;
      const key = e => { if (e.key === 'Escape') setEd(null); };
      document.addEventListener('keydown', key);
      return () => document.removeEventListener('keydown', key);
    }, [editKey]);
    const save = () => { const r = onCorrect(ed.ei, ed.si, {w: ed.w, r: ed.r}); if (r.ok) setEd(null); else setEd(Object.assign({}, ed, {err: r})); };
    return html`<div class="wkv">
      <div class="wk-head"><button type="button" class="btn" onClick=${onBack}>رجوع</button><div class="wk-title"><h1>${wkTitle(w)}</h1><p class="wk-meta">${wkWhen(w)}</p></div></div>
      <p class="small muted">المدة <bdi dir="ltr" class="num">${formatClock(w.endedAt - w.startedAt)}</bdi> · <bdi class="num">${Math.round(volumeOf(allSets(w)))}</bdi> كجم${rc ? html` · <bdi>${rc}</bdi> رقم قياسي` : null}</p>
      ${w.exercises.map((e, ei) => html`<section class="panel wk-ex" key=${ei + ':' + e.exId}>
        <h2><button type="button" class="wk-link" onClick=${() => onExercise(e.exId)}><bdi>${e.name}</bdi></button></h2>
        ${e.sets.map((s, si) => {
          const f = rec.flags[w.id + ':' + ei + ':' + si];
          if (ed && ed.ei === ei && ed.si === si) {
            const err = ed.err;
            return html`<form class="wk-hedit" key=${si} onSubmit=${ev => { ev.preventDefault(); save(); }}>
              <span class="wk-no num">${si + 1}</span>
              <input class="wk-in" type="text" inputmode="decimal" dir="ltr" autocomplete="off" aria-label=${e.name + '، مجموعة ' + (si + 1) + '، الوزن بالكيلو'} aria-invalid=${err && err.field === 'w' ? 'true' : 'false'} value=${ed.w} onInput=${ev => setEd(Object.assign({}, ed, {w: ev.target.value, err: null}))} />
              <input class="wk-in" type="text" inputmode="numeric" dir="ltr" autocomplete="off" aria-label=${e.name + '، مجموعة ' + (si + 1) + '، التكرارات'} aria-invalid=${err && err.field === 'r' ? 'true' : 'false'} value=${ed.r} onInput=${ev => setEd(Object.assign({}, ed, {r: ev.target.value, err: null}))} />
              <span class="wk-hedit-act"><button type="submit" class="btn primary">احفظ</button><button type="button" class="btn" onClick=${() => setEd(null)}>لأ</button></span>
              ${err ? html`<p class="form-err" role="alert">${err.error}</p>` : null}
            </form>`;
          }
          return html`<div class="wk-hrow" key=${si}><span class="wk-no num">${si + 1}</span><${Kg} s=${s} />${f ? html`<span class="mk"><${Star} />رقم قياسي · ${recWords(f)}</span>` : null}<button type="button" class="btn ghost wk-hfix" data-fix=${ei + ':' + si} aria-label=${'عدّل مجموعة ' + (si + 1) + ' من ' + e.name} onClick=${() => setEd({ei, si, w: String(s.w), r: String(s.r), err: null})}>عدّل</button></div>`;
        })}
      </section>`)}
      <button type="button" class="btn danger" onClick=${onDelete}>امسح التمرينة</button>
    </div>`;
  }

  function ExerciseScreen({exId, name, rec, workouts, onOpen, onBack}){
    const pe = rec.perExercise[exId], list = byNewest(workouts.filter(w => w.exercises.some(e => e.exId === exId)));
    return html`<div class="wkv">
      <div class="wk-head"><button type="button" class="btn" onClick=${onBack}>رجوع</button><div class="wk-title"><h1><bdi>${name}</bdi></h1></div></div>
      ${pe ? html`<div class="panel wk-best">
        <p>أعلى وزن: <b><bdi class="num">${pe.bestWeight.value}</bdi> كجم</b> <span class="small muted">· ${wkDay(pe.bestWeight.date)}</span></p>
        <p>أكتر تكرارات: <b><bdi class="num">${pe.bestReps.value}</bdi></b> <span class="small muted">· ${wkDay(pe.bestReps.date)}</span></p>
      </div>` : html`<p class="empty">لسه مفيش تمرينات متسجلة للتمرين ده.</p>`}
      ${list.map(w => html`<button type="button" class="panel wk-card" key=${w.id} onClick=${() => onOpen(w.id)}>
        <span class="wk-card-head"><b>${wkTitle(w)}</b><span class="small muted">${wkWhen(w)}</span></span>
        <span class="small">${w.exercises.filter(e => e.exId === exId).reduce((a, e) => a.concat(e.sets), []).map((x, i) => html`${i ? '، ' : ''}<${Kg} s=${x} />`)}</span>
      </button>`)}
    </div>`;
  }

  // Every exercise, searchable. Own exercises can be added; one with no history and in no routine can be deleted.
  function ExercisesScreen({all, workouts, routines, onOpen, onAdd, onDelete}){
    const [q, setQ] = useState('');
    const [nm, setNm] = useState('');
    const [err, setErr] = useState('');
    const [ask, setAsk] = useState(null);
    const nq = normName(q);
    const shown = nq ? all.filter(x => normName(x.name).indexOf(nq) >= 0) : all;
    return html`<div class="wk-exs">
      <label class="field"><span>دوّر على تمرين</span>
        <input type="text" value=${q} autocomplete="off" onInput=${e => setQ(e.target.value)} />
      </label>
      <div class="panel wk-picklist">
        ${shown.length ? shown.map(x => {
          const own = x.id.indexOf('s-') !== 0, d = own ? canDeleteExercise(x.id, workouts, routines) : null;
          return html`<div class="wk-exrow" key=${x.id}>
            <button type="button" class="wk-pick" onClick=${() => onOpen(x.id)}><bdi>${x.name}</bdi></button>
            ${d && d.ok && ask !== x.id ? html`<button type="button" class="btn danger" aria-label=${'امسح ' + x.name} onClick=${() => setAsk(x.id)}>امسح</button>` : null}
            ${d && d.ok && ask === x.id ? html`<span class="wk-ask">متأكد؟ <button type="button" class="btn danger" onClick=${() => { setAsk(null); onDelete(x.id); }}>أيوه، امسح</button> <button type="button" class="btn" onClick=${() => setAsk(null)}>لأ</button></span>` : null}
            ${d && !d.ok ? html`<span class="small muted">${d.reason === 'history' ? 'التمرين ده ليه سجل' : html`التمرين ده في سبليت: <bdi>${d.routineName}</bdi>`}</span>` : null}
          </div>`;
        }) : html`<p class="empty">مفيش تمرين بالاسم ده.</p>`}
      </div>
      <form class="panel wk-exadd" onSubmit=${e => { e.preventDefault(); const r = onAdd(nm); if (r) setErr(r); else { setNm(''); setErr(''); } }}>
        <label class="field"><span>ضيف تمرين</span>
          <input type="text" value=${nm} autocomplete="off" onInput=${e => { setNm(e.target.value); setErr(''); }} />
        </label>
        <button type="submit" class="btn primary"><${Plus} />ضيف تمرين</button>
        ${err ? html`<p class="form-err" role="alert">${err}</p>` : null}
      </form>
    </div>`;
  }

  /* routines: the user's own split (Push, Pull, Legs, or anything else), each exercise with a planned set count */
  const routineLine = (r, names) => r.exIds.map((id, i) => (r.sets[i] || 1) + ' × ' + (names[id] || id)).join('، ');

  function RoutineCards({routines, workouts, names, onOpen, onNew, onEdit, onDelete}){
    const [menu, setMenu] = useState(null);
    const [ask, setAsk] = useState(null);
    return html`<section class="sec wk-routines">
      <div class="sec-head"><h2>سبليتاتي (<bdi>${routines.length}</bdi>)</h2><button type="button" class="btn" onClick=${onNew}><${Plus} />سبليت جديد</button></div>
      ${routines.length ? html`<div class="wk-rgrid">${routines.map(r => {
        const last = routineLastUsed(r.name, workouts);
        return html`<div class="panel wk-rcard" key=${r.id}>
          <div class="wk-rcard-head">
            <button type="button" class="wk-link" onClick=${() => onOpen(r.id)}><b><bdi>${r.name}</bdi></b></button>
            <button type="button" class="icon-btn" aria-label=${'خيارات ' + r.name} aria-expanded=${menu === r.id ? 'true' : 'false'} onClick=${() => { setAsk(null); setMenu(menu === r.id ? null : r.id); }}><${Dots} /></button>
          </div>
          ${menu === r.id ? html`<div class="wk-menu">${ask === r.id
            ? html`<span class="wk-ask">تمسح السبليت؟ التمرينات اللي خلصتها منه هتفضل. <button type="button" class="btn danger" onClick=${() => { setMenu(null); setAsk(null); onDelete(r.id); }}>أيوه، امسحه</button> <button type="button" class="btn" onClick=${() => setAsk(null)}>لأ</button></span>`
            : html`<button type="button" class="btn" onClick=${() => { setMenu(null); onEdit(r.id); }}>عدّل</button><button type="button" class="btn danger" onClick=${() => setAsk(r.id)}>امسح</button>`}</div>` : null}
          <button type="button" class="wk-rcard-body" onClick=${() => onOpen(r.id)}>
            <span class="small muted wk-clamp" dir="auto">${routineLine(r, names)}</span>
            <span class="small muted">${last === null ? 'لسه ما اتعملش' : html`آخر مرة: ${wkDay(last)}`}</span>
          </button>
        </div>`;
      })}</div>` : html`<p class="empty">اعمل سبليت لكل يوم في تقسيمتك (مثلاً Push و Pull و Legs) وابدأ منه بضغطة.</p>`}
    </section>`;
  }

  function RoutinePage({r, names, workouts, onStart, onEdit, onBack}){
    const last = routineLastUsed(r.name, workouts);
    return html`<div class="wkv">
      <div class="wk-head"><button type="button" class="btn" onClick=${onBack}>رجوع</button><div class="wk-title"><h1><bdi>${r.name}</bdi></h1>${last === null ? null : html`<p class="wk-meta">آخر مرة: ${wkDay(last)}</p>`}</div><button type="button" class="btn" onClick=${onEdit}>عدّل</button></div>
      <div class="panel wk-picklist">${r.exIds.map((id, i) => html`<p class="wk-rline" key=${id}><bdi class="num">${r.sets[i] || 1}</bdi> × <bdi>${names[id] || id}</bdi></p>`)}</div>
      <button type="button" class="btn primary wk-wide" onClick=${onStart}>ابدأ التمرينة</button>
    </div>`;
  }

  // Create or edit a routine. Nothing is saved until «احفظ»; the exercise picker is the one used inside a workout.
  function RoutineEditor({r, all, routines, onSave, onCreateExercise, onCancel}){
    const [name, setName] = useState(r ? r.name : '');
    const [items, setItems] = useState(() => r ? r.exIds.map((exId, i) => ({exId, n: r.sets[i] || 1})) : []);
    const [err, setErr] = useState('');
    const [picking, setPicking] = useState(false);
    const nameOf = id => (all.find(x => x.id === id) || {}).name || id;
